name: CI

# The gates the release runbook requires, run on every PR — so they can't rot
# silently and then block a release (#298). Before this, no workflow ran
# `cargo fmt`, `cargo clippy` or `cargo test` at all: `release.yml` only builds,
# so the suite's green-ness rested on whoever last ran it locally.
#
# To fix a failure locally, from `cli/`:
#   cargo fmt --all
#   cargo clippy --all-targets -- -D warnings
#   cargo test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    # The suite spawns the built binary in a lot of integration tests; a hang
    # there would otherwise sit on a runner for six hours.
    timeout-minutes: 30
    steps:
      # v6, matching release.yml — v4 still targets Node 20 and makes every run
      # carry a deprecation annotation.
      - uses: actions/checkout@v6

      # `cli/rust-toolchain.toml` is the single source of truth for the compiler
      # version — read it here rather than restating it, so the pin can't drift
      # between CI and a developer's checkout.
      - name: Read pinned toolchain
        id: pin
        run: |
          # POSIX sed, not `grep -oP` — PCRE isn't available in every shell this
          # might get run in (Git Bash on Windows rejects `-P` outright), and a
          # portable expression is one a maintainer can verify locally.
          channel=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' cli/rust-toolchain.toml | head -1)
          if [ -z "$channel" ]; then
            echo "::error::could not read [toolchain] channel from cli/rust-toolchain.toml"
            exit 1
          fi
          echo "Pinned toolchain: $channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.pin.outputs.channel }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          components: rustfmt, clippy

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      # Same Linux build deps release.yml installs — the crate links libsecret
      # and libdbus for credential storage.
      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install -y clang libsecret-1-dev libdbus-1-dev pkg-config

      - name: cargo fmt --check
        working-directory: cli
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        working-directory: cli
        run: cargo clippy --all-targets -- -D warnings

      # `clippy::string_slice` is a `restriction` lint, so the step above does not
      # enable it and a hard-coded byte offset into a `str` reaches users as a
      # process abort — `aware search` shipped `&desc[..97]` and four command
      # descriptions already in `20-agents/` crashed it. The script narrows to the
      # offsets that can never be shown safe rather than denying the lint wholesale;
      # its own contract is covered by `--self-test`, run first so a broken
      # classifier fails loudly instead of reporting a clean crate.
      - name: no hard-coded byte offsets into strings
        working-directory: cli
        run: |
          python3 scripts/no-hardcoded-string-offsets.py --self-test
          python3 scripts/no-hardcoded-string-offsets.py

      - name: cargo test
        working-directory: cli
        run: cargo test

  # The IFC bridge is a Node package, so `cargo test` never touches it — its suite only ever ran on
  # whoever last remembered to. That is how `read-model` shipped returning a different coordinate
  # frame from `probe` (#343): the bridge's own tests encoded the wrong frame and nothing re-read
  # them. The fixtures it needs are in-repo; the tests that want a large sample file self-skip.
  bridge:
    name: connection-reader bridge tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli-connection-reader/package-lock.json

      - name: npm ci
        working-directory: cli-connection-reader
        run: npm ci

      - name: node --test
        working-directory: cli-connection-reader
        run: node --test

  # CLAUDE.md §Git workflow: "No `Co-Authored-By: Claude ...` trailers in commit
  # messages." Nothing enforced it and the rule was being broken — 8 of the 50
  # commits reachable in a depth-50 clone carry one, the most recent on
  # 2026-08-05 (b0ee11b5, #362). Those cannot be fixed: the same section makes
  # `main` append-only ("no force-push, no rewrite"). Catching the trailer on the
  # branch is the only fix available, because GitHub copies it from the branch's
  # commits (and from the PR body) into the squash commit — after which it is on
  # `main` for good.
  #
  # Pull requests only: the range is the PR's own commits, which `push` has no
  # equivalent of, and re-checking `main` would just re-report the eight
  # unfixable ones on every push.
  #
  # To fix a failure locally:  python3 scripts/no-claude-coauthor-trailers.py --range main..HEAD
  trailers:
    name: no Claude co-author trailers
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `fetch-depth: 0` is load-bearing: the default shallow checkout cannot
      # reach the base commit, so the range would fail to resolve rather than
      # come back clean.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The negative control runs first, so a classifier that has stopped
      # matching anything fails loudly instead of reporting a clean branch.
      - name: Self-test the trailer classifier
        run: python3 scripts/no-claude-coauthor-trailers.py --self-test

      # The body is written to a file rather than interpolated into the shell:
      # `${{ }}` inside a `run:` splices attacker-controlled text into the
      # script, and a PR description is exactly that.
      - name: Check the PR's commits and body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
          python3 scripts/no-claude-coauthor-trailers.py \
            --range "$BASE_SHA..$HEAD_SHA" \
            --message-file "$RUNNER_TEMP/pr-body.txt"
