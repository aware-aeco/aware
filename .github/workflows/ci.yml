name: CI

# The gates the release runbook requires, run on every PR — so they can't rot
# silently and then block a release (#298). Before this, no workflow ran
# `cargo fmt`, `cargo clippy` or `cargo test` at all: `release.yml` only builds,
# so the suite's green-ness rested on whoever last ran it locally.
#
# To fix a failure locally, from `cli/`:
#   cargo fmt --all
#   cargo clippy --all-targets -- -D warnings
#   cargo test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    # The suite spawns the built binary in a lot of integration tests; a hang
    # there would otherwise sit on a runner for six hours.
    timeout-minutes: 30
    steps:
      # v6, matching release.yml — v4 still targets Node 20 and makes every run
      # carry a deprecation annotation.
      - uses: actions/checkout@v6

      # `cli/rust-toolchain.toml` is the single source of truth for the compiler
      # version — read it here rather than restating it, so the pin can't drift
      # between CI and a developer's checkout.
      - name: Read pinned toolchain
        id: pin
        run: |
          # POSIX sed, not `grep -oP` — PCRE isn't available in every shell this
          # might get run in (Git Bash on Windows rejects `-P` outright), and a
          # portable expression is one a maintainer can verify locally.
          channel=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' cli/rust-toolchain.toml | head -1)
          if [ -z "$channel" ]; then
            echo "::error::could not read [toolchain] channel from cli/rust-toolchain.toml"
            exit 1
          fi
          echo "Pinned toolchain: $channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      # `targets:` is load-bearing, not tidiness — it is what makes the
      # "clippy (windows target)" step below possible. Declared here so the
      # target is installed by the same action that pins the compiler, and the
      # cross-check therefore runs on the pinned toolchain rather than whatever
      # a later `rustup target add` happened to attach it to.
      - name: Install Rust ${{ steps.pin.outputs.channel }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          # Two workspaces, not one: `20-agents/.../steel-detailer-lookup`
          # declares its own `[workspace]`, so `cli`'s cache never covered it.
          workspaces: |
            cli
            20-agents/aeco/engineering/steel-detailer-lookup

      # Same Linux build deps release.yml installs — the crate links libsecret
      # and libdbus for credential storage.
      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install -y clang libsecret-1-dev libdbus-1-dev pkg-config

      # A pinned toolchain is only half the pin — `Cargo.lock` is the other half,
      # and nothing checked it. Every cargo invocation here resolved without
      # `--locked`, and cargo REPAIRS a stale lock as a silent side effect of
      # resolving, so a lockfile disagreeing with its manifest was rewritten
      # inside the runner and the job went green on a tree that does not build
      # reproducibly. That is how `cli/Cargo.lock` came to record `aware 0.122.0`
      # against a manifest reading `0.123.0`: the v0.123.0 release commit bumped
      # `Cargo.toml` alone, and `cargo build --locked` / `cargo install --locked`
      # failed outright on `main` from then on, with every check green.
      #
      # TWO checks, because neither alone is sufficient — both measured:
      #
      #   * `git diff --exit-code` catches a lock some EARLIER step already
      #     repaired. `Swatinem/rust-cache` shells out to `cargo metadata` for its
      #     cache key, and after such a repair `cargo metadata --locked` exits 0 —
      #     the gate defeated, silently. Against a committed stale pair, a resolve
      #     rewrites the lock and `git diff --exit-code` then exits 1 while
      #     `--locked` exits 0. This half is what makes the check independent of
      #     where it sits in the job.
      #   * `cargo metadata --locked` catches drift nothing has repaired yet, and
      #     names the offending crate.
      #
      # NOT `--no-deps`, however tempting: it skips resolution, so it downloads
      # nothing (0 archives) but also detects nothing — measured against the real
      # stale lock it exits 0 where the full resolve exits 101. It would leave a
      # step that looks like a gate and is not.
      #
      # AFTER the cache step, deliberately. `cargo metadata --locked` resolves the
      # whole graph and fetches it: against a cold `CARGO_HOME` it downloads 408
      # `.crate` archives for `cli` alone. Run before the cache that is pure
      # waste, repeated every job and thrown away; run after it, the same fetch is
      # work `cargo clippy` and `cargo test` need anyway (Codex review, PR #416).
      # The `git diff` half is what keeps that move safe.
      #
      # Both crates — `steel-detailer-lookup` is the repo's other Rust binary and
      # ships in the same archive. `cli/tests/lockfile_gate.rs` asserts this step
      # still carries both halves and still names both crates.
      #
      # To fix a failure, in the directory it names:
      #   cargo generate-lockfile        # then commit the updated Cargo.lock
      - name: lockfiles agree with their manifests
        run: |
          if ! git diff --exit-code -- cli/Cargo.lock 20-agents/aeco/engineering/steel-detailer-lookup/Cargo.lock; then
            echo "::error::a step before this one rewrote a Cargo.lock, which means the committed lock did not match its manifest — run 'cargo generate-lockfile' in the crate shown above and commit the result"
            exit 1
          fi
          for crate in cli 20-agents/aeco/engineering/steel-detailer-lookup; do
            echo "checking $crate/Cargo.lock"
            if ! (cd "$crate" && cargo metadata --locked --format-version 1 >/dev/null); then
              echo "::error::$crate/Cargo.lock is out of sync with $crate/Cargo.toml — run 'cargo generate-lockfile' in $crate and commit the result"
              exit 1
            fi
          done

      - name: cargo fmt --check
        working-directory: cli
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        working-directory: cli
        run: cargo clippy --all-targets --locked -- -D warnings

      # The step above compiles for the HOST only, so every `#[cfg(windows)]` and
      # `#[cfg(target_os = "macos")]` line in `cli/src` is invisible to it — 262
      # lines across six files, `commands/model_reader_host.rs` (the v0.131.0
      # managed Windows host) being 182 of them. Nothing else reached them
      # either: `release.yml` and `bridge-windows-packaged` DO build the crate on
      # Windows, but with `cargo build`, and rustc accepts and then ignores
      # `clippy::` tool lints. So all three of CLAUDE.md §Code style's mechanised
      # rules — `cargo clippy -D warnings`, the crate-root
      # `deny(clippy::unwrap_used, clippy::expect_used)` in `src/main.rs`, and
      # `undocumented_unsafe_blocks` in `Cargo.toml` — applied to none of that
      # code.
      #
      # Measured, not assumed: an `unwrap()` planted in the `#[cfg(windows)]`
      # `process_is_alive` in `src/runtime/pidfile.rs` passes the step above with
      # zero errors and is rejected here with `used `unwrap()` on a `Result``.
      #
      # `x86_64-pc-windows-gnu`, not `-msvc`, and the difference is a Linux
      # runner's C toolchain: `ring` and `zstd-sys` build C for the target, and
      # their build scripts refuse an msvc target under GNU cc ("GNU compiler is
      # not supported for this target"), while the gnu target needs only mingw.
      # The two triples differ solely under `target_env`, so gnu is a faithful
      # proxy for the shipped msvc binary exactly as long as no `target_env` cfg
      # exists — which `cli/tests/windows_target_gate.rs` is what enforces.
      #
      # Check-only. Nothing is linked and nothing is run, so this is not a
      # Windows build and does not duplicate one.
      #
      # This step closes the WINDOWS half only — a windows target compiles no
      # `#[cfg(target_os = "macos")]` arm. The macOS half is the `gates-macos`
      # job below, which has to be a real macOS runner for reasons measured
      # there. Neither is coverage for the other.
      - name: cargo clippy -D warnings (windows target)
        working-directory: cli
        env:
          CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
          AR_x86_64_pc_windows_gnu: x86_64-w64-mingw32-ar
        run: |
          sudo apt-get install -y gcc-mingw-w64-x86-64
          cargo clippy --target x86_64-pc-windows-gnu --all-targets --locked -- -D warnings

      # `clippy::string_slice` is a `restriction` lint, so the step above does not
      # enable it and a hard-coded byte offset into a `str` reaches users as a
      # process abort — `aware search` shipped `&desc[..97]` and four command
      # descriptions already in `20-agents/` crashed it. The script narrows to the
      # offsets that can never be shown safe rather than denying the lint wholesale;
      # its own contract is covered by `--self-test`, run first so a broken
      # classifier fails loudly instead of reporting a clean crate.
      - name: no hard-coded byte offsets into strings
        working-directory: cli
        run: |
          python3 scripts/no-hardcoded-string-offsets.py --self-test
          python3 scripts/no-hardcoded-string-offsets.py

      - name: cargo test
        working-directory: cli
        run: cargo test --locked

      # `20-agents/aeco/engineering/steel-detailer-lookup` is the repo's *other*
      # Rust crate — the deterministic clause/section lookup that ships inside
      # every install archive next to `aware` (release.yml builds it; install.sh,
      # install.ps1 and packaging/wix/aware.wxs all place it). It declares its own
      # `[workspace]`, so `cd cli && cargo …` has never reached it and no gate ran
      # on it at all: not fmt, not clippy, not its five unit tests. The only thing
      # that ever compiled it was `cargo build --release` at release time, which
      # runs neither clippy nor the suite.
      #
      # That is how it accumulated six `unwrap()` calls in non-test code against
      # CLAUDE.md §Code style, and stayed on edition 2021 against the 2024 pin in
      # §Tech stack, with CI green throughout. Same three gates as `cli/` above,
      # same pinned toolchain; it links nothing, so it needs none of the apt deps.
      - name: steel-detailer-lookup — fmt + clippy + test
        working-directory: 20-agents/aeco/engineering/steel-detailer-lookup
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

  # The windows cross-check in `gates` closes the WINDOWS half of the
  # platform-gated lint hole and cannot close the macOS half. Measured, not
  # assumed: `cargo clippy --target aarch64-apple-darwin` from a Linux runner
  # never reaches this crate's code at all — it dies in `zstd-sys`'s build
  # script with `cc: error: unrecognized command-line option '-arch'`, because
  # the runner's `cc` is not an Apple cross-compiler and has no SDK. `ring`
  # compiles C for the target too. That is the same wall `-msvc` hits, and it is
  # why the windows step uses `-gnu`; darwin has no equivalent proxy triple,
  # because what is missing is a toolchain rather than a `target_env`.
  #
  # So macOS coverage needs a macOS runner. `release.yml` already builds this
  # crate on `macos-latest`, but with `cargo build`, and rustc accepts a
  # `clippy::` tool lint and then ignores it — precisely the reason the windows
  # cross-check exists despite `release.yml` and `bridge-windows-packaged`
  # building for Windows. Without this job `src/commands/app.rs`'s
  # `#[cfg(target_os = "macos")]` arm and `model_reader_host.rs`'s
  # `#[cfg(all(unix, not(target_os = "linux")))]` arm are checked by nothing.
  #
  # Check-only: nothing is linked and nothing is run, so it is not a second
  # macOS build and does not duplicate the release one. It needs none of the
  # apt deps either — libsecret and libdbus are the Linux credential backend;
  # on macOS the keychain binding is pure Rust.
  gates-macos:
    name: clippy (macos)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # Same single source of truth as `gates` — `cli/rust-toolchain.toml`, read
      # rather than restated, so the two jobs cannot drift onto different
      # compilers and disagree about what a lint is.
      - name: Read pinned toolchain
        id: pin
        run: |
          channel=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' cli/rust-toolchain.toml | head -1)
          if [ -z "$channel" ]; then
            echo "::error::could not read [toolchain] channel from cli/rust-toolchain.toml"
            exit 1
          fi
          echo "Pinned toolchain: $channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.pin.outputs.channel }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          components: clippy

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      # No `--target`: the point of this job is that the HOST cfg set is the
      # macOS one. `--all-targets` so `cli/tests/` is compiled too, `--locked`
      # so it fails on a stale lockfile rather than resolving around it, and
      # `-D warnings` because clippy otherwise prints and exits 0.
      - name: cargo clippy -D warnings (macos)
        working-directory: cli
        run: cargo clippy --all-targets --locked -- -D warnings

  # The IFC bridge is a Node package, so `cargo test` never touches it — its suite only ever ran on
  # whoever last remembered to. That is how `read-model` shipped returning a different coordinate
  # frame from `probe` (#343): the bridge's own tests encoded the wrong frame and nothing re-read
  # them. The fixtures it needs are in-repo; the tests that want a large sample file self-skip.
  bridge:
    name: connection-reader bridge tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: cli-connection-reader/package-lock.json

      - name: npm ci
        working-directory: cli-connection-reader
        run: npm ci

      - name: node --test
        working-directory: cli-connection-reader
        run: node --test

      - name: Verify portable private compiler authority
        run: node --test cli/build-windows-internal-repro.test.mjs cli/create-windows-internal-repro-inputs.test.mjs cli/windows-compiler-closure.test.mjs

  # The repo's Python tests. Same hole as `cli-connection-reader` above, as
  # `steel-detailer-lookup`, and as the six .NET suites below — a real regression
  # suite that NO workflow ran. `20-agents/aeco/visualization/blender/tests/`
  # carries seven `test_*.py` files; `cargo test` never leaves `cli/`,
  # `release.yml` only builds, and no workflow mentioned Python except three
  # single-purpose scripts of its own (two of them in this file), so their
  # green-ness rested on whoever last remembered to run them by hand.
  #
  # Three of the seven are actually executed here, and two of those verify
  # something: `test_look_resolution.py` and `test_environment_resolution.py` need
  # nothing but the standard library and say so in their own docstrings.
  # `test_scene_info_skips.py` defaults its `--aware-bin` and checks for Blender
  # before using it, so it starts, clears its imports, and self-skips — real
  # coverage of that file's startup path, reported as a skip rather than a pass.
  #
  # The other four are not run here. Two need a real Blender with `ifcopenshell`;
  # two mark `--aware-bin` `required=True`. Neither is impossible on a hosted
  # runner — both packages publish manylinux wheels — so this is a cost decision
  # (a 355 MB download per run, or a second Rust build), not a limitation, and
  # saying otherwise would be a claim nobody checked. The runner reports every
  # skip it classifies BY NAME, and fails outright if NO test reaches a pass, so
  # "covered" and "never ran" cannot come to look alike in the log.
  #
  # That second half is not nothing: it is what had already rotted.
  # `test_material_resolution.py` and `test_import_reconciliation.py` died on a
  # `ModuleNotFoundError` traceback the moment they were launched outside
  # Blender, while their five siblings skipped cleanly — so a contributor without
  # Blender could not tell "needs a host" from "broken", and nothing said which.
  #
  # No `--aware-bin` is passed, deliberately. Two tests require one, and supplying
  # it would mean building the CLI again in this job (minutes) to reach a test
  # that skips one line later for want of Blender regardless. They are reported
  # as skipped-for-want-of-a-binary rather than quietly dropped — and the runner
  # establishes that by launching each test and reading argparse's own answer on
  # stderr, never by assuming a file that mentions the flag must require it.
  #
  # `--self-test` first, same shape as the string-offsets gate above: without it,
  # a runner that had stopped classifying failures as failures would report every
  # repo green forever. `cli/tests/agent_python_suites_gate.rs` asserts this step
  # still carries both halves.
  agent-python-tests:
    name: agent Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          # Pinned, not "3.x" (review, PR #444): a floating interpreter lets the
          # suite drift under a new Python with no signal, and the tests here are
          # the kind that would notice.
          python-version: "3.12"

      - name: run every Python test in the repo
        run: |
          python3 scripts/run-agent-python-tests.py --self-test
          python3 scripts/run-agent-python-tests.py

  bridge-windows-packaged:
    name: connection-reader packaged RVT/IFC harness
    runs-on: windows-latest
    # Two fresh compiler/SDK copies plus debug-event audits precede the packaged host build.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: cli-connection-reader/package-lock.json

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Configure the native x64 compiler environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Verify private builder authority
        run: node --test cli/build-windows-internal-repro.test.mjs cli/create-windows-internal-repro-inputs.test.mjs cli/windows-compiler-closure.test.mjs

      - name: Verify native vendor-path reproducibility
        run: node cli/windows-vendor-repro.native.mjs

      - name: Build source AWARE host
        run: cargo build --manifest-path cli/Cargo.toml --locked

      - name: npm ci
        working-directory: cli-connection-reader
        run: npm ci

      - name: Clean-stage SEA/provider harness
        working-directory: cli-connection-reader
        run: npm run test:windows-harness

  # Every OTHER .NET bridge suite in the repo. `tekla-bridge` below has run since
  # it was written, and that made it look like the .NET side was covered — it was
  # the only one of seven. `cli-revit/Tests`, `cli-rhino/Tests`,
  # `cli-roslyn/Tests`, `cli-sidecar/Tests`, `cli-sidecar/Ingest/Generator/Tests`
  # and `cli-sketchup/Tests` are 529 xunit tests that NO workflow ran: not this
  # one, not `release.yml` (which only ever `dotnet publish`es the bridges it
  # ships), not `build-sidecar.yml`. Same shape as the `steel-detailer-lookup`
  # hole above and the `cli-connection-reader` one before it — a suite whose
  # green-ness rested on whoever last remembered to run it.
  #
  # It was not hypothetical: the v0.125.0 scene-contract change (5255a3bb)
  # edited `cli-rhino/Tests/CrossSectionProfileTests.cs` and shipped with nothing
  # having executed the file.
  #
  # Split by target framework, not by taste. `cli-roslyn`, `cli-sidecar` and the
  # sidecar's ingest generator are plain `net10.0` and run here. The other three
  # target `net*-windows` and get the windows job below: `cli-rhino` and
  # `cli-sketchup` genuinely fail off Windows (rhino's stubs are `.cmd` batch
  # files; sketchup asserts on a `D:\…\Plugins` path), so running them on ubuntu
  # with `-p:EnableWindowsTargeting=true` would mean a red gate or a weakened
  # test.
  #
  # `cli/tests/dotnet_suites_gate.rs` asserts every project in the repo that
  # `dotnet test` can run — identified by its own metadata, NOT by a filename
  # convention — is named by an isolated `run:` job below, so an
  # eighth suite cannot arrive unrun. The generator suite above is why it reads
  # metadata: its file is plain `Tests.csproj`, and a `*.Tests.csproj` gate
  # reported the repo clean while those 46 tests ran nowhere (Codex review, #433).
  dotnet-roslyn:
    name: .NET tests — Roslyn
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test cli-roslyn
        run: dotnet test cli-roslyn/Tests/aware-roslyn.Tests.csproj -c Release -- RunConfiguration.TreatNoTestsAsError=true

  dotnet-sidecar:
    name: .NET tests — sidecar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test cli-sidecar
        run: dotnet test cli-sidecar/Tests/cli-sidecar.Tests.csproj -c Release -- RunConfiguration.TreatNoTestsAsError=true

  dotnet-generator:
    name: .NET tests — ingest generator
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test cli-sidecar ingest generator
        run: dotnet test cli-sidecar/Ingest/Generator/Tests/Tests.csproj -c Release -- RunConfiguration.TreatNoTestsAsError=true

  # The `net*-windows` half of the split described above.
  # Separate from `tekla-bridge` so a Tekla publish failure and a bridge-suite
  # failure stay legible as different things.
  #
  # Two SDKs: `cli-revit/Tests` is `net8.0-windows`, the other two `net10.0-windows`.
  dotnet-revit:
    name: .NET tests — Revit
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Test cli-revit
        run: dotnet test cli-revit/Tests/cli-revit.Tests.csproj -c Release -- RunConfiguration.TreatNoTestsAsError=true

  dotnet-rhino:
    name: .NET tests — Rhino
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Test cli-rhino
        run: dotnet test cli-rhino/Tests/cli-rhino.Tests.csproj -c Release -- RunConfiguration.TreatNoTestsAsError=true

  dotnet-sketchup:
    name: .NET tests — SketchUp
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Test cli-sketchup
        run: dotnet test cli-sketchup/Tests/cli-sketchup.Tests.csproj -c Release -- RunConfiguration.TreatNoTestsAsError=true

  tekla-bridge:
    name: Tekla bridge build + test + SHA artifact
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test net48 bridge
        run: dotnet test cli-tekla/Tests/AwareTekla.Tests.csproj -c Release -- RunConfiguration.TreatNoTestsAsError=true

      # The proprietary Tekla assemblies are intentionally absent from hosted
      # runners. The same script is semantically compiled against installed
      # 2025/2026 SDKs by the mandatory local gate; CI still proves the generic
      # bridge and publishes the exact reviewed binary for live-host QA.
      - name: Publish bridge
        shell: pwsh
        run: dotnet publish cli-tekla/cli-tekla.csproj -c Release -o ".tmp/aware-tekla/${{ github.sha }}"

      - name: Package SHA-addressed bridge
        shell: pwsh
        run: Compress-Archive -Path ".tmp/aware-tekla/${{ github.sha }}/*" -DestinationPath ".tmp/aware-tekla-${{ github.sha }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: aware-tekla-${{ github.sha }}
          path: .tmp/aware-tekla-${{ github.sha }}.zip
          if-no-files-found: error
