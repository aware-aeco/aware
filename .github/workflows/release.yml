name: Release

on:
  push:
    tags:
      # All v0.x and v1+ versions. The first pattern matches v0.0.x through
      # v0.99.x; the second matches v1.x and later majors. We used to enumerate
      # each minor (v0.6.*, v0.7.*, ...) but that broke at v0.10.0 — the new
      # patterns are forward-compatible.
      - 'v0.[0-9]*.*'
      - 'v[1-9]*.*.*'
  # Kept for tag.yml, which creates the release tag from inside Actions and then
  # dispatches THIS workflow at that tag — a tag written by GITHUB_TOKEN raises
  # no `push` event, and workflow_dispatch is the documented exception to that
  # suppression. Removing it would strand every release that cannot push a tag.
  #
  # It is not a way to release off a branch, and reaching for it as one is the
  # trap worth naming: the version comes from GITHUB_REF_NAME, so the staging
  # step below falls back to 0.0.0-dev, and the release and publish-npm jobs
  # both gate on refs/tags/v and never run. Dispatch tag.yml instead.
  #
  # What a dispatch off `main` IS good for is a signing dry run: it builds,
  # signs and verifies the Windows binaries exactly as a release would, and
  # publishes nothing. `sign: false` stops before signing, for exercising the
  # build and packaging on a branch the signing gate would refuse.
  workflow_dispatch:
    inputs:
      sign:
        description: "Sign and verify the Windows binaries (ignored on a tag: a release always signs)"
        type: boolean
        default: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            ext: .exe
            archive: zip
            archive_ext: .zip
          - os: ubuntu-latest
            rid: linux-x64
            ext: ""
            archive: tar
            archive_ext: .tar.gz
          - os: macos-latest
            rid: osx-arm64
            ext: ""
            archive: tar
            archive_ext: .tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      # Read the repository pin explicitly because this job builds Rust from
      # more than one working directory.
      - name: Read pinned toolchain
        id: pin
        shell: bash
        run: |
          channel=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' cli/rust-toolchain.toml | head -1)
          if [ -z "$channel" ]; then
            echo "::error::could not read [toolchain] channel from cli/rust-toolchain.toml"
            exit 1
          fi
          echo "Pinned toolchain: $channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.pin.outputs.channel }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pin.outputs.channel }}

      - name: Install Node (for the connection-reader SEA bridge build)
        uses: actions/setup-node@v6
        with:
          node-version: '24.14.0'

      - name: Install .NET SDKs (8 / 9 / 10)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Install clang on Linux
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y clang libsecret-1-dev libdbus-1-dev pkg-config

      - name: Sync crate version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "Syncing cli/Cargo.toml [package] version to $version"
          # Replace only the FIRST `version = "..."` line (the [package] version);
          # dependency version specs further down are left untouched. awk ships on
          # all three runners (incl. Git Bash on windows-latest), so this is portable
          # where BSD/GNU `sed -i` and `0,/re/` address ranges are not.
          awk -v v="$version" 'BEGIN{done=0} !done && /^version[[:space:]]*=/ {print "version     = \"" v "\""; done=1; next} {print}' cli/Cargo.toml > cli/Cargo.toml.tmp
          mv cli/Cargo.toml.tmp cli/Cargo.toml
          grep -m1 '^version' cli/Cargo.toml

      - name: Build Rust CLI (release)
        working-directory: cli
        env:
          # Google "Desktop app" client secret, baked in at compile time via
          # option_env! (see cli/src/auth/config.rs + cli/build.rs). Non-confidential
          # per Google's native-app model, but kept in CI secrets rather than source
          # to avoid quota-abuse bots + secret scanners. M365 needs no secret.
          AWARE_GOOGLE_CLIENT_SECRET: ${{ secrets.AWARE_GOOGLE_CLIENT_SECRET }}
        run: cargo build --release

      - name: Build steel-detailer lookup binaries (agent transport)
        # Deterministic clause/section lookup for the steel-detailer-us / -uk / -eu
        # agents — no LLM in the run path (decalog #9). One source, three [[bin]]
        # names; the binary picks its rule set from argv[0]. Its own cargo workspace
        # under 20-agents/, so it needs its own build invocation.
        #
        # Unlike the host bridges below, this is portable Rust with no host
        # dependency, so it builds on all three runners and ships INSIDE the main
        # archive next to `aware` (~284 KB each) rather than as a separate
        # `aware sidecar install` asset — that path is Windows-only by construction
        # (see cli/src/commands/sidecar.rs, which hardcodes a win-x64 asset name).
        # Next to `aware` means the install dir's PATH entry resolves it, which is
        # what invoker.rs falls back to for non-bridge binaries.
        working-directory: 20-agents/aeco/engineering/steel-detailer-lookup
        run: cargo build --release

      - name: Publish C# sidecar (NativeAOT)
        run: dotnet publish cli-sidecar -c Release -r ${{ matrix.rid }} -p:PublishAot=true

      - name: Publish Roslyn source reader (self-contained folder)
        # aware-roslyn hosts Roslyn (which can't go in the NativeAOT sidecar). It ships as a
        # self-contained FOLDER, NOT single-file: the .csproj/.sln path (#185) uses
        # MSBuildWorkspace, which cannot run from a single-file bundle — there Assembly.Location
        # is empty, so MSBuild's path resolution throws ("path1" null). The folder is staged
        # under `aware-roslyn/` next to aware and discovered there; still no .NET runtime needed.
        run: >-
          dotnet publish cli-roslyn -c Release -r ${{ matrix.rid }}
          --self-contained
          -p:PublishSingleFile=false

      - name: Stage artifacts
        shell: bash
        run: |
          set -e
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ] || [[ ! "$version" =~ ^[0-9] ]]; then
            version="0.0.0-dev"
          fi
          stage="aware-${version}-${{ matrix.rid }}"
          mkdir -p "$stage"
          cp "cli/target/release/aware${{ matrix.ext }}" "$stage/"
          cp "cli-sidecar/bin/Release/net10.0/${{ matrix.rid }}/publish/aware-sidecar${{ matrix.ext }}" "$stage/"
          # steel-detailer lookup transports — one per region, same binary, argv[0] picks
          # the rule set. Rules themselves arrive via `aware agent install`.
          for region in us uk eu; do
            cp "20-agents/aeco/engineering/steel-detailer-lookup/target/release/aware-steel-detailer-${region}${{ matrix.ext }}" "$stage/"
          done
          # aware-roslyn ships as a self-contained FOLDER (#185 — see the publish step). Stage the
          # whole publish dir under `aware-roslyn/`; the CLI discovers `aware-roslyn/aware-roslyn`.
          mkdir -p "$stage/aware-roslyn"
          cp -r "cli-roslyn/bin/Release/net10.0/${{ matrix.rid }}/publish/." "$stage/aware-roslyn/"
          cp LICENSE "$stage/" 2>/dev/null || echo "(no LICENSE file)" > "$stage/LICENSE"
          cp cli/README.md "$stage/README.md"
          echo "$version" > "$stage/VERSION"
          ls -la "$stage/"
          echo "STAGE_DIR=$stage" >> $GITHUB_ENV
          echo "VERSION=$version" >> $GITHUB_ENV

      - name: Archive (Linux/macOS — tar.gz)
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          tar -czf "${{ env.STAGE_DIR }}.tar.gz" "${{ env.STAGE_DIR }}"
          ls -la *.tar.gz
          echo "ARTIFACT=${{ env.STAGE_DIR }}.tar.gz" >> $GITHUB_ENV

      # The Windows zip and MSI are NOT built here: sign-windows packs them from
      # binaries it has signed, so nothing this job produces for Windows can
      # reach a user unsigned.
      - name: Upload archive artifact
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: aware-${{ env.VERSION }}-${{ matrix.rid }}
          path: ${{ env.ARTIFACT }}

      # ── Host bridges (Windows-only; separate release assets) ────────────────
      # Each bridge binary lives in its own repo sub-project. They are NOT
      # bundled in the main aware zip (Windows-only + some ship with assets).
      # Naming convention: <binary>-<version>-win-x64.<ext>
      # which is what `aware sidecar install <host>` downloads. This step only
      # STAGES each bridge into a bridge-<host>/ folder; sign-windows signs the
      # folders and packs them into those assets.

      - name: Build host bridges (Windows only)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = $env:VERSION
          Write-Host "=== Building host bridges for v$version ==="

          # 1. aware-tekla (net48, multiple DLLs → zip)
          Write-Host "--- aware-tekla (net48) ---"
          dotnet publish cli-tekla/cli-tekla.csproj -c Release
          $teklaPublish = "cli-tekla/bin/Release/net48/publish"
          $teklaStage   = "bridge-tekla"
          New-Item -ItemType Directory -Path $teklaStage -Force | Out-Null
          Copy-Item "$teklaPublish/*" "$teklaStage/" -Recurse
          Write-Host "STAGED: $teklaStage"

          # 2. aware-rhino (net10, single-file exe — ships bare, not zipped)
          Write-Host "--- aware-rhino (net10) ---"
          dotnet publish cli-rhino/cli-rhino.csproj -c Release -r win-x64
          New-Item -ItemType Directory -Path "bridge-rhino" -Force | Out-Null
          Copy-Item "cli-rhino/bin/Release/net10.0-windows/win-x64/publish/aware-rhino.exe" "bridge-rhino/"
          Write-Host "STAGED: bridge-rhino"

          # 3. aware-sketchup (net10, single-file + BridgeAssets → zip)
          Write-Host "--- aware-sketchup (net10) ---"
          dotnet publish cli-sketchup/cli-sketchup.csproj -c Release -r win-x64
          $suPublish = "cli-sketchup/bin/Release/net10.0-windows/win-x64/publish"
          $suStage   = "bridge-sketchup"
          New-Item -ItemType Directory -Path $suStage -Force | Out-Null
          Copy-Item "$suPublish/aware-sketchup.exe" "$suStage/"
          if (Test-Path "$suPublish/BridgeAssets") {
            Copy-Item -Recurse "$suPublish/BridgeAssets" "$suStage/"
          }
          Write-Host "STAGED: $suStage"

          # 4. aware-revit (net8 sidecar single-file + the IExternalApplication
          #    add-in + install-addin.ps1 → zip)
          #    UseLocalRevitApi=false makes AwareRevit.dll compile against
          #    Autodesk's reference assemblies from nuget.org instead of a local
          #    Revit install, which is what lets this runner build the add-in at
          #    all — without it the zip shipped an installer with nothing to
          #    install (issue #315).
          #    Each add-in payload goes in AwareRevit/<year>/. The zip
          #    extracts FLAT into ~/.aware/bridges/, which every bridge shares,
          #    and the add-in's net8 Roslyn assemblies have the exact same file
          #    names as aware-tekla's net48 ones — flat, they would overwrite
          #    each other. install-addin.ps1 selects the matching year.
          Write-Host "--- aware-revit (net8 sidecar + add-in) ---"
          dotnet publish cli-revit/Sidecar/cli-revit.csproj -c Release -r win-x64
          $revitPublish = "cli-revit/Sidecar/bin/Release/net8.0-windows/win-x64/publish"
          $revitStage   = "bridge-revit"
          New-Item -ItemType Directory -Path $revitStage -Force | Out-Null
          Copy-Item "$revitPublish/aware-revit.exe" "$revitStage/"
          Copy-Item "cli-revit/install-addin.ps1" "$revitStage/"
          foreach ($year in @('2025', '2026', '2027')) {
            dotnet build cli-revit/AwareRevit/AwareRevit.csproj -c Release -p:UseLocalRevitApi=false -p:RevitVersion=$year
            if ($LASTEXITCODE -ne 0) { throw "Revit $year add-in build failed" }
            $framework = if ($year -eq '2027') { 'net10.0-windows' } else { 'net8.0-windows' }
            $addinBuild = "cli-revit/AwareRevit/bin/Release/$year/$framework"
            $addinStage = "$revitStage/AwareRevit/$year"
            New-Item -ItemType Directory -Path $addinStage -Force | Out-Null
            Copy-Item "$addinBuild/*" "$addinStage/" -Recurse
            foreach ($required in @('AwareRevit.dll', 'AwareRevit.addin', 'aware-revit-version.txt')) {
              if (-not (Test-Path "$addinStage/$required")) {
                throw "aware-revit zip would ship without Revit $year $required"
              }
            }
          }
          Write-Host "STAGED: $revitStage"

          # 5. aware-connection-reader (Node SEA exe + web-ifc WASM → zip)
          #    A single-file exe built from cli-connection-reader (esbuild bundle → Node SEA), with
          #    web-ifc's .wasm shipped alongside (read at run time via SetWasmPath). Flat zip so it
          #    extracts straight into ~/.aware/bridges/ (see cli/src/commands/sidecar.rs extract_zip).
          Write-Host "--- aware-connection-reader (Node SEA) ---"
          Push-Location cli-connection-reader
          npm ci
          npm run build
          Pop-Location
          $crStage = "bridge-connection-reader"
          New-Item -ItemType Directory -Path $crStage -Force | Out-Null
          Copy-Item "cli-connection-reader/dist/aware-connection-reader.exe" "$crStage/"
          Copy-Item "cli-connection-reader/dist/web-ifc-node.wasm" "$crStage/"
          Write-Host "STAGED: $crStage"

      # Everything Windows ships, still unsigned. Its name matches neither of the
      # release job's download patterns, so it cannot be published as-is.
      - name: Upload unsigned Windows payload (Windows only)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-win-x64
          path: |
            ${{ env.STAGE_DIR }}
            bridge-tekla
            bridge-rhino
            bridge-sketchup
            bridge-revit
            bridge-connection-reader
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  # ── Windows code signing ───────────────────────────────────────────────────
  # Defender's ML heuristic quarantined the unsigned aware.exe as
  # Trojan:Win32/Bearfoos.A!ml, which broke FloLess setup on that machine. Every
  # Windows binary AWARE ships is now Authenticode-signed here with the same
  # Azure Artifact Signing account and certificate profile floless.app's
  # releases use (protected-windows-signing.yml in floless.app).
  #
  # Signing is its own job, apart from the build, so the Azure OIDC token never
  # shares a runner with the build's third-party code (npm ci, cargo build
  # scripts, NuGet restores). This job only signs, zips and runs WiX over bytes
  # the build handed it.
  #
  # Azure trust: `environment: release` makes the OIDC subject
  # repo:aware-aeco/aware:environment:release, which a federated credential on
  # the signing app registration must trust; the AZURE_* secrets name that app.
  sign-windows:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.sign
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: windows-signing-aware
      cancel-in-progress: false
    outputs:
      version: ${{ steps.payload.outputs.version }}
    steps:
      - name: Refuse to sign anything but a release tag or main, before OIDC
        shell: pwsh
        run: |
          if ($env:GITHUB_REPOSITORY -ne 'aware-aeco/aware') { throw "unexpected signing repository: $env:GITHUB_REPOSITORY" }
          $tag = $env:GITHUB_REF -match '^refs/tags/v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z.-]+)?$'
          if (-not $tag -and $env:GITHUB_REF -ne 'refs/heads/main') {
            throw "signing runs only for a release tag or a dry run off main, not $env:GITHUB_REF (dispatch with sign=false to exercise a branch build)"
          }

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install .NET SDK (for WiX)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download unsigned Windows payload
        uses: actions/download-artifact@v8
        with:
          name: unsigned-win-x64
          path: win

      - name: Read the staged version
        id: payload
        shell: pwsh
        run: |
          $stages = @(Get-ChildItem win -Directory -Filter 'aware-*-win-x64')
          if ($stages.Count -ne 1) { throw "expected exactly one aware-<version>-win-x64 stage, found $($stages.Count)" }
          $stage = $stages[0].Name
          $version = (Get-Content -Raw -LiteralPath "win/$stage/VERSION").Trim()
          if ($stage -ne "aware-$version-win-x64") { throw "stage $stage does not match its VERSION $version" }
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $version -ne ($env:GITHUB_REF_NAME -replace '^v', '')) {
            throw "staged version $version differs from tag $env:GITHUB_REF_NAME"
          }
          "STAGE_DIR=$stage" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Every binary the policy rejects gets signed — all of AWARE's own, plus any
      # redistributed third-party binary without a valid timestamped signature of
      # its own. Validly signed third-party binaries (the .NET runtime in
      # aware-roslyn/) keep their publisher's signature.
      - name: List the binaries to sign
        id: unsigned
        shell: pwsh
        run: |
          $list = Join-Path $env:RUNNER_TEMP 'to-sign.txt'
          ./scripts/windows-signatures.ps1 -Mode Catalog -Root win -ListPath $list
          $files = @(Get-Content -LiteralPath $list | Where-Object { $_ })
          if ($files.Count -eq 0) { throw 'nothing to sign: the build produced no unsigned AWARE binaries, which means it did not build them' }
          $delimiter = "AWARE_SIGN_$([Guid]::NewGuid().ToString('N'))"
          @("files<<$delimiter") + $files + @($delimiter) | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Azure login (OIDC)
        uses: azure/login@4c03e4685fe81df2c50d5714c7d93cf39d8deb7f # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the Windows binaries
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://plc.codesigning.azure.net/
          signing-account-name: bimstudiosign
          certificate-profile-name: flolessapp
          # An explicit list rather than files-folder: the list is exactly what the
          # policy rejected, nested folders included (files-folder does not recurse
          # by default and silently skipped a nested exe in floless #1761), and it
          # leaves Microsoft's own signatures on the runtime DLLs alone.
          files: ${{ steps.unsigned.outputs.files }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify every staged binary is signed
        shell: pwsh
        run: ./scripts/windows-signatures.ps1 -Mode Verify -Root win

      - name: Pack the signed binaries into the release assets
        shell: pwsh
        run: |
          $v = $env:VERSION
          $stage = $env:STAGE_DIR
          New-Item -ItemType Directory -Path out -Force | Out-Null
          # Same layouts as before signing moved here: the main zip keeps its
          # top-level aware-<version>-win-x64/ folder, the bridge zips are flat
          # (`aware sidecar install` extracts them straight into ~/.aware/bridges/).
          Compress-Archive -Path "win/$stage" -DestinationPath "out/$stage.zip"
          foreach ($bridge in @('tekla', 'sketchup', 'revit', 'connection-reader')) {
            Compress-Archive -Path "win/bridge-$bridge/*" -DestinationPath "out/aware-$bridge-$v-win-x64.zip"
          }
          Copy-Item "win/bridge-rhino/aware-rhino.exe" "out/aware-rhino-$v-win-x64.exe"
          # Pin WiX 6 — WiX 7+ added an Open Source Maintenance Fee EULA that
          # requires per-invocation acceptance, awkward in CI. WiX 6 is stable
          # and license-clean. Built from the SIGNED stage, so the files the
          # MSI installs carry the signatures checked above.
          #
          # StageDir must be ABSOLUTE. WiX resolves <Files Include> globs against
          # the .wxs file's own folder, so the relative path this used to pass made
          # aware.wxs's aware-roslyn\** glob match nothing: every MSI through
          # v0.171.0 installed without aware-roslyn (its File table holds 8 files).
          # verify-windows-signatures now requires aware-roslyn inside the MSI.
          $stageDir = (Resolve-Path -LiteralPath "win/$stage").Path
          dotnet tool install -g wix --version 6.0.0
          wix build packaging/wix/aware.wxs `
            -d Version=$v `
            -d StageDir=$stageDir `
            -arch x64 `
            -o "out/$stage.msi"
          if ($LASTEXITCODE -ne 0) { throw 'wix build failed' }
          Get-ChildItem out

      - name: Sign the MSI
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://plc.codesigning.azure.net/
          signing-account-name: bimstudiosign
          certificate-profile-name: flolessapp
          files: ${{ github.workspace }}\out\${{ env.STAGE_DIR }}.msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: aware-${{ env.VERSION }}-win-x64
          path: out/${{ env.STAGE_DIR }}.zip
          if-no-files-found: error

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v7
        with:
          name: aware-${{ env.VERSION }}-win-x64-msi
          path: out/${{ env.STAGE_DIR }}.msi
          if-no-files-found: error

      - name: Upload bridge artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bridges-${{ env.VERSION }}-win-x64
          path: |
            out/aware-tekla-${{ env.VERSION }}-win-x64.zip
            out/aware-rhino-${{ env.VERSION }}-win-x64.exe
            out/aware-sketchup-${{ env.VERSION }}-win-x64.zip
            out/aware-revit-${{ env.VERSION }}-win-x64.zip
            out/aware-connection-reader-${{ env.VERSION }}-win-x64.zip
          if-no-files-found: error

  # The release gate. Checks the Windows assets exactly as the release will
  # publish them — downloaded back from the artifacts, every zip unpacked and the
  # MSI administratively extracted — and fails, so nothing is released, if any
  # binary in them is unsigned, tampered with, untimestamped or signed by someone
  # else. Separate from sign-windows so the signer does not grade its own work,
  # and it holds no Azure credentials. Its negative control proves the check can
  # fail: it strips and corrupts copies of the signed aware.exe and requires the
  # policy to reject them.
  verify-windows-signatures:
    needs: sign-windows
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download the signed Windows assets
        uses: actions/download-artifact@v8
        with:
          pattern: aware-*-win-x64*
          path: assets
          merge-multiple: true

      - name: Download the signed bridge assets
        uses: actions/download-artifact@v8
        with:
          pattern: bridges-*-win-x64
          path: assets
          merge-multiple: true

      - name: Verify every shipped Windows binary is signed
        shell: pwsh
        env:
          VERSION: ${{ needs.sign-windows.outputs.version }}
        run: |
          $v = $env:VERSION
          $core = @('aware.exe', 'aware-sidecar.exe', 'aware-steel-detailer-us.exe', 'aware-steel-detailer-uk.exe',
                    'aware-steel-detailer-eu.exe', 'aware-roslyn.exe', 'aware-roslyn.dll')
          # Each package and the binaries it must contain. A Windows asset not listed
          # here fails the check below, so a new one cannot ship without being added.
          $packages = [ordered]@{
            "aware-$v-win-x64.zip"                   = $core
            "aware-$v-win-x64.msi"                   = $core
            "aware-tekla-$v-win-x64.zip"             = @('aware-tekla.exe')
            "aware-sketchup-$v-win-x64.zip"          = @('aware-sketchup.exe')
            "aware-revit-$v-win-x64.zip"             = @('aware-revit.exe', 'AwareRevit.dll')
            "aware-connection-reader-$v-win-x64.zip" = @('aware-connection-reader.exe')
          }
          $bare = @("aware-rhino-$v-win-x64.exe")
          $expected = @($packages.Keys) + $bare | Sort-Object
          $actual = @(Get-ChildItem assets -File | ForEach-Object Name | Sort-Object)
          if (Compare-Object $expected $actual) {
            throw "Windows asset set differs from the checked list. expected: $($expected -join ', ') | actual: $($actual -join ', ')"
          }

          ./scripts/windows-signatures.ps1 -Mode Verify -Root assets -Require (@("aware-$v-win-x64.msi") + $bare)
          ./scripts/windows-signatures.ps1 -Mode Expand -Root assets -Destination expanded
          foreach ($package in $packages.Keys) {
            Write-Host "=== $package ==="
            ./scripts/windows-signatures.ps1 -Mode Verify -Root "expanded/$package" -Require $packages[$package]
          }

      - name: Negative control — the check rejects unsigned and tampered binaries
        shell: pwsh
        env:
          VERSION: ${{ needs.sign-windows.outputs.version }}
        run: |
          $sample = "expanded/aware-$env:VERSION-win-x64.zip/aware-$env:VERSION-win-x64/aware.exe"
          ./scripts/windows-signatures.ps1 -Mode SelfTest -SignedSample $sample

  release:
    needs: [build, verify-windows-signatures]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      # By pattern, not "everything": the build job's unsigned-win-x64 payload
      # must never reach the release. The Windows assets in these patterns come
      # only from sign-windows, and verify-windows-signatures has checked them.
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: aware-*
          path: dist
          merge-multiple: true

      - name: Download bridge artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: bridges-*
          path: dist
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          ls -la dist/
          # Every release asset is a single file; a folder here would be an
          # unpacked staging tree, which is never what a release should publish.
          if [ -n "$(find dist -mindepth 1 -type d)" ]; then
            echo "::error::a folder reached the release assets: $(find dist -mindepth 1 -type d)"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    # Publishes via npm Trusted Publishing (OIDC) -- no long-lived token.
    # npm revoked the old NPM_TOKEN in its 2026 granular-token rotation
    # (Shai-Hulud supply-chain precaution), which is why 0.28.1 published but
    # 0.36.0 404'd with no repo change. Kept continue-on-error so a npm hiccup
    # can't fail the release -- the GitHub Release binaries are the primary
    # artifact. Safe to remove once trusted publishing is confirmed green.
    continue-on-error: true
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'   # trusted publishing needs Node >= 22.14.0
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: npm install -g npm@latest
      - name: Sync package.json version from tag
        working-directory: cli-npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "Syncing cli-npm/package.json to version $version"
          # Use Node to update version (avoids jq dependency)
          node -e "const pkg=require('./package.json'); pkg.version='$version'; require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')"
          cat package.json
      - name: Publish to npm (OIDC trusted publishing -- no token)
        working-directory: cli-npm
        run: npm publish --access public --provenance
