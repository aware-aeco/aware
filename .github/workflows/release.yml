name: Release

on:
  push:
    tags:
      # All v0.x and v1+ versions. The first pattern matches v0.0.x through
      # v0.99.x; the second matches v1.x and later majors. We used to enumerate
      # each minor (v0.6.*, v0.7.*, ...) but that broke at v0.10.0 — the new
      # patterns are forward-compatible.
      - 'v0.[0-9]*.*'
      - 'v[1-9]*.*.*'
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            ext: .exe
            archive: zip
            archive_ext: .zip
          - os: ubuntu-latest
            rid: linux-x64
            ext: ""
            archive: tar
            archive_ext: .tar.gz
          - os: macos-latest
            rid: osx-arm64
            ext: ""
            archive: tar
            archive_ext: .tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node (for the connection-reader SEA bridge build)
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install .NET SDKs (8 / 9 / 10)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Install clang on Linux
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y clang libsecret-1-dev libdbus-1-dev pkg-config

      - name: Sync crate version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "Syncing cli/Cargo.toml [package] version to $version"
          # Replace only the FIRST `version = "..."` line (the [package] version);
          # dependency version specs further down are left untouched. awk ships on
          # all three runners (incl. Git Bash on windows-latest), so this is portable
          # where BSD/GNU `sed -i` and `0,/re/` address ranges are not.
          awk -v v="$version" 'BEGIN{done=0} !done && /^version[[:space:]]*=/ {print "version     = \"" v "\""; done=1; next} {print}' cli/Cargo.toml > cli/Cargo.toml.tmp
          mv cli/Cargo.toml.tmp cli/Cargo.toml
          grep -m1 '^version' cli/Cargo.toml

      - name: Build Rust CLI (release)
        working-directory: cli
        env:
          # Google "Desktop app" client secret, baked in at compile time via
          # option_env! (see cli/src/auth/config.rs + cli/build.rs). Non-confidential
          # per Google's native-app model, but kept in CI secrets rather than source
          # to avoid quota-abuse bots + secret scanners. M365 needs no secret.
          AWARE_GOOGLE_CLIENT_SECRET: ${{ secrets.AWARE_GOOGLE_CLIENT_SECRET }}
        run: cargo build --release

      - name: Build steel-detailer lookup binaries (agent transport)
        # Deterministic clause/section lookup for the steel-detailer-us / -uk / -eu
        # agents — no LLM in the run path (decalog #9). One source, three [[bin]]
        # names; the binary picks its rule set from argv[0]. Its own cargo workspace
        # under 20-agents/, so it needs its own build invocation.
        #
        # Unlike the host bridges below, this is portable Rust with no host
        # dependency, so it builds on all three runners and ships INSIDE the main
        # archive next to `aware` (~284 KB each) rather than as a separate
        # `aware sidecar install` asset — that path is Windows-only by construction
        # (see cli/src/commands/sidecar.rs, which hardcodes a win-x64 asset name).
        # Next to `aware` means the install dir's PATH entry resolves it, which is
        # what invoker.rs falls back to for non-bridge binaries.
        working-directory: 20-agents/aeco/engineering/steel-detailer-lookup
        run: cargo build --release

      - name: Publish C# sidecar (NativeAOT)
        run: dotnet publish cli-sidecar -c Release -r ${{ matrix.rid }} -p:PublishAot=true

      - name: Publish Roslyn source reader (self-contained folder)
        # aware-roslyn hosts Roslyn (which can't go in the NativeAOT sidecar). It ships as a
        # self-contained FOLDER, NOT single-file: the .csproj/.sln path (#185) uses
        # MSBuildWorkspace, which cannot run from a single-file bundle — there Assembly.Location
        # is empty, so MSBuild's path resolution throws ("path1" null). The folder is staged
        # under `aware-roslyn/` next to aware and discovered there; still no .NET runtime needed.
        run: >-
          dotnet publish cli-roslyn -c Release -r ${{ matrix.rid }}
          --self-contained
          -p:PublishSingleFile=false

      - name: Stage artifacts
        shell: bash
        run: |
          set -e
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ] || [[ ! "$version" =~ ^[0-9] ]]; then
            version="0.0.0-dev"
          fi
          stage="aware-${version}-${{ matrix.rid }}"
          mkdir -p "$stage"
          cp "cli/target/release/aware${{ matrix.ext }}" "$stage/"
          cp "cli-sidecar/bin/Release/net10.0/${{ matrix.rid }}/publish/aware-sidecar${{ matrix.ext }}" "$stage/"
          # steel-detailer lookup transports — one per region, same binary, argv[0] picks
          # the rule set. Rules themselves arrive via `aware agent install`.
          for region in us uk eu; do
            cp "20-agents/aeco/engineering/steel-detailer-lookup/target/release/aware-steel-detailer-${region}${{ matrix.ext }}" "$stage/"
          done
          # aware-roslyn ships as a self-contained FOLDER (#185 — see the publish step). Stage the
          # whole publish dir under `aware-roslyn/`; the CLI discovers `aware-roslyn/aware-roslyn`.
          mkdir -p "$stage/aware-roslyn"
          cp -r "cli-roslyn/bin/Release/net10.0/${{ matrix.rid }}/publish/." "$stage/aware-roslyn/"
          cp LICENSE "$stage/" 2>/dev/null || echo "(no LICENSE file)" > "$stage/LICENSE"
          cp cli/README.md "$stage/README.md"
          echo "$version" > "$stage/VERSION"
          ls -la "$stage/"
          echo "STAGE_DIR=$stage" >> $GITHUB_ENV
          echo "VERSION=$version" >> $GITHUB_ENV

      - name: Archive (Linux/macOS — tar.gz)
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          tar -czf "${{ env.STAGE_DIR }}.tar.gz" "${{ env.STAGE_DIR }}"
          ls -la *.tar.gz
          echo "ARTIFACT=${{ env.STAGE_DIR }}.tar.gz" >> $GITHUB_ENV

      - name: Archive (Windows — zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ env.STAGE_DIR }}" -DestinationPath "${{ env.STAGE_DIR }}.zip"
          Get-ChildItem *.zip
          "ARTIFACT=${{ env.STAGE_DIR }}.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build MSI installer (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Pin WiX 6 — WiX 7+ added an Open Source Maintenance Fee EULA that
          # requires per-invocation acceptance, awkward in CI. WiX 6 is stable
          # and license-clean.
          dotnet tool install -g wix --version 6.0.0
          $msi = "${{ env.STAGE_DIR }}.msi"
          wix build packaging/wix/aware.wxs `
            -d Version=${{ env.VERSION }} `
            -d StageDir=${{ env.STAGE_DIR }} `
            -arch x64 `
            -o $msi
          Get-ChildItem $msi
          "MSI_ARTIFACT=$msi" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: aware-${{ env.VERSION }}-${{ matrix.rid }}
          path: ${{ env.ARTIFACT }}

      - name: Upload MSI artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: aware-${{ env.VERSION }}-win-x64-msi
          path: ${{ env.MSI_ARTIFACT }}

      # ── Host bridges (Windows-only; separate release assets) ────────────────
      # Each bridge binary lives in its own repo sub-project. They are NOT
      # bundled in the main aware zip (Windows-only + some ship with assets).
      # Naming convention: <binary>-<version>-win-x64.<ext>
      # which is what `aware sidecar install <host>` downloads.

      - name: Build host bridges (Windows only)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = $env:VERSION
          Write-Host "=== Building host bridges for v$version ==="

          # 1. aware-tekla (net48, multiple DLLs → zip)
          Write-Host "--- aware-tekla (net48) ---"
          dotnet publish cli-tekla/cli-tekla.csproj -c Release
          $teklaPublish = "cli-tekla/bin/Release/net48/publish"
          $teklaStage   = "bridge-tekla"
          New-Item -ItemType Directory -Path $teklaStage -Force | Out-Null
          Copy-Item "$teklaPublish/*" "$teklaStage/" -Recurse
          Compress-Archive -Path "$teklaStage/*" `
            -DestinationPath "aware-tekla-${version}-win-x64.zip" -Force
          Write-Host "DONE: aware-tekla-${version}-win-x64.zip"

          # 2. aware-rhino (net10, single-file exe)
          Write-Host "--- aware-rhino (net10) ---"
          dotnet publish cli-rhino/cli-rhino.csproj -c Release -r win-x64
          Copy-Item "cli-rhino/bin/Release/net10.0-windows/win-x64/publish/aware-rhino.exe" `
                    "aware-rhino-${version}-win-x64.exe"
          Write-Host "DONE: aware-rhino-${version}-win-x64.exe"

          # 3. aware-sketchup (net10, single-file + BridgeAssets → zip)
          Write-Host "--- aware-sketchup (net10) ---"
          dotnet publish cli-sketchup/cli-sketchup.csproj -c Release -r win-x64
          $suPublish = "cli-sketchup/bin/Release/net10.0-windows/win-x64/publish"
          $suStage   = "bridge-sketchup"
          New-Item -ItemType Directory -Path $suStage -Force | Out-Null
          Copy-Item "$suPublish/aware-sketchup.exe" "$suStage/"
          if (Test-Path "$suPublish/BridgeAssets") {
            Copy-Item -Recurse "$suPublish/BridgeAssets" "$suStage/"
          }
          Compress-Archive -Path "$suStage/*" `
            -DestinationPath "aware-sketchup-${version}-win-x64.zip" -Force
          Write-Host "DONE: aware-sketchup-${version}-win-x64.zip"

          # 4. aware-revit (net8 sidecar single-file + the IExternalApplication
          #    add-in + install-addin.ps1 → zip)
          #    UseLocalRevitApi=false makes AwareRevit.dll compile against
          #    Autodesk's reference assemblies from nuget.org instead of a local
          #    Revit install, which is what lets this runner build the add-in at
          #    all — without it the zip shipped an installer with nothing to
          #    install (issue #315).
          #    The add-in payload goes in its own AwareRevit/ subfolder. The zip
          #    extracts FLAT into ~/.aware/bridges/, which every bridge shares,
          #    and the add-in's net8 Roslyn assemblies have the exact same file
          #    names as aware-tekla's net48 ones — flat, they would overwrite
          #    each other. install-addin.ps1 looks in that subfolder first.
          Write-Host "--- aware-revit (net8 sidecar + add-in) ---"
          dotnet publish cli-revit/Sidecar/cli-revit.csproj -c Release -r win-x64
          dotnet build cli-revit/AwareRevit/AwareRevit.csproj -c Release -p:UseLocalRevitApi=false
          $revitPublish = "cli-revit/Sidecar/bin/Release/net8.0-windows/win-x64/publish"
          $addinBuild   = "cli-revit/AwareRevit/bin/Release/net8.0-windows"
          $revitStage   = "bridge-revit"
          $addinStage   = "$revitStage/AwareRevit"
          New-Item -ItemType Directory -Path $addinStage -Force | Out-Null
          Copy-Item "$revitPublish/aware-revit.exe" "$revitStage/"
          Copy-Item "cli-revit/install-addin.ps1" "$revitStage/"
          # The add-in and everything it loads at run time: the Roslyn scripting
          # assemblies and their localized resource folders, the shared frame
          # types, and the .addin manifest that CopyToOutputDirectory put here.
          # No Revit assembly is among them — they are referenced, never copied.
          Copy-Item "$addinBuild/*" "$addinStage/" -Recurse
          foreach ($required in @(
            "$addinStage/AwareRevit.dll",
            "$addinStage/AwareRevit.addin",
            "$revitStage/install-addin.ps1")) {
            if (-not (Test-Path $required)) {
              throw "aware-revit zip would ship without $required - the installer could not succeed"
            }
          }
          Compress-Archive -Path "$revitStage/*" `
            -DestinationPath "aware-revit-${version}-win-x64.zip" -Force
          Write-Host "DONE: aware-revit-${version}-win-x64.zip"

          # 5. aware-connection-reader (Node SEA exe + web-ifc WASM → zip)
          #    A single-file exe built from cli-connection-reader (esbuild bundle → Node SEA), with
          #    web-ifc's .wasm shipped alongside (read at run time via SetWasmPath). Flat zip so it
          #    extracts straight into ~/.aware/bridges/ (see cli/src/commands/sidecar.rs extract_zip).
          Write-Host "--- aware-connection-reader (Node SEA) ---"
          Push-Location cli-connection-reader
          npm ci
          npm run build
          Pop-Location
          $crStage = "bridge-connection-reader"
          New-Item -ItemType Directory -Path $crStage -Force | Out-Null
          Copy-Item "cli-connection-reader/dist/aware-connection-reader.exe" "$crStage/"
          Copy-Item "cli-connection-reader/dist/web-ifc-node.wasm" "$crStage/"
          Compress-Archive -Path "$crStage/*" `
            -DestinationPath "aware-connection-reader-${version}-win-x64.zip" -Force
          Write-Host "DONE: aware-connection-reader-${version}-win-x64.zip"

      - name: Upload bridge artifacts (Windows only)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: bridges-${{ env.VERSION }}-win-x64
          path: |
            aware-tekla-${{ env.VERSION }}-win-x64.zip
            aware-rhino-${{ env.VERSION }}-win-x64.exe
            aware-sketchup-${{ env.VERSION }}-win-x64.zip
            aware-revit-${{ env.VERSION }}-win-x64.zip
            aware-connection-reader-${{ env.VERSION }}-win-x64.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    # Publishes via npm Trusted Publishing (OIDC) -- no long-lived token.
    # npm revoked the old NPM_TOKEN in its 2026 granular-token rotation
    # (Shai-Hulud supply-chain precaution), which is why 0.28.1 published but
    # 0.36.0 404'd with no repo change. Kept continue-on-error so a npm hiccup
    # can't fail the release -- the GitHub Release binaries are the primary
    # artifact. Safe to remove once trusted publishing is confirmed green.
    continue-on-error: true
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'   # trusted publishing needs Node >= 22.14.0
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: npm install -g npm@latest
      - name: Sync package.json version from tag
        working-directory: cli-npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "Syncing cli-npm/package.json to version $version"
          # Use Node to update version (avoids jq dependency)
          node -e "const pkg=require('./package.json'); pkg.version='$version'; require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')"
          cat package.json
      - name: Publish to npm (OIDC trusted publishing -- no token)
        working-directory: cli-npm
        run: npm publish --access public --provenance
