name: Tag

# Create a release tag from inside Actions, for release paths that cannot push one.
#
# Cloud sessions reach GitHub through a proxy whose push protection accepts only
# the session's own working branch. `git push origin main` succeeds there;
# `git push origin v0.131.1` comes back 403, as does POST /git/refs, and the
# GitHub MCP server offers no tag or release write. So the scheduled release
# routine can bump main and then be unable to finish, leaving the manifests
# claiming a version that was never built and never published — which is exactly
# what happened to v0.131.1 on 2026-08-28. Dispatching this workflow creates the
# ref from inside Actions instead, where the runner's own token does the write.
#
# Release tags are signing authority. release.yml Authenticode-signs every
# Windows binary as BIMSTUDIO, and a `v*` tag runs the release.yml AT THE TAGGED
# COMMIT — so whoever can create a v* tag can get any code signed. The
# protect-release-tags ruleset therefore lets only the repository admin and the
# org-owned aware-release-tagger app create, move or delete v* tags. This
# workflow is the app's only door, and it opens it for one account:
#
#   - the first step refuses anyone but pawellisowski (matched by numeric id,
#     which a rename or look-alike login cannot take over), whoever dispatched
#     or re-ran it;
#   - the app's private key lives in the `release-tagging` environment, which
#     only `main` may enter, so a branch carrying an edited copy of this file
#     cannot reach the key. `main` changes only through reviewed PRs.
#
# GITHUB_TOKEN cannot create the tag any more: GitHub will not let the Actions
# integration bypass a repository ruleset. The app token can — and unlike a
# GITHUB_TOKEN push, an app-authored tag DOES raise the `push: tags:` event, so
# release.yml starts by itself. Dispatching it as well would release twice, so
# the dispatch step now runs only to rescue a tag that already existed (whose
# push event has long passed). For the same reason `release: false` is refused:
# an app-created tag cannot be made without starting the release.
#
# The guards below are the ones the release routine applies by hand, restated
# where they cannot be skipped: plain semver, a commit on the default branch,
# manifests at that commit that already say this version, CI green on that exact
# commit, and a tag that does not already exist. A tag is forever; earning it
# twice is cheap.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag, without the leading v (e.g. 0.131.1)"
        required: true
        type: string
      sha:
        description: "Commit SHA to tag, 7-40 hex characters (default: the commit this workflow is dispatched at)"
        required: false
        type: string
      release:
        description: "Release the tag (must stay true: an app-created tag always starts release.yml)"
        type: boolean
        default: true

permissions:
  contents: read # the tag itself is written with the release-tagger app token
  actions: write # re-dispatch release.yml for a tag that already existed

jobs:
  tag:
    runs-on: ubuntu-latest
    # Only `main` may enter this environment, and it holds the tagger app's key.
    environment: release-tagging
    steps:
      # Before anything else: only Pawel's account may cut a release. Both the
      # account that dispatched this run and the one re-running it must be him;
      # ids, not logins, so a renamed or look-alike account cannot pass.
      - name: Refuse anyone but the release owner
        env:
          GH_TOKEN: ${{ github.token }}
          SENDER_ID: ${{ github.event.sender.id }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RELEASE_OWNER_ID: '35166048' # pawellisowski
          RELEASE_FLAG: ${{ inputs.release }}
        run: |
          set -euo pipefail
          if [ "$SENDER_ID" != "$RELEASE_OWNER_ID" ]; then
            echo "::error::only the release owner may dispatch this workflow (sender id $SENDER_ID)"
            exit 1
          fi
          actor_id="$(gh api "users/$TRIGGERING_ACTOR" --jq .id)"
          if [ "$actor_id" != "$RELEASE_OWNER_ID" ]; then
            echo "::error::only the release owner may run this workflow ($TRIGGERING_ACTOR, id $actor_id)"
            exit 1
          fi
          if [ "$RELEASE_FLAG" != "true" ]; then
            echo "::error::release=false is no longer possible: a tag created by the release-tagger app always starts release.yml"
            exit 1
          fi

      # Full history and tags: the guards below read the manifests at an
      # arbitrary commit and need to see whether the tag already exists.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Every step reads the dispatch inputs from the environment rather than
      # interpolating them into the script, so a crafted input stays data.
      - name: Resolve the commit to tag
        env:
          VERSION: ${{ inputs.version }}
          SHA_INPUT: ${{ inputs.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # $VERSION reaches GITHUB_ENV below, and every later step sources that
          # file, so a value carrying a newline would land there as a second
          # assignment — BASH_ENV=... would then run a script of the dispatcher's
          # choosing in each step that holds the write-capable token. A
          # line-oriented test like `grep -E '^...$'` cannot see that, because it
          # succeeds when ANY line matches. These `case` patterns match the whole
          # value, newlines included, so a multiline input dies on the first one.
          case "$VERSION" in
            v*)
              echo "::error::version takes no leading v — pass 0.131.1, not the tag name"
              exit 1
              ;;
            "" | *[!0-9.]*)
              echo "::error::version may hold only digits and dots — got $(printf '%q' "$VERSION")"
              exit 1
              ;;
          esac
          # Shape, now that the alphabet is known safe. Bash's =~ matches the
          # whole string rather than line by line, so this is a second wall
          # rather than the same one twice.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be a plain semver like 0.131.1 (got '$VERSION')"
            exit 1
          fi

          if [ -n "$SHA_INPUT" ]; then
            # A commit SHA, not a revision expression: same whole-value reasoning,
            # and it keeps the tagged commit unambiguous at dispatch time.
            case "$SHA_INPUT" in
              *[!0-9a-fA-F]*)
                echo "::error::sha must be a hex commit SHA — got $(printf '%q' "$SHA_INPUT")"
                exit 1
                ;;
            esac
            if [ "${#SHA_INPUT}" -lt 7 ] || [ "${#SHA_INPUT}" -gt 40 ]; then
              echo "::error::sha must be 7 to 40 hex characters (got ${#SHA_INPUT})"
              exit 1
            fi
            if ! sha="$(git rev-parse --verify --quiet "${SHA_INPUT}^{commit}")"; then
              echo "::error::$SHA_INPUT does not name a commit in this repository"
              exit 1
            fi
          else
            sha="$(git rev-parse HEAD)"
          fi

          # A release tag names a commit that is on the default branch. Anything
          # else is a mistake worth refusing rather than immortalising in a tag.
          if ! git merge-base --is-ancestor "$sha" "origin/$DEFAULT_BRANCH"; then
            echo "::error::$sha is not an ancestor of origin/$DEFAULT_BRANCH — refusing to tag it"
            exit 1
          fi

          # An existing tag is fatal only when it names a different commit.
          # Releasing is a two-step chain — create the ref, then dispatch
          # release.yml at it — and a tag authored by GITHUB_TOKEN raises no push
          # event, so if the dispatch half fails there is no other way back in.
          # Refusing every existing tag would strand exactly the release this
          # workflow exists to rescue, so a rerun for the same commit skips
          # creation and goes on to the dispatch. A tag pointing anywhere else is
          # still refused: a published tag is never moved.
          tag_exists=false
          if existing="$(git rev-parse --verify --quiet "refs/tags/v$VERSION^{commit}")"; then
            if [ "$existing" != "$sha" ]; then
              echo "::error::tag v$VERSION already exists at $existing, not $sha — a published tag is never moved"
              exit 1
            fi
            tag_exists=true
            echo "::notice::tag v$VERSION already exists at $sha — skipping creation, dispatching the release"
          fi

          {
            echo "SHA=$sha"
            echo "TAG=v$VERSION"
            echo "TAG_EXISTS=$tag_exists"
          } >> "$GITHUB_ENV"

      # The version is welded across cli/Cargo.toml and cli-npm/package.json by
      # scripts/sync_stats.py --bump. Tagging a commit whose manifests say
      # something else would ship a binary that disagrees with its own tag.
      - name: Verify the manifests at that commit carry this version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          cargo_version="$(git show "$SHA:cli/Cargo.toml" \
            | awk -F'"' '/^version[[:space:]]*=/ { print $2; exit }')"
          npm_version="$(git show "$SHA:cli-npm/package.json" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"

          failed=0
          if [ "$cargo_version" != "$VERSION" ]; then
            echo "::error::cli/Cargo.toml at $SHA says $cargo_version, not $VERSION"
            failed=1
          fi
          if [ "$npm_version" != "$VERSION" ]; then
            echo "::error::cli-npm/package.json at $SHA says $npm_version, not $VERSION"
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "Run: python scripts/sync_stats.py --bump $VERSION, then commit and push."
            exit 1
          fi
          echo "Manifests agree: $VERSION"

      # Green on THAT commit, not on an older one that happens to be the newest
      # completed run. A broken main is not a release.
      - name: Verify CI is green on that commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          conclusion="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&status=completed&per_page=1" \
            --jq '.workflow_runs[0].conclusion // ""')"

          case "$conclusion" in
            success) echo "CI is green on $SHA" ;;
            "") echo "::error::no completed CI run for $SHA — wait for CI before tagging"; exit 1 ;;
            *) echo "::error::the CI run for $SHA concluded '$conclusion' — refusing to tag"; exit 1 ;;
          esac

      # A short-lived installation token for the org-owned aware-release-tagger
      # app (App ID 5616557), scoped to this repository and contents:write only.
      # It is minted only after every guard above has passed.
      - name: Mint the release-tagger token
        if: env.TAG_EXISTS != 'true'
        id: tagger
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: '5616557'
          private-key: ${{ secrets.RELEASE_TAGGER_PRIVATE_KEY }}
          repositories: aware
          permission-contents: write

      # Created by the app, which the protect-release-tags ruleset admits and
      # whose push event starts release.yml at this tag.
      - name: Create the tag
        if: env.TAG_EXISTS != 'true'
        env:
          GH_TOKEN: ${{ steps.tagger.outputs.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$SHA" \
            --silent
          echo "Created $TAG at $SHA — its push event starts release.yml"

      # Only for a tag that already existed: its push event is long gone, so a
      # rerun that rescues a release must start release.yml explicitly. A tag
      # created above starts it by itself, and dispatching too would release twice.
      - name: Dispatch release.yml at the existing tag
        if: env.TAG_EXISTS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref "$TAG"
          echo "Dispatched release.yml at $TAG"

      - name: Summarise
        run: |
          if [ "$TAG_EXISTS" = true ]; then
            state="already existed at this commit, creation skipped"
            started="dispatched by this run"
          else
            state="created by this run (aware-release-tagger)"
            started="started by the tag's push event"
          fi
          {
            echo "### \`$TAG\`"
            echo
            echo "- commit: \`$SHA\`"
            echo "- tag: $state"
            echo "- release.yml: $started"
          } >> "$GITHUB_STEP_SUMMARY"
