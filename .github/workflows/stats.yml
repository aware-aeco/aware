name: Stats

# Keep the substrate's stat numbers (agent / skill / command / app counts, the
# decalog truth count, CLI version) in sync across the docs. The numbers are
# computed from registry-index.json + the 20-agents/ tree, so this never
# hallucinates — it just fails the PR if a managed number drifts.
#
# To fix a failure locally:  python scripts/sync_stats.py --write

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: stats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Unit-test the stat engine
        run: python scripts/sync_stats.py --selftest
      - name: Verify doc + diagram stats are in sync
        run: python scripts/sync_stats.py --check
