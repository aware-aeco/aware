agent:        trimble-connect
version:      0.5.0
sdk-target:   2.4.0
display-name: Trimble Connect
description: |
  Manage a Trimble Connect project's folders, files, BCF topics and ToDos:
  list and inspect projects, members, folders and files; create, find, rename,
  move, copy and delete folders and files; upload and download file content;
  list, create and update BCF 2.1 topics with their comments, viewpoints
  (snapshots included) and document references; list, create, update and
  delete ToDos. Every call reaches the project's own region (North America,
  Europe, UK, Asia, Australia) through an optional `region` input. Built from Trimble Connect's published Core API 2.0 and Topics
  (BCF 2.1) definitions and refined to capture the idempotency, rate-limit,
  region and auth-refresh patterns the REST surface alone doesn't encode.

stateful: false

vendor:   trimble
license:  Apache-2.0
homepage: https://github.com/aware-aeco/aware/tree/main/20-agents/aeco/construction/trimble-connect
keywords: [aeco, construction, cde, bim, trimble, collaboration]

provenance:
  generated-by:     aware-agent-builder
  generator-version: 0.1.0
  source:
    type: openapi
    url:  https://api.swaggerhub.com/apis/Trimble-Connect/tcps/2.0
  refined-by:       [pawellisowski]
  generated-at:     2026-04-01T00:00:00Z

requires:
  network:
    # Core API 2.0 — the North America master, then one host per region,
    # chosen by the `region` input or the project's `location` via /regions
    - https://app.connect.trimble.com
    - https://app21.connect.trimble.com
    - https://app22.connect.trimble.com
    - https://app31.connect.trimble.com
    - https://app32.connect.trimble.com
    # BCF 2.1 Topics API — one host per region, resolved per project via /regions
    - https://open11.connect.trimble.com
    - https://open21.connect.trimble.com
    - https://open22.connect.trimble.com
    - https://open31.connect.trimble.com
    - https://open32.connect.trimble.com
  secrets:
    - trimble-connect       # cross-references ~/.aware/credentials/trimble-connect.json

# Trimble Connect is a pure REST API — there is no compiled bridge binary, so this
# agent is REST-only. (It previously also declared `transport.cli.binary:
# aware-trimble-connect`; because the runtime selects `cli` before `rest`, every
# call routed to that never-built binary and failed at run with "program not
# found" — #196.) The `auth:` block attaches the OAuth token provisioned by
# `aware connect trimble-connect` as `Authorization: Bearer` on every request.
# `base` is the North America master. Each project lives in one region, and its
# data is served only by that region's Core host, so every command takes an
# optional `region` (the project's `location`): the runtime maps it through the
# public `GET /regions` to the region's `tc-api` and sends the token only to the
# five published Core hosts above. Commands that name a project look its
# location up when `region` is omitted; the rest fall back to this base
# (cli/src/runtime/trimble_region.rs, floless.app#2184).
transport:
  rest:
    base: https://app.connect.trimble.com/tc/api/2.0/

auth:
  scheme: oauth2          # sent as `Authorization: Bearer <token>`
  secret: trimble-connect # == the `aware connect trimble-connect` credential id

commands:
  list-projects:
    lifecycle: single
    description: List the projects the authenticated user can access.
    method: GET
    path: /projects
    inputs:
      region:
        type: string
        required: false
        description: |
          The project's region: its `location` as `get-project` / `list-projects`
          return it (`northAmerica`, `europe`, `unitedKingdom`, `asia`, `australia`).
          Routes the call to that region's host. Omitted: the North America master.
      top:
        type: int
        in: query
        default: 100
        description: Page size (max 100).
      skip:
        type: int
        in: query
        default: 0
        description: Number of projects to skip (pagination).
    # The REST transport returns the raw HTTP exchange — { status, headers, body }
    # — so an app can branch on `status` (a 4xx is returned as data, not raised).
    # GET /projects responds with a bare JSON array, so the projects land in `body`.
    outputs:
      type: single
      schema:
        status: int
        headers: object
        body:
          type: array
          items:
            id:       string
            name:     string
            rootId:   string      # root folder id — pass to list-folders
            location: string      # region, e.g. "northAmerica"

  list-folders:
    lifecycle: single
    description: |
      List the items (sub-folders and files) directly under a folder. Trimble
      Connect addresses folders by globally-unique id — NOT under the project
      path — so to enumerate a project's top level, pass its `rootId` from
      list-projects. Filter the result to `type == "FOLDER"` for folders only.
    method: GET
    path: /folders/{folder-id}/items
    inputs:
      region:
        type: string
        required: false
        description: |
          The project's region: its `location` as `get-project` / `list-projects`
          return it (`northAmerica`, `europe`, `unitedKingdom`, `asia`, `australia`).
          Routes the call to that region's host. Omitted: the North America master.
      folder-id:
        type: string
        in: path
        description: Folder id (a project's rootId for the top level).
      range:
        type: string
        in: header
        required: false
        description: "A page of the list, e.g. `items=0-99` (zero-based, inclusive). The response's `content-range` header (`items 0-99/240`) says how many exist."
    # REST exchange envelope — { status, headers, body }. GET /folders/{id}/items
    # responds with a bare JSON array, so the items land in `body`.
    outputs:
      type: single
      schema:
        status: int
        headers: object
        body:
          type: array
          items:
            id:       string
            name:     string
            type:     string      # FOLDER | FILE
            parentId: string
            size:     int

  upload:
    lifecycle: single
    mode: write          # writes to TC — must be write-mode so --dry-run stubs it (#200)
    # 3-step package upload (initiate → PUT bytes to a pre-signed URL → complete),
    # handled by the runtime's trimble file handler (cli/src/runtime/trimble_files.rs,
    # #200) since it can't be expressed as a single REST call.
    description: Upload a file to a folder (3-step package upload).
    inputs:
      region:
        type: string
        required: false
        description: |
          The project's region: its `location` as `get-project` / `list-projects`
          return it (`northAmerica`, `europe`, `unitedKingdom`, `asia`, `australia`).
          Routes the call to that region's host. Omitted: the North America master.
      folder-id:  string
      filename:   string
      bytes:
        type: bytes
        description: File content. Binary travels as a base64 string (or a byte array).
      # `project-id`/`properties` are accepted for composition convenience but not
      # required: TC addresses folders by global id and dedups by content hash.
    outputs:
      type: single
      schema:
        region:     string     # the location the call was routed to, when known
        file-id:    string
        version-id: string
        replaced:   bool       # true when TC returned DUPLICATE (content already present)

  download:
    lifecycle: single
    # 2-step pre-signed download (downloadurl → GET bytes), handled by the runtime's
    # trimble file handler (#200).
    description: Download a file's bytes by ID (2-step pre-signed download).
    inputs:
      region:
        type: string
        required: false
        description: |
          The project's region: its `location` as `get-project` / `list-projects`
          return it (`northAmerica`, `europe`, `unitedKingdom`, `asia`, `australia`).
          Routes the call to that region's host. Omitted: the North America master.
      file-id:    string
      version-id:
        type: string
        description: Optional specific version; default = latest.
    outputs:
      type: single
      schema:
        region:     string     # the location the call was routed to, when known
        bytes:    string       # base64-encoded file content
        encoding: string       # "base64"
        size-kb:  number

  # ── reads (declarative REST — the { status, headers, body } envelope) ──────

  get-current-user:
    lifecycle: single
    description: The authenticated Trimble Connect user — a cheap connection check.
    method: GET
    path: /users/me
    inputs: {}
    outputs:
      type: single
      schema:
        status: int
        headers: object
        body:
          id:        string
          email:     string
          firstName: string
          lastName:  string
          status:    string

  get-project:
    lifecycle: single
    description: One project's details, including its `rootId` (root folder id).
    method: GET
    path: /projects/{project-id}
    inputs:
      region:
        type: string
        required: false
        description: |
          The project's region: its `location` as `get-project` / `list-projects`
          return it (`northAmerica`, `europe`, `unitedKingdom`, `asia`, `australia`).
          Routes the call to that region's host. Omitted: the North America master.
      project-id:
        type: string
        in: path
        description: Project id (from list-projects).
    outputs:
      type: single
      schema:
        status: int
        headers: object
        body:
          id:       string
          name:     string
          rootId:   string
          location: string

  list-project-users:
    lifecycle: single
    description: The users with access to a project.
    method: GET
    path: /projects/{project-id}/users
    inputs:
      region:
        type: string
        required: false
        description: |
          The project's region: its `location` as `get-project` / `list-projects`
          return it (`northAmerica`, `europe`, `unitedKingdom`, `asia`, `australia`).
          Routes the call to that region's host. Omitted: the North America master.
      project-id:
        type: string
        in: path
        description: Project id.
      range:
        type: string
        in: header
        required: false
        description: "A page of the list, e.g. `items=0-99` (zero-based, inclusive). The response's `content-range` header (`items 0-99/240`) says how many exist."
    outputs:
      type: single
      schema:
        status: int
        headers: object
        body:
          type: array
          items:
            id:    string
            email: string
            role:  string

  get-folder:
    lifecycle: single
    description: One folder's details — id, versionId, name, parentId, projectId.
    method: GET
    path: /folders/{folder-id}
    inputs:
      region:
        type: string
        required: false
        description: |
          The project's region: its `location` as `get-project` / `list-projects`
          return it (`northAmerica`, `europe`, `unitedKingdom`, `asia`, `australia`).
          Routes the call to that region's host. Omitted: the North America master.
      folder-id:
        type: string
        in: path
        description: Folder id.
    outputs:
      type: single
      schema:
        status: int
        headers: object
        body:
          id:        string
          versionId: string
          name:      string
          parentId:  string
          projectId: string

  get-file:
    lifecycle: single
    description: The latest version's details for a file — id, versionId, name, size, parentId.
    method: GET
    path: /files/{file-id}
    inputs:
      region:
        type: string
        required: false
        description: |
          The project's region: its `location` as `get-project` / `list-projects`
          return it (`northAmerica`, `europe`, `unitedKingdom`, `asia`, `australia`).
          Routes the call to that region's host. Omitted: the North America master.
      file-id:
        type: string
        in: path
        description: File id.
    outputs:
      type: single
      schema:
        status: int
        headers: object
        body:
          id:        string
          versionId: string
          name:      string
          size:      int
          parentId:  string
          projectId: string

  list-file-versions:
    lifecycle: single
    description: |
      A file's versions. TC answers 206 Partial Content and pages long
      histories: compare `headers.content-range` (`items a-b/total`) with
      what came back, and pass `range` for the next page.
    method: GET
    path: /files/{file-id}/versions
    inputs:
      region:
        type: string
        required: false
        description: |
          The project's region: its `location` as `get-project` / `list-projects`
          return it (`northAmerica`, `europe`, `unitedKingdom`, `asia`, `australia`).
          Routes the call to that region's host. Omitted: the North America master.
      file-id:
        type: string
        in: path
        description: File id.
      range:
        type: string
        in: header
        required: false
        description: "A page of the list, e.g. `items=0-99` (zero-based, inclusive). The response's `content-range` header (`items 0-99/240`) says how many exist."
    outputs:
      type: single
      schema:
        status: int
        headers: object
        body:
          type: array
          items:
            id:        string
            versionId: string
            name:      string
            size:      int
            createdOn: string

  # ── folder / file management (runtime handler — cli/src/runtime/trimble_ops.rs) ──
  # These assemble TC's camelCase JSON bodies from kebab-case inputs, send an
  # optional If-Match, and look up before writing, which the generic REST renderer
  # can't express — so, like upload/download, they carry no `method:`/`path:`.
  # They raise on a non-2xx (with the step, status and TC's message) rather than
  # returning it as data.

  find-item:
    lifecycle: single
    description: |
      Look up a file or folder by exact name directly under a folder. A miss is
      `{ found: false }`, not an error.
    inputs:
      region:
        type: string
        required: false
        description: |
          The project's region: its `location` as `get-project` / `list-projects`
          return it (`northAmerica`, `europe`, `unitedKingdom`, `asia`, `australia`).
          Routes the call to that region's host. Omitted: the North America master.
      folder-id:
        type: string
        description: Parent folder id to look in.
      name:
        type: string
        description: Exact item name.
      type:
        type: enum
        values: [FOLDER, FILE]
        required: false
        description: Restrict the match to folders or files.
    outputs:
      type: single
      schema:
        region:     string     # the location the call was routed to, when known
        found:      bool
        id:         string
        type:       string     # FOLDER | FILE
        folder-id:  string     # set (== id) when type is FOLDER
        file-id:    string     # set (== id) when type is FILE
        version-id: string
        name:       string
        parent-id:  string
        project-id: string
        size:       int

  list-folder-by-path:
    lifecycle: single
    description: List the items in a folder addressed by its path within a project.
    inputs:
      region:
        type: string
        required: false
        description: |
          The project's region: its `location` as `get-project` / `list-projects`
          return it (`northAmerica`, `europe`, `unitedKingdom`, `asia`, `australia`).
          Routes the call to that region's host. Omitted: the project's own location is looked up.
      project-id:
        type: string
        description: Project id.
      path:
        type: string
        description: Folder path within the project, e.g. "Project Name/Drawings/MRN".
      range:
        type: string
        required: false
        description: "A page of the list, e.g. `items=100-199` (zero-based, inclusive)."
    outputs:
      type: single
      schema:
        region:     string     # the location the call was routed to, when known
        partial:       bool     # true on a 206 — more items may exist; don't read absence from it
        content-range: string   # e.g. "items 0-99/240"; null when TC sent none
        items:
          type: array
          items:
            id:       string
            name:     string
            type:     string   # FOLDER | FILE
            parentId: string

  create-folder:
    lifecycle: single
    mode: write
    description: |
      Create a folder under a parent folder. With `if-exists: reuse` (the
      default) an existing folder of the same name is returned instead
      (`created: false`), so a retried or re-run workflow converges on one folder.
    inputs:
      region:
        type: string
        required: false
        description: |
          The project's region: its `location` as `get-project` / `list-projects`
          return it (`northAmerica`, `europe`, `unitedKingdom`, `asia`, `australia`).
          Routes the call to that region's host. Omitted: the North America master.
      parent-id:
        type: string
        description: Parent folder id (a project's rootId for the top level).
      name:
        type: string
        description: New folder name — one path segment (no `/`).
      if-exists:
        type: enum
        values: [reuse, fail]
        default: reuse
        required: false
        description: What to do when a folder of this name is already there.
    outputs:
      type: single
      schema:
        region:     string     # the location the call was routed to, when known
        folder-id:  string
        version-id: string
        name:       string
        parent-id:  string
        project-id: string
        created:    bool       # false when an existing folder was reused

  update-folder:
    lifecycle: single
    mode: write
    description: Rename and/or move a folder. Both at once sends the move, then the rename.
    inputs:
      region:
        type: string
        required: false
        description: |
          The project's region: its `location` as `get-project` / `list-projects`
          return it (`northAmerica`, `europe`, `unitedKingdom`, `asia`, `australia`).
          Routes the call to that region's host. Omitted: the North America master.
      folder-id:
        type: string
        description: Folder id.
      name:
        type: string
        required: false
        description: New name.
      parent-id:
        type: string
        required: false
        description: New parent folder id (moves the folder).
      if-match:
        type: string
        required: false
        description: Apply only if this is still the folder's latest versionId (else TC answers 412).
    outputs:
      type: single
      schema:
        region:     string     # the location the call was routed to, when known
        folder-id:  string
        version-id: string
        name:       string
        parent-id:  string
        project-id: string

  delete-folder:
    lifecycle: single
    mode: write
    description: Delete a folder by its id.
    inputs:
      region:
        type: string
        required: false
        description: |
          The project's region: its `location` as `get-project` / `list-projects`
          return it (`northAmerica`, `europe`, `unitedKingdom`, `asia`, `australia`).
          Routes the call to that region's host. Omitted: the North America master.
      folder-id:
        type: string
        description: Folder id.
      if-match:
        type: string
        required: false
        description: Delete only if this is still the folder's latest versionId (else TC answers 412).
    outputs:
      type: single
      schema:
        region:     string     # the location the call was routed to, when known
        folder-id: string
        deleted:   bool

  update-file:
    lifecycle: single
    mode: write
    description: Rename and/or move a file. Both at once sends the move, then the rename.
    inputs:
      region:
        type: string
        required: false
        description: |
          The project's region: its `location` as `get-project` / `list-projects`
          return it (`northAmerica`, `europe`, `unitedKingdom`, `asia`, `australia`).
          Routes the call to that region's host. Omitted: the North America master.
      file-id:
        type: string
        description: File id.
      name:
        type: string
        required: false
        description: New file name.
      parent-id:
        type: string
        required: false
        description: Destination folder id (moves the file).
      if-match:
        type: string
        required: false
        description: Apply only if this is still the file's latest versionId (else TC answers 412).
    outputs:
      type: single
      schema:
        region:     string     # the location the call was routed to, when known
        file-id:    string
        version-id: string
        name:       string
        parent-id:  string
        project-id: string

  delete-file:
    lifecycle: single
    mode: write
    description: Delete a file by its id.
    inputs:
      region:
        type: string
        required: false
        description: |
          The project's region: its `location` as `get-project` / `list-projects`
          return it (`northAmerica`, `europe`, `unitedKingdom`, `asia`, `australia`).
          Routes the call to that region's host. Omitted: the North America master.
      file-id:
        type: string
        description: File id.
      if-match:
        type: string
        required: false
        description: Delete only if this is still the file's latest versionId (else TC answers 412).
    outputs:
      type: single
      schema:
        region:     string     # the location the call was routed to, when known
        file-id: string
        deleted: bool

  copy-file:
    lifecycle: single
    mode: write
    description: Copy a file (its latest version, or a pinned one) into a folder.
    inputs:
      region:
        type: string
        required: false
        description: |
          The project's region: its `location` as `get-project` / `list-projects`
          return it (`northAmerica`, `europe`, `unitedKingdom`, `asia`, `australia`).
          Routes the call to that region's host. Omitted: the North America master.
      file-id:
        type: string
        description: Source file id.
      version-id:
        type: string
        required: false
        description: Source version to copy; default = latest.
      parent-id:
        type: string
        description: Destination folder id.
      merge-existing:
        type: bool
        default: false
        required: false
        description: If a same-named file exists in the destination, add this as its new version instead of a separate file.
    outputs:
      type: single
      schema:
        region:     string     # the location the call was routed to, when known
        file-id:    string
        version-id: string
        name:       string
        parent-id:  string
        project-id: string

  # ── BCF 2.1 topics (runtime handler — cli/src/runtime/trimble_bcf.rs) ──────
  # Trimble's Topics API (api.swaggerhub.com/apis/Trimble-Connect/topic/v2) is
  # served from a REGIONAL host, not under the Core base above: the handler takes
  # the `region` input or reads the project's `location`, maps it through the public `GET /regions` to that
  # region's `topic-api`, and sends the token only to one of the five published
  # Topics hosts (requires.network). Redirects are never followed. BCF 2.1 pages
  # with `top` + `skiptoken` (the next page's token comes back as
  # `next-skiptoken`) and has no If-Match / ETag. Like the management commands,
  # these raise on a non-2xx.

  list-topics:
    lifecycle: single
    description: One page of a project's BCF topics (issues).
    inputs:
      region:
        type: string
        required: false
        description: |
          The project's region: its `location` as `get-project` / `list-projects`
          return it (`northAmerica`, `europe`, `unitedKingdom`, `asia`, `australia`).
          Routes the call to that region's host. Omitted: the project's own location is looked up.
      project-id:
        type: string
        description: Project id.
      top:
        type: int
        required: false
        description: Page size; TC's maximum when omitted.
      skiptoken:
        type: string
        required: false
        description: The previous page's `next-skiptoken`; omit for the first page.
    outputs:
      type: single
      schema:
        region:     string     # the location the call was routed to, when known
        items:
          type: array
          items:
            guid:          string
            title:         string
            topic_type:    string
            topic_status:  string
            priority:      string
            assigned_to:   string
            due_date:      string
            labels:        array
            creation_date: string
            modified_date: string
        next-skiptoken: string     # null on the last page

  get-topic:
    lifecycle: single
    description: One BCF topic.
    inputs:
      region:
        type: string
        required: false
        description: |
          The project's region: its `location` as `get-project` / `list-projects`
          return it (`northAmerica`, `europe`, `unitedKingdom`, `asia`, `australia`).
          Routes the call to that region's host. Omitted: the project's own location is looked up.
      project-id:
        type: string
        description: Project id.
      topic-id:
        type: string
        description: Topic guid.
    outputs:
      type: single
      schema:
        region:     string     # the location the call was routed to, when known
        topic-id: string
        topic:    object           # the BCF 2.1 topic as TC returns it (snake_case)

  create-topic:
    lifecycle: single
    mode: write
    description: |
      Create a BCF topic. Type, status, priority and stage are the project's
      BCF extension values, passed through as given.
    inputs:
      region:
        type: string
        required: false
        description: |
          The project's region: its `location` as `get-project` / `list-projects`
          return it (`northAmerica`, `europe`, `unitedKingdom`, `asia`, `australia`).
          Routes the call to that region's host. Omitted: the project's own location is looked up.
      project-id:
        type: string
        description: Project id.
      title:
        type: string
        description: Topic title.
      description:
        type: string
        required: false
        description: Topic description.
      topic-type:
        type: string
        required: false
        description: e.g. "Issue", "Clash", "Request" (a project extension value).
      topic-status:
        type: string
        required: false
        description: e.g. "Open", "In Progress", "Closed" (a project extension value).
      priority:
        type: string
        required: false
        description: e.g. "Normal", "High" (a project extension value).
      labels:
        type: list
        required: false
        description: Labels (list of strings).
      assigned-to:
        type: string
        required: false
        description: Assignee email.
      due-date:
        type: string
        required: false
        description: ISO 8601 date-time.
      stage:
        type: string
        required: false
        description: Stage (a project extension value).
      guid:
        type: string
        required: false
        description: Client-chosen topic guid, so a retried create cannot make a second topic.
    outputs:
      type: single
      schema:
        region:     string     # the location the call was routed to, when known
        topic-id: string
        topic:    object

  update-topic:
    lifecycle: single
    mode: write
    description: |
      Change some fields of a BCF topic. The topic is read first and every field
      you don't name is sent back unchanged. `null` clears description or labels
      (Trimble Connect offers no way to clear due-date, assigned-to or stage). When
      nothing would change, nothing is written (`changed: false`). BCF 2.1 on TC
      has no If-Match: an edit made elsewhere between the read and the write is
      overwritten.
    inputs:
      region:
        type: string
        required: false
        description: |
          The project's region: its `location` as `get-project` / `list-projects`
          return it (`northAmerica`, `europe`, `unitedKingdom`, `asia`, `australia`).
          Routes the call to that region's host. Omitted: the project's own location is looked up.
      project-id:
        type: string
        description: Project id.
      topic-id:
        type: string
        description: Topic guid.
      title:
        type: string
        required: false
        description: New title (cannot be cleared).
      description:
        type: string
        required: false
        description: New description; null clears.
      topic-type:
        type: string
        required: false
        description: New type.
      topic-status:
        type: string
        required: false
        description: New status.
      priority:
        type: string
        required: false
        description: New priority.
      labels:
        type: list
        required: false
        description: Replacement labels; null clears.
      assigned-to:
        type: string
        required: false
        description: New assignee email (cannot be cleared).
      due-date:
        type: string
        required: false
        description: New due date (cannot be cleared).
      stage:
        type: string
        required: false
        description: New stage (cannot be cleared).
    outputs:
      type: single
      schema:
        region:     string     # the location the call was routed to, when known
        topic-id: string
        topic:    object
        changed:  bool             # false when the topic already had these values

  delete-topic:
    lifecycle: single
    mode: write
    description: Delete a BCF topic (with its comments, viewpoints and document references).
    inputs:
      region:
        type: string
        required: false
        description: |
          The project's region: its `location` as `get-project` / `list-projects`
          return it (`northAmerica`, `europe`, `unitedKingdom`, `asia`, `australia`).
          Routes the call to that region's host. Omitted: the project's own location is looked up.
      project-id:
        type: string
        description: Project id.
      topic-id:
        type: string
        description: Topic guid.
    outputs:
      type: single
      schema:
        region:     string     # the location the call was routed to, when known
        topic-id: string
        deleted:  bool

  list-comments:
    lifecycle: single
    description: One page of a topic's comments.
    inputs:
      region:
        type: string
        required: false
        description: |
          The project's region: its `location` as `get-project` / `list-projects`
          return it (`northAmerica`, `europe`, `unitedKingdom`, `asia`, `australia`).
          Routes the call to that region's host. Omitted: the project's own location is looked up.
      project-id:
        type: string
        description: Project id.
      topic-id:
        type: string
        description: Topic guid.
      top:
        type: int
        required: false
        description: Page size.
      skiptoken:
        type: string
        required: false
        description: The previous page's `next-skiptoken`.
    outputs:
      type: single
      schema:
        region:     string     # the location the call was routed to, when known
        items:
          type: array
          items:
            guid:                  string
            comment:               string
            author:                string
            date:                  string
            viewpoint_guid:        string
            reply_to_comment_guid: string
        next-skiptoken: string

  create-comment:
    lifecycle: single
    mode: write
    description: Add a comment to a topic, optionally about a viewpoint or replying to a comment.
    inputs:
      region:
        type: string
        required: false
        description: |
          The project's region: its `location` as `get-project` / `list-projects`
          return it (`northAmerica`, `europe`, `unitedKingdom`, `asia`, `australia`).
          Routes the call to that region's host. Omitted: the project's own location is looked up.
      project-id:
        type: string
        description: Project id.
      topic-id:
        type: string
        description: Topic guid.
      comment:
        type: string
        description: Comment text.
      viewpoint-id:
        type: string
        required: false
        description: Viewpoint guid this comment is about.
      reply-to-comment-id:
        type: string
        required: false
        description: Comment guid this replies to.
    outputs:
      type: single
      schema:
        region:     string     # the location the call was routed to, when known
        comment-id: string
        comment:    object

  list-viewpoints:
    lifecycle: single
    description: One page of a topic's viewpoints.
    inputs:
      region:
        type: string
        required: false
        description: |
          The project's region: its `location` as `get-project` / `list-projects`
          return it (`northAmerica`, `europe`, `unitedKingdom`, `asia`, `australia`).
          Routes the call to that region's host. Omitted: the project's own location is looked up.
      project-id:
        type: string
        description: Project id.
      topic-id:
        type: string
        description: Topic guid.
      top:
        type: int
        required: false
        description: Page size.
      skiptoken:
        type: string
        required: false
        description: The previous page's `next-skiptoken`.
    outputs:
      type: single
      schema:
        region:     string     # the location the call was routed to, when known
        items:
          type: array
          items:
            guid:               string
            perspective_camera: object
            orthogonal_camera:  object
            snapshot:           object
        next-skiptoken: string

  create-viewpoint:
    lifecycle: single
    mode: write
    description: |
      Add a viewpoint (camera, markup, component state and/or a PNG/JPEG
      snapshot) to a topic. Cameras, lines, clipping planes and components use
      BCF's own wire shape and are checked before anything is sent.
    inputs:
      region:
        type: string
        required: false
        description: |
          The project's region: its `location` as `get-project` / `list-projects`
          return it (`northAmerica`, `europe`, `unitedKingdom`, `asia`, `australia`).
          Routes the call to that region's host. Omitted: the project's own location is looked up.
      project-id:
        type: string
        description: Project id.
      topic-id:
        type: string
        description: Topic guid.
      perspective-camera:
        type: object
        required: false
        description: "BCF perspective_camera: camera_view_point, camera_direction, camera_up_vector ({x,y,z}) and field_of_view."
      orthogonal-camera:
        type: object
        required: false
        description: "BCF orthogonal_camera: the same points plus view_to_world_scale."
      lines:
        type: list
        required: false
        description: "BCF lines: [{start_point, end_point}]."
      clipping-planes:
        type: list
        required: false
        description: "BCF clipping_planes: [{location, direction}]."
      components:
        type: object
        required: false
        description: "BCF components: {selection, coloring, visibility}."
      snapshot:
        type: bytes
        required: false
        description: PNG or JPEG image, base64 (max 20 MiB).
      snapshot-type:
        type: enum
        values: [png, jpg]
        required: false
        description: Declared image type; inferred from the bytes when omitted, refused when it disagrees.
    outputs:
      type: single
      schema:
        region:     string     # the location the call was routed to, when known
        viewpoint-id: string
        viewpoint:    object

  get-viewpoint-snapshot:
    lifecycle: single
    description: A viewpoint's snapshot image, base64.
    inputs:
      region:
        type: string
        required: false
        description: |
          The project's region: its `location` as `get-project` / `list-projects`
          return it (`northAmerica`, `europe`, `unitedKingdom`, `asia`, `australia`).
          Routes the call to that region's host. Omitted: the project's own location is looked up.
      project-id:
        type: string
        description: Project id.
      topic-id:
        type: string
        description: Topic guid.
      viewpoint-id:
        type: string
        description: Viewpoint guid.
    outputs:
      type: single
      schema:
        region:     string     # the location the call was routed to, when known
        bytes:        string       # base64-encoded image
        encoding:     string       # "base64"
        content-type: string       # e.g. image/png
        size-kb:      number

  list-document-references:
    lifecycle: single
    description: One page of a topic's document references.
    inputs:
      region:
        type: string
        required: false
        description: |
          The project's region: its `location` as `get-project` / `list-projects`
          return it (`northAmerica`, `europe`, `unitedKingdom`, `asia`, `australia`).
          Routes the call to that region's host. Omitted: the project's own location is looked up.
      project-id:
        type: string
        description: Project id.
      topic-id:
        type: string
        description: Topic guid.
      top:
        type: int
        required: false
        description: Page size.
      skiptoken:
        type: string
        required: false
        description: The previous page's `next-skiptoken`.
    outputs:
      type: single
      schema:
        region:     string     # the location the call was routed to, when known
        items:
          type: array
          items:
            guid:          string
            document_guid: string
            url:           string
            description:   string
        next-skiptoken: string

  create-document-reference:
    lifecycle: single
    mode: write
    description: Attach a document reference to a topic — a Trimble Connect file or a URL.
    inputs:
      region:
        type: string
        required: false
        description: |
          The project's region: its `location` as `get-project` / `list-projects`
          return it (`northAmerica`, `europe`, `unitedKingdom`, `asia`, `australia`).
          Routes the call to that region's host. Omitted: the project's own location is looked up.
      project-id:
        type: string
        description: Project id.
      topic-id:
        type: string
        description: Topic guid.
      document-id:
        type: string
        required: false
        description: A Trimble Connect file id (on TC a BCF document is a project file). Give this or `url`.
      url:
        type: string
        required: false
        description: A link to the referenced document. Give this or `document-id`.
      description:
        type: string
        required: false
        description: What the document is.
    outputs:
      type: single
      schema:
        region:     string     # the location the call was routed to, when known
        document-reference-id: string
        document-reference:    object

  # ── ToDos (Core API 2.0 — same base) ───────────────────────────────────────

  list-todos:
    lifecycle: single
    description: |
      A project's ToDos, or those on one file (version). TC pages the list: a
      206 with `content-range` (`items 0-99/240`) means more exist; pass
      `range` for the next page.
    inputs:
      region:
        type: string
        required: false
        description: |
          The project's region: its `location` as `get-project` / `list-projects`
          return it (`northAmerica`, `europe`, `unitedKingdom`, `asia`, `australia`).
          Routes the call to that region's host. Omitted: the project's own location is looked up.
      project-id:
        type: string
        description: Project id.
      file-id:
        type: string
        required: false
        description: Only the ToDos on this file (its latest version).
      version-id:
        type: string
        required: false
        description: Only the ToDos on this file version (needs `file-id`).
      range:
        type: string
        required: false
        description: "A page, e.g. `items=100-199` (zero-based, inclusive)."
    outputs:
      type: single
      schema:
        region:     string     # the location the call was routed to, when known
        partial:       bool     # true on a 206 — more items may exist
        content-range: string   # e.g. "items 0-99/240"; null when TC sent none
        items:
          type: array
          items:
            id:          string
            label:       string
            title:       string
            description: string
            status:      string
            priority:    string
            dueDate:     string
            assignees:   array

  get-todo:
    lifecycle: single
    description: One ToDo.
    method: GET
    path: /todos/{todo-id}
    inputs:
      region:
        type: string
        required: false
        description: |
          The project's region: its `location` as `get-project` / `list-projects`
          return it (`northAmerica`, `europe`, `unitedKingdom`, `asia`, `australia`).
          Routes the call to that region's host. Omitted: the North America master.
      todo-id:
        type: string
        in: path
        description: ToDo id.
    outputs:
      type: single
      schema:
        status: int
        headers: object
        body:
          id:              string
          label:           string
          title:           string
          description:     string
          type:            string
          status:          string
          priority:        string
          percentComplete: int
          dueDate:         string
          projectId:       string
          assignees:       array

  create-todo:
    lifecycle: single
    mode: write
    description: Create a ToDo in a project.
    inputs:
      region:
        type: string
        required: false
        description: |
          The project's region: its `location` as `get-project` / `list-projects`
          return it (`northAmerica`, `europe`, `unitedKingdom`, `asia`, `australia`).
          Routes the call to that region's host. Omitted: the project's own location is looked up.
      project-id:
        type: string
        description: Project id.
      description:
        type: string
        description: What needs doing.
      title:
        type: string
        required: false
        description: Short title.
      type:
        type: string
        required: false
        description: A ToDo type of the project (e.g. Request, Issue).
      label:
        type: string
        required: false
        description: Label, unique within the project.
      due-date:
        type: string
        required: false
        description: ISO 8601 date or date-time (TC keeps the date). `Z` is sent as `+0000`.
      percent-complete:
        type: int
        required: false
        description: Progress, 0-100.
      status:
        type: enum
        values: [NEW, IN_PROGRESS, RESOLVED, BLOCKED, CLOSED]
        required: false
        description: Status.
      priority:
        type: enum
        values: [LOW, NORMAL, HIGH, CRITICAL]
        required: false
        description: Priority.
      assignees:
        type: list
        required: false
        description: "User ids, or `{id, type: USER|GROUP}` objects."
    outputs:
      type: single
      schema:
        region:     string     # the location the call was routed to, when known
        todo-id: string
        todo:    object

  update-todo:
    lifecycle: single
    mode: write
    description: Change some fields of a ToDo. `null` clears due-date or assignees.
    inputs:
      region:
        type: string
        required: false
        description: |
          The project's region: its `location` as `get-project` / `list-projects`
          return it (`northAmerica`, `europe`, `unitedKingdom`, `asia`, `australia`).
          Routes the call to that region's host. Omitted: the North America master.
      todo-id:
        type: string
        description: ToDo id.
      description:
        type: string
        required: false
        description: New description.
      title:
        type: string
        required: false
        description: New title.
      type:
        type: string
        required: false
        description: New type.
      label:
        type: string
        required: false
        description: New label (TC keeps a label once set; it cannot be cleared).
      due-date:
        type: string
        required: false
        description: New due date (ISO 8601; TC keeps the date); null clears.
      percent-complete:
        type: int
        required: false
        description: Progress, 0-100.
      status:
        type: enum
        values: [NEW, IN_PROGRESS, RESOLVED, BLOCKED, CLOSED]
        required: false
        description: New status.
      priority:
        type: enum
        values: [LOW, NORMAL, HIGH, CRITICAL]
        required: false
        description: New priority.
      assignees:
        type: list
        required: false
        description: Replacement assignees; null clears.
    outputs:
      type: single
      schema:
        region:     string     # the location the call was routed to, when known
        todo-id: string
        todo:    object

  delete-todo:
    lifecycle: single
    mode: write
    description: Delete a ToDo.
    inputs:
      region:
        type: string
        required: false
        description: |
          The project's region: its `location` as `get-project` / `list-projects`
          return it (`northAmerica`, `europe`, `unitedKingdom`, `asia`, `australia`).
          Routes the call to that region's host. Omitted: the North America master.
      todo-id:
        type: string
        description: ToDo id.
    outputs:
      type: single
      schema:
        region:     string     # the location the call was routed to, when known
        todo-id: string
        deleted: bool

