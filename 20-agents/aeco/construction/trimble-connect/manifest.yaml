agent:        trimble-connect
version:      0.2.0
sdk-target:   2.4.0
display-name: Trimble Connect
description: |
  Read and write files in a Trimble Connect project. Auto-generated from
  Trimble Connect's public OpenAPI spec + refined to capture idempotency,
  rate-limit, and auth-refresh patterns the REST surface alone doesn't
  encode.

stateful: false

vendor:   trimble
license:  Apache-2.0
homepage: https://github.com/aware-aeco/aware/tree/main/20-agents/aeco/construction/trimble-connect
keywords: [aeco, construction, cde, bim, trimble, collaboration]

provenance:
  generated-by:     aware-agent-builder
  generator-version: 0.1.0
  source:
    type: openapi
    url:  https://app.connect.trimble.com/tc/api/2.0/openapi.json
  refined-by:       [pawellisowski]
  generated-at:     2026-04-01T00:00:00Z

requires:
  network:
    - https://app.connect.trimble.com
  secrets:
    - trimble-connect       # cross-references ~/.aware/credentials/trimble-connect.json

# Trimble Connect is a pure REST API — there is no compiled bridge binary, so this
# agent is REST-only. (It previously also declared `transport.cli.binary:
# aware-trimble-connect`; because the runtime selects `cli` before `rest`, every
# call routed to that never-built binary and failed at run with "program not
# found" — #196.) The `auth:` block attaches the OAuth token provisioned by
# `aware connect trimble-connect` as `Authorization: Bearer` on every request.
transport:
  rest:
    base: https://app.connect.trimble.com/tc/api/2.0/

auth:
  scheme: oauth2          # sent as `Authorization: Bearer <token>`
  secret: trimble-connect # == the `aware connect trimble-connect` credential id

commands:
  list-projects:
    lifecycle: single
    description: List the projects the authenticated user can access.
    method: GET
    path: /projects
    inputs:
      top:
        type: int
        in: query
        default: 100
        description: Page size (max 100).
      skip:
        type: int
        in: query
        default: 0
        description: Number of projects to skip (pagination).
    # The REST transport returns the raw HTTP exchange — { status, headers, body }
    # — so an app can branch on `status` (a 4xx is returned as data, not raised).
    # GET /projects responds with a bare JSON array, so the projects land in `body`.
    outputs:
      type: single
      schema:
        status: int
        headers: object
        body:
          type: array
          items:
            id:       string
            name:     string
            rootId:   string      # root folder id — pass to list-folders
            location: string      # region, e.g. "northAmerica"

  list-folders:
    lifecycle: single
    description: |
      List the items (sub-folders and files) directly under a folder. Trimble
      Connect addresses folders by globally-unique id — NOT under the project
      path — so to enumerate a project's top level, pass its `rootId` from
      list-projects. Filter the result to `type == "FOLDER"` for folders only.
    method: GET
    path: /folders/{folder-id}/items
    inputs:
      folder-id:
        type: string
        in: path
        description: Folder id (a project's rootId for the top level).
    # REST exchange envelope — { status, headers, body }. GET /folders/{id}/items
    # responds with a bare JSON array, so the items land in `body`.
    outputs:
      type: single
      schema:
        status: int
        headers: object
        body:
          type: array
          items:
            id:       string
            name:     string
            type:     string      # FOLDER | FILE
            parentId: string
            size:     int

  upload:
    lifecycle: single
    # 3-step package upload (initiate → PUT bytes to a pre-signed URL → complete),
    # handled by the runtime's trimble file handler (cli/src/runtime/trimble_files.rs,
    # #200) since it can't be expressed as a single REST call.
    description: Upload a file to a folder (3-step package upload).
    inputs:
      folder-id:  string
      filename:   string
      bytes:
        type: bytes
        description: File content. Binary travels as a base64 string (or a byte array).
      # `project-id`/`properties` are accepted for composition convenience but not
      # required: TC addresses folders by global id and dedups by content hash.
    outputs:
      type: single
      schema:
        file-id:    string
        version-id: string
        replaced:   bool       # true when TC returned DUPLICATE (content already present)

  download:
    lifecycle: single
    # 2-step pre-signed download (downloadurl → GET bytes), handled by the runtime's
    # trimble file handler (#200).
    description: Download a file's bytes by ID (2-step pre-signed download).
    inputs:
      file-id:    string
      version-id:
        type: string
        description: Optional specific version; default = latest.
    outputs:
      type: single
      schema:
        bytes:    string       # base64-encoded file content
        encoding: string       # "base64"
        size-kb:  number

skills:
  - auth-flow.md
  - idempotency.md
  - rate-limits.md
  - files.md
  - projects.md
  - topics.md
  - viewpoints.md
