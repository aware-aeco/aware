agent:        ifc-reference-reader
# 1.0.0: `read-model` used to return web-ifc's Y-up renderer frame while claiming the file's own world
# frame, and 0.1.0 shipped that way in @aware-aeco/cli 0.112.0 (aware-aeco/aware#343). A consumer that
# compensated with a rotation of its own is CORRECT against 0.1.0 and WRONG against this, so it is a
# breaking change — and the Agent Spec (10-core/agent-spec.md, "Versioning") requires a MAJOR bump plus
# a BREAKING.md for those. Both are here; see BREAKING.md.
#
# Do NOT read protection into this number. Measured 2026-08-01: an app's `requires:` pin is enforced
# neither at compile nor at run time (`ifc-reference-reader@9.9.x` compiled and ran clean against an
# installed 1.0.0 — filed separately), the registry index key is a separate axis whose tarball tracks
# `main`, and the bridge binary that actually produces the geometry is installed separately, so a stale
# one can serve the OLD frame under this manifest with only a warning. The frame a consumer actually
# received is in the OUTPUT — every command reports `frame` — and that is the field to check.
# 1.2.0: `read-model` gained `storeys` / `ifc-types` / `ids` filters and a `max-bytes` budget, `probe`
# gained the storey + type breakdown that lets a consumer choose one, and the response is now streamed
# rather than built as a single JSON string (aware-aeco/aware#352, #353). Additive throughout — an
# older consumer that passes none of the new inputs gets exactly the old behaviour — so MINOR. What is
# NOT additive is the absence of these fields: a pre-1.2.0 BRIDGE serves this manifest and omits them,
# so absent means "this bridge cannot answer", never "this file has no storeys" (the same caution
# `frame` and `propertySets` already require — see BREAKING.md).
# 1.3.0: `read-model` objects now carry `colors` — the file's own surface colours, as runs over the
# index buffer (colour is per placed geometry, and 6,358 of one real model's 77,118 objects carry more
# than one). Additive, so MINOR. The absence caution applies here too and is sharper than usual: an
# unstyled file and a pre-1.3.0 BRIDGE both say nothing, because web-ifc reports opaque white for
# unstyled geometry and white cannot be told from an authored white. Both silences mean the same thing
# to a consumer — render your own default — so the ambiguity costs nothing (see read-model.md).
version:      1.3.0
display-name: IFC Reference Reader (whole model → mesh)
description: |
  Read a WHOLE IFC file as a reference model — borrowed geometry you overlay, measure and build to,
  but never own. Returns AWARE's generic kind:"mesh" scene primitive (positions+indices) in canonical
  millimetres for every element, plus what the file says about each one: name, IFC type, storey,
  profile designation, material, every property set verbatim — which in a real file is often the
  only thing that tells one object from another — and the surface colours it is styled with. Drives the
  bundled web-ifc WASM parser; it never re-implements an IFC geometry kernel.

  ONE FRAME for both commands: IFC's own Z-up world frame, in millimetres — reported as `frame` in
  every output, so a consumer checks it rather than assuming it. `read-model`'s vertices and `probe`'s
  bbox therefore share axes and units, which is what lets the cheap box sanity-check the expensive mesh
  ("is this 1000x off?"). They do NOT share one coherent world origin: probe's box unions the file's
  raw points across their several local coordinate systems, so a placed mesh can fall outside it (see
  probe.md). That costs a rotation the reader performs for you: web-ifc tessellates into its own Y-up
  renderer frame, and this agent rotates back rather than leaving every consumer to discover it
  (aware-aeco/aware#343).

  Persona (anyone building against someone else's model): "The architect sent me their model. I want
  to see it next to mine, snap to it and build to it — I am not importing it." That is the whole
  distinction from `connection-reader`, which answers the opposite question: pick ONE connection out
  of a file and make it mine. Same file format, same bridge, opposite intent — so they are separate
  agents rather than four commands on one.

  `probe` answers the cheap questions (schema, declared units, element count, rough extent) WITHOUT
  tessellating, so a consumer can refuse a file before paying to load it. `read-model` then returns
  the geometry. Pairs with `ifc-inspector` (property sets) and `viewer-3d` (render it).

stateful: false

vendor:   aware-aeco
license:  Apache-2.0
homepage: https://github.com/aware-aeco/aware/tree/main/20-agents/aeco/engineering/ifc-reference-reader
keywords: [aware, ifc, reference, model, coordination, overlay, mesh, tessellation, web-ifc, units]

provenance:
  generated-by:      hand-curated
  generator-version: 0.13.0
  refined-by:        [pawellisowski]

requires:
  filesystem:
    - read: '*.ifc,*.ifczip'

# CLI transport. Deliberately the SAME binary as `connection-reader`: both agents are thin intents
# over one web-ifc bridge, and the sidecar registry resolves an install by BINARY name, not by agent
# name (cli/src/commands/sidecar.rs, cli/src/runtime/invoker.rs). Sharing it means this agent needs no
# new downloadable asset and works the moment `aware sidecar install connection-reader` has been run.
transport:
  cli:
    binary: aware-connection-reader

commands:

  probe:
    lifecycle: single
    category: curated
    description: |
      Answer the cheap questions about an IFC WITHOUT tessellating: which schema, what length unit it
      declares, how many elements it places, and roughly where and how big it sits. Fast even on a
      large file, because no geometry is walked.

      This exists so a consumer can decide whether to load a file AT ALL before paying to tessellate
      it — tessellating a 300 MB model in order to discover it is too big is the freeze a size cap is
      meant to prevent.

      `units.declared` is PROVENANCE, not a conversion factor. web-ifc reads IfcUnitAssignment itself
      and normalises geometry to metres before any caller sees a vertex, so nothing downstream may
      scale mesh coordinates by this value. It is here so a user can see what they were handed, and so
      a file that LIES about its units can be spotted and overridden. `null` means the file did not
      say — an honest unknown, never a guess. Read-only.
    inputs:
      ifc-path:
        type: string
        description: Absolute or workspace-relative path to the .ifc / .ifczip file.
    outputs:
      type: single
      schema:
        schema: string   # "IFC2X3" | "IFC4" | "IFC4X3_ADD2" | …
        units: object    # { declared: "MILLI.METRE" | "METRE" | null } — provenance, NOT a factor
        elements: number # elements placed DIRECTLY in the spatial structure. NOT equal to
                         # read-model's object count — different populations (see probe.md)
        storeys: array   # [{ name, elements }] descending by count — what a read-model `storeys`
                         # filter can select, so a consumer can offer "which floor?" before paying
                         # for a read. Counts the population a READ returns (placed + everything
                         # aggregated beneath it), NOT `elements` above: on a real 12-storey model
                         # those are 17,460 and 5,878, and a breakdown that summed to the latter
                         # would under-predict every read by 3x. `name` is null for an unnamed
                         # storey. An UPPER BOUND — whether an element carries a drawable triangle
                         # is only knowable by tessellating, which probe exists not to do
        types: array     # [{ name, elements }] descending — the same population by IFC entity, for
                         # the `ifc-types` filter. Covers the spatial structure, so an element
                         # outside it (a site's own surface) is not counted here even though
                         # `ifc-types` can reach it
        frame: string    # "z-up" — the frame bbox is in. Stated in the output because no version
                         # number can answer it: the bridge binary is installed separately and a
                         # stale one still runs (with a warning). Check this, not a version.
        bbox: object     # { min: [x,y,z], max: [x,y,z] } APPROXIMATE, in mm, Z-up — the SAME frame
                         # read-model's vertices use. NULL when the length unit cannot be resolved,
                         # or there are no usable 3D points; callers must handle null, because a
                         # guessed box is worse than none. It bounds the file's own points and
                         # ignores placement nesting, so it can OVERSTATE badly (42 x 44 x 74 m for
                         # a model that renders 3.6 x 3.7 x 0.7 m) and can also miss geometry placed
                         # outside it. Never a size — and never a POSITION either: its midpoint is
                         # about half way from the origin to the model, and no cheap test on the box
                         # tells you whether you are in that case (aware-aeco/aware#348). Ask
                         # read-model for both. Use `elements` / `storeys` / `types` to decide
                         # whether that read is affordable.

  read-model:
    lifecycle: single
    category: curated
    description: |
      Tessellate the file into mesh scene objects — every element by default, not only connection
      hardware — each a kind:"mesh" element (positions + indices) in canonical millimetres, in the
      file's own Z-up world frame (the same frame `probe`'s bbox reports). A consumer re-anchors and
      places, and must NOT apply a Y-up correction: the reader already undid web-ifc's Y-up
      tessellation frame. Deterministic for a given file, so the result is content-hash cacheable.

      Pass `storeys`, `ifc-types` or `ids` to read PART of it. They are resolved to expressIDs before
      any tessellation happens, so the elements nobody asked for cost nothing — which is the whole
      point on a model where reading everything is not affordable. Several filters INTERSECT. A filter
      can only ever select a subset of what an unfiltered read returns: notably it will not hand back
      subtraction features (IfcOpeningElement — the prisms cut out of walls for doors), which a whole
      read has never returned and which would otherwise appear as solid boxes filling every opening.

      A filter value that matches nothing comes back in `selected.unmatched` rather than silently
      selecting zero, because zero objects and "you misspelled the storey" are the same answer
      otherwise. Run `probe` first for the storey and type names worth passing.

      Each object also carries what the file SAYS about it: `name`, `ifcType`, `storey`, `profile`,
      `material` and `propertySets`. Two of those are load-bearing rather than decorative. `profile`
      is the designation verbatim ("W10x33", lowercase x and all) — a section must be looked up by
      name and never measured off the mesh, because exports routinely write a simplified box for a
      real profile. `material` is the signal that says do not convert this: a member can be named
      "girder" and typed IfcBeam while being spruce.

      `propertySets` is the IfcPropertySets the element carries, grouped and named exactly as the
      file wrote them, with no normalisation, translation or renaming — because in a real file that is
      where the meaning is. One test file's objects are all IfcBuildingElementProxy, so name, type and
      storey identify nothing, while 31 property sets carry 271 values under vendor set names in
      Norwegian. Occurrence and type-level sets are both collected (IFC lets a property sit on the
      element type with the occurrence inheriting it), merged PROPERTY BY PROPERTY with the occurrence
      winning — the same rule `ifc-inspector.entities.get-by-guid` applies, because two agents reading
      one file must not disagree about what it says; set-level precedence would drop a type property
      the occurrence never mentioned. Quantity sets (IfcElementQuantity) are not included, nor is
      IfcRelDefinesByObject reflection (valid IFC4, but uncommon and with precedence this reader cannot
      settle without a real file). Values are canonical text, not the file's literal tokens: web-ifc
      parses before we see them, so an authored 1.2300 arrives as 1.23.

      For `propertySets`, `[]` means the file carries none. A MISSING field means something else: the bridge binary is
      installed separately and a pre-1.1.0 one omits it entirely under this manifest, so absent reads
      as "this bridge cannot answer" — the same caution `frame` already requires. A consumer caching
      the response must not key that cache on the IFC bytes alone.

      Each object also carries `colors` — the surface colours the file styles it with, as RUNS over the
      index buffer, because colour is per placed geometry and one object routinely has several (6,358
      of 77,118 in one real steel export). A run's alpha below 1 is transparency the file authored.

      `colors` is ABSENT, never empty, when the file authors no colour at all. web-ifc reports opaque
      WHITE for unstyled geometry and that is indistinguishable from a wall the architect painted
      white, so the question is asked of the FILE — does it carry any IfcSurfaceStyle? — and the answer
      gates the whole field; a consumer that sees no colours renders its own default rather than a
      white nobody chose. Because a pre-1.3.0 BRIDGE is silent in exactly the same way, every response
      also carries `colorsAvailable`: `false` is a permanent fact about the file, an absent field is a
      stale install. They render alike, but only one of them is repairable and only one is true to say.

      This overlaps `ifc-inspector` deliberately, and the SHAPE is what differs: that agent answers
      per-GUID or exports a whole class to CSV, on its own binary. An interactive object tree needs
      every object's properties out of the one read it already pays for — a call per click would mean
      a second sidecar download and an agent round trip on every selection.

      `max-vertices` is an in-process circuit breaker: the budget decrements as meshes stream and the
      command aborts mid-walk. It is NOT a preflight gate — an exact vertex count cannot be known
      before tessellating, so a cap applied after this returns would fire only once the payload that
      causes the freeze had already been built. Read-only.
    inputs:
      ifc-path:
        type: string
        description: Absolute or workspace-relative path to the .ifc / .ifczip file.
      max-vertices:
        type: number
        description: Optional vertex budget; the command aborts mid-tessellation if the file exceeds it.
      storeys:
        type: array
        description: >
          Optional storey names (from probe.storeys) to read. Resolved to expressIDs BEFORE
          tessellation, so what is not asked for is never built. Case-insensitive. Combines with the
          other filters by INTERSECTION. An EMPTY list selects nothing — only omitting the key means
          unfiltered, because the other reading returns the whole building to a caller who asked for
          a subset precisely because it cannot afford the whole building.
      ifc-types:
        type: array
        description: >
          Optional IFC entity names to read, e.g. [IFCBEAM, IFCCOLUMN] (from probe.types). Subtypes
          are included, so IFCBUILDINGELEMENT does not select nothing. Case-insensitive.
      ids:
        type: array
        description: Optional GlobalIds to read — for re-reading a known selection.
      max-bytes:
        type: number
        description: >
          Optional response-size budget in bytes. Absent means no limit. Opt-in because streaming
          removed the ceiling that used to make a size cap compulsory; it exists so a consumer with a
          ceiling of its own is told the size instead of discovering it as an out-of-memory.
    outputs:
      type: single
      schema:
        frame: string  # "z-up" — the frame `positions` are in. Check this rather than a version:
                       # the geometry comes from a separately-installed bridge binary, so the agent
                       # version cannot speak for it (see BREAKING.md)
        objects: array # [{ id, name, ifcType, storey, profile, material,
                       #    propertySets: [{ name, properties: [{ name, value }] }],
                       #    positions: [mm], indices,
                       #    colors?: [{ rgba: [r,g,b,a], start, count }] }]
                       # `colors` are the file's own surface colours as RUNS over `indices` — colour
                       # is per placed geometry, not per object. ABSENT (never []) when the file
                       # authors no colour at all: web-ifc reports opaque WHITE for unstyled
                       # geometry, so a consumer handed that would paint an unstyled model white and
                       # call it real. See read-model.md
        skipped: number # products streamed but carrying no drawable triangle — counted, never
                        # dropped silently, so a consumer can reconcile against probe.elements
        count: number   # objects returned. Present always; equals objects.length
        colorsAvailable: boolean # whether the file authors ANY surface colour. Present from 1.3.0
                         # always, so `false` (this file has none, permanently) stays distinct from
                         # ABSENT (a pre-1.3.0 bridge, which a sidecar install would fix). Both
                         # render the same, but only one is repairable and only one is true to say
        selected: object # ONLY when a filter was passed, so "unfiltered" and "a filter that matched
                         # everything" stay distinguishable:
                         #   { storeys?, ifcTypes?, ids?, candidates, unmatched }
                         # `unmatched` lists filter values nothing matched — [{storey}|{ifcType}|{id}]
                         # — because zero objects otherwise reads as "this model has none of those"
                         # when the truth is a misspelling. A VALID entity the model lacks counts as
                         # unmatched too, not just an unknown name
        budget: object   # ONLY when max-bytes was passed: { maxBytes, bytes }. The receipt that says
                         # the budget was enforced — without it a caller cannot tell this bridge from
                         # a pre-1.2.0 one that ignored the input, since both return a success

skills:
  - what-this-agent-does.md
