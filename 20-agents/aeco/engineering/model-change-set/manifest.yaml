agent: model-change-set
version: 0.6.1
display-name: Model Change Set
description: |
  Pair the objects of two saved states of one model by a native identity the caller pins, report
  what was added, removed and changed as `aware.model-change-set/v1`, and run a pinned set of data-defined
  checks over what that change touched (`aware.model-change-findings/v1`). Pure and format-blind: the caller
  supplies each state's canonical query documents, a comparison profile and a check profile; no provider,
  host, authorization or source file is involved, and format meaning stays in the profiles.

  This is its own agent, separate from `model-reference-reader`, so that a workflow pinning an exact
  `model-reference-reader` version and a workflow comparing saved states can share one AWARE home.
stateful: false
# The connection-reader bridge ships with the AWARE CLI, and the bridge that runs clash on one version
# (`revised-geometry-dir` in mode single, bridge 0.7.0, #873) first shipped in CLI 0.184.0. On an older CLI
# its bridge refuses that request at run time (#879), so the agent is gated to the CLI that carries it: an
# older CLI passes this release over for the newest one it can run, or refuses the install.
status: requires-runtime
minimum-cli-version: 0.184.0
vendor: aware-aeco
license: Apache-2.0
homepage: https://github.com/aware-aeco/aware/tree/main/20-agents/aeco/engineering/model-change-set
keywords: [aware, model, change, compare, diff, check, findings, clash, standards, coverage, deterministic, identity]
provenance:
  generated-by: hand-curated
  generator-version: 0.184.0
  refined-by: [pawellisowski]
requires:
  filesystem:
    - read: '*'
skills:
  - what-this-agent-does.md
transport:
  cli:
    binary: aware-connection-reader
commands:
  compare-snapshots:
    lifecycle: single
    category: curated
    description: |
      Pair the objects of TWO saved states of one model by a native identity the caller pins, and say what
      was added, removed and changed (`aware.model-change-set/v1`). Pure and format-blind: the caller
      supplies each state's three canonical query documents (`entities.json`, `properties.json`,
      `relationships.json`) and a comparison PROFILE (data) naming the identity property, volatile keys,
      key rules, shape-field keys, the bounds tolerance and the output budgets. AWARE contains no format
      meaning; it applies the profile. No provider, host or authorization is involved, and no source file
      is opened.

      Pairing is by identity ONLY. Unpaired objects are grouped by type and name for presentation, never
      paired. Numeric ids (entity ids, row ids, definition ids) never decide a change. Objects whose
      identity is blank or duplicated are excluded with receipts. When fewer than the profile's
      `discontinuityThreshold` of the base objects pair, `identity.discontinuity` is true and the added and
      removed counts are not a reliable change list. Placement is compared on each object's bounding box
      only; that limit, and the fact that holes, cuts, fittings and solid geometry are not compared, are
      always listed in `unchecked`. An optional witness (the source's own change log, as
      `{entries:[{identity, action}]}`) is reported against the diff and never changes it.

      Counts are complete; rows are capped in a pinned order (removed, added, changed, each by identity)
      and the cap is stated. Output is canonical JSON, byte-identical for the same inputs. Read-only.
    inputs:
      base-dir:
        type: string
        required: true
        description: Directory holding the earlier state's entities.json, properties.json and relationships.json.
      revised-dir:
        type: string
        required: true
        description: Directory holding the later state's entities.json, properties.json and relationships.json.
      profile-path:
        type: string
        required: true
        description: Path to the comparison profile JSON (aware.model-compare-profile/v1). Unknown or missing keys are rejected.
      witness-path:
        type: string
        required: false
        description: "Optional path to a witness JSON, exactly {entries: [{identity, action}]} where action is created, modified or deleted."
    outputs:
      type: single
      schema:
        schema: string          # "aware.model-change-set/v1"
        inputs: object          # sha256 of each of the six documents' bytes, profileDigest (sha256 of the canonical profile), witnessDigest, row counts
        profile: object         # { id, version } echoed
        identity: object        # { base, revised, paired, added, removed, pairedShareOfBase, excluded: {blank, duplicate}, discontinuity, discontinuityThreshold }
        changes: array          # removed, then added, then changed, each by identity; changed rows carry kinds[] and fields[] (at most 50, truncatedFields counts the rest)
        unpaired: object        # { groupCount, groups: [{ type, name, removed: {count, entityIds, truncated}, added: {...} }] }
        ambiguousFields: object # { count, items, truncated } - fields not compared because two properties shared one comparison key
        summary: object         # { added, removed, changed, unchanged, byKind, relationships }
        truncated: object       # { omitted: {added, removed, changed}, groups, receipts }
        unchecked: array        # plain statements of what was not compared
        witness: object         # null without a witness, else { digest, entries, agrees, witnessOnly, diffOnly }
  check-snapshots:
    lifecycle: single
    category: curated
    description: |
      Run a pinned set of checks over the objects a change touched between TWO saved states of one model, and
      say which findings the change introduced, which were already there and which it resolved
      (`aware.model-change-findings/v1`). Pure and format-blind: the caller supplies the same inputs as
      `compare-snapshots` (each state's `entities.json`, `properties.json`, `relationships.json` and the
      comparison profile, which decides identity, pairing and what counts as changed) plus a CHECK PROFILE
      (data) listing the rules, their severity, the object types each applies to and the output budgets.
      AWARE contains no format meaning; it applies the profiles. No provider, host or authorization is
      involved, and no source file is opened.

      Scope is every added object, every changed object (from the full pairing, not the capped change rows)
      and every identity the caller names in an optional focus file for a re-check. Each in-scope object is
      evaluated for each rule that applies to its type. A finding carries a `correspondenceKey` (which rule,
      which objects, where) and an `evidenceFingerprint` (that plus the rule version and the evidence), both
      exactly recomputable, and a `presence`: `introduced`, `pre-existing`, `pre-existing-changed`, or, for a
      rule that declares a numeric worsening metric, `pre-existing-worsened` / `pre-existing-improved`.
      Findings that existed in the earlier state and no longer occur on an object the rule still applies to are listed as `resolvedInChange`; a rule that stops applying resolves nothing. Each focus
      identity gets one result per rule: `finding`, `passed`, `not-applicable`, `excluded`, `absent` (only
      when the revised state has no object whose identity was blank or duplicated) or `not-evaluated`.

      Clash (0.3.0): a check profile may also carry the predicates `clash-overlap`, `clash-contact` and
      `clash-bolted-plies` (target `solid`) and a `geometry` block. These are pair rules over the solids of the
      parts a change touched and their dependency closure (the plies/parts of changed bolt groups and welds
      included): parts that pass into each other (thickness of the shared region, measured per region), parts
      that touch with no bolt or weld joining them, and bolted plies that do not meet. They read the GLB tiles
      in `base-geometry-dir` / `revised-geometry-dir` (every sha256 verified; required whenever a clash rule is
      present). A solid that is not fully evaluated is labelled and a pair with it is `not-evaluated`, never
      `passed`. The output then also carries `focusSets` (pair re-checks), `scope.notEvaluated`, `scope.solids`
      and `inputs.geometry`. Bearing at each bolt is not checked (the snapshot holds no per-bolt position).

      Single-object rules (0.4.0): a check profile of schema `aware.model-check-profile/v2` (v1 stays
      accepted and produces the v1 document, byte for byte) adds rule `parameters`, the targets `property` and
      `relationship`, a profile `scope` (`changed` or `all`) and four predicates: `property-missing`,
      `property-not-in`, `property-out-of-range` and `relationship-missing`. A property is found by its
      CANONICAL key, the key after the comparison profile's `keyRules`, formed by the code `compare-snapshots`
      uses. Not evaluated is not passed: a rule is judged for an object only when the side's read coverage
      (`coverage-base-path` / `coverage-revised-path`, `aware.model-read-coverage/v1`) affirmatively covers what
      it reads; otherwise the object is counted `notEvaluated` with a reason (`coverage-not-supplied`,
      `source-did-not-read`, `value-missing`, `value-not-numeric`, `unit-mismatch`, `key-ambiguous`,
      `identity-unusable`, `relationship-endpoint-unusable`), never a finding and never a pass. The revised
      state decides finding, passed or not evaluated; the earlier state only decides presence, and a finding the
      earlier state could not judge has presence `unknown`, never `introduced`. A v2 profile gets
      `aware.model-change-findings/v2`, which adds `evaluator`, `coverageSha256`, per-rule `notEvaluated` and
      `coverage`, and `summary.unknown`. `--validate-only` validates a check profile and prints the evaluator
      echo without reading any snapshot.

      Objects that were not added, changed or named are not checked (unless a v2 profile says `scope: all` for its
      single-object rules), and `unchecked` says so. Counts are
      complete; lists are capped in a pinned order and the cap is stated. Output is canonical JSON,
      byte-identical for the same inputs. Read-only.

      Single mode (0.5.0): `mode: "single"` checks ONE saved state against a v2 check profile with scope `all`
      and reports every present violation (`presence: "present"`), with no earlier state, no diff and no
      introduced / pre-existing claim. It takes `revised-dir`, `profile-path`, `check-profile-path` and an optional
      `coverage-revised-path`; `base-dir`, `coverage-base-path`, `focus-path`, either geometry directory, a v1
      profile and a profile whose scope is not `all` are refused (exit non-zero, message on stderr, nothing on
      stdout). The output is `aware.model-change-findings/v2` with a top-level `mode: "single"`.

      Clash on one state (0.6.0): in single mode a clash rule runs on the later state's solids, given
      `revised-geometry-dir` (required then; `base-geometry-dir` is refused). An optional `focus-path` holding
      exactly `{ identities }` narrows clash to pairs that involve those objects, their dependency closure (bolt and
      weld anchors) or anything touching them, and `scope.focus` reports `{ requested, effective, unknown }`; an
      unknown identity, or one with no solid, is listed and counted in `scope.solids.noGeometry` (reason
      `not-in-snapshot` when it is not in the snapshot), never dropped. In both modes: `geometry.minOverlap` (>0,
      >= contactTolerance, default contactTolerance) is a report threshold only - an overlap no thicker than it is
      measured, counted in `scope.byRule.<overlap rule>.belowThreshold { count, maxThicknessMm }` (only when
      minOverlap is given) and not listed, and never becomes a contact finding; `appliesTo.pairs` on a
      `clash-overlap` / `clash-contact` rule lists the unordered type pairs it checks (applied before any budget;
      the rest are counted per rule as `pair-excluded`); the broad phase keeps the first `budgets.pairs` candidate
      pairs in a fixed order with O(budget) memory, and the reasons are distinct: `pair-budget` (beyond the pair
      budget), `triangle-budget` (a solid or pair over its triangle limit, formerly `over-budget`) and list
      truncation (`complete: false`). A v2 document echoes the geometry it measured with in `evaluator.geometry`.
    inputs:
      mode:
        type: string
        required: false
        description: '"pair" (the default: compare two states, every earlier input and output unchanged) or "single" (check one state; see Single mode above).'
      base-dir:
        type: string
        required: false
        description: Directory holding the earlier state's entities.json, properties.json and relationships.json. Required unless validate-only is true or mode is single (where it is refused).
      revised-dir:
        type: string
        required: false
        description: Directory holding the later state's entities.json, properties.json and relationships.json. Required unless validate-only is true.
      profile-path:
        type: string
        required: false
        description: Path to the comparison profile JSON (aware.model-compare-profile/v1), the same file compare-snapshots takes. Unknown or missing keys are rejected. Required unless validate-only is true (then optional; when given, a check rule that reads its identity property is rejected).
      check-profile-path:
        type: string
        required: true
        description: Path to the check profile JSON (aware.model-check-profile/v1 or /v2). Unknown or missing keys, predicates and targets are rejected.
      base-geometry-dir:
        type: string
        required: false
        description: Directory with geometry.json {tiles:[{ordinal,file,sha256}]} and the GLB tiles of the earlier state. Required with revised-geometry-dir when the check profile has a clash rule; ignored otherwise.
      revised-geometry-dir:
        type: string
        required: false
        description: The same for the later state. In single mode, required when the check profile has a clash rule and refused otherwise.
      focus-path:
        type: string
        required: false
        description: "Optional path to a focus JSON, {identities: [string]} and, with clash rules, optional sets: [[a, b], ...] (identity pairs to re-check): namespaced identities as compare-snapshots emits them, to re-check even if unchanged. Duplicates are rejected. In single mode only with a clash rule, and only as {identities} (no sets): it narrows clash to those objects and their closure."
      coverage-base-path:
        type: string
        required: false
        description: "Optional path to the earlier state's read-coverage document (aware.model-read-coverage/v1): { schema, entities: { <entityId>: { properties: [exact canonical key | '<prefix>:*'] } }, relationships: { complete: [kind] } }. Read only by a v2 check profile; its sha256 is echoed as coverageSha256.base. Without it every property or relationship rule is not evaluated on that side (coverage-not-supplied)."
      coverage-revised-path:
        type: string
        required: false
        description: The same for the later state (coverageSha256.revised).
      validate-only:
        type: boolean
        required: false
        description: "When true, validate check-profile-path (and, when given, profile-path) and print an aware.model-check-validation/v1 document with the evaluator echo, without reading any snapshot, coverage or geometry."
    outputs:
      type: single
      schema:
        schema: string          # "aware.model-change-findings/v1", or "aware.model-change-findings/v2" for a v2 check profile
        mode: string            # single mode only: "single" (absent in pair mode); then inputs.base and coverageSha256.base are null, every finding has presence "present", summary is { findings, present, byRule }
        inputs: object          # sha256 of each of the six documents' bytes, profileDigest, checkProfileDigest, focusDigest (null without a focus), geometry (clash only: tile digests)
        checkProfile: object    # { id, version } echoed
        scope: object           # { added, changed, focus, evaluated, notApplicable, excluded, byRule: { <ruleId>: { evaluated, findings, notApplicable } } }
        findings: array         # { ruleId, ruleVersion, severity, correspondenceKey, participants, locus, evidence, evidenceFingerprint, presence, baseEvidenceFingerprint }, by (ruleId, correspondenceKey)
        resolvedInChange: array # base findings gone from an object the rule still applies to: { ruleId, ruleVersion, correspondenceKey, participants, locus, evidence, evidenceFingerprint }
        focusResults: array     # { identity, ruleId, state }, by (identity, ruleId)
        summary: object         # { findings, introduced, preExisting, resolvedInChange, byRule }
        truncated: object       # null, or { omitted: { findings, resolvedInChange, focusResults[, focusSets] } }
        focusSets: array        # only when a clash rule ran: { identities: [a, b], ruleId, state, reason? } per requested pair and clash rule
        complete: boolean       # true when nothing was omitted
        unchecked: array        # plain statements of what was not checked
        evaluator: object       # v2 only: { agent, version, profileSha256, geometry? } - geometry (when a clash rule ran) = { contactTolerance, minOverlap, weldTolerance, budgets, pairs: { <overlap/contact ruleId>: [[typeA, typeB], ...] | null } }
        coverageSha256: object  # v2 only: { base, revised } sha256 of each coverage file's bytes, or null
