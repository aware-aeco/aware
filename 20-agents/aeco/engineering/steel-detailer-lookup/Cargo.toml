[workspace]
members = ["."]

[package]
name = "steel-detailer-lookup"
version = "0.1.0"
edition = "2021"
description = "Deterministic clause-lookup CLI for steel-detailer-us, steel-detailer-uk and steel-detailer-eu AWARE agents"

[[bin]]
name = "aware-steel-detailer-us"
path = "src/main.rs"

[[bin]]
name = "aware-steel-detailer-uk"
path = "src/main.rs"

[[bin]]
name = "aware-steel-detailer-eu"
path = "src/main.rs"

[dependencies]
serde_json = "1"
