      reader-schema-version:
        type: string
        required: false
        description: Exact AWARE reader contract. Managed-cloud protocol v2 requires model-reference-reader/v2; callers written for reader 0.6.0 must supply this value and a durable conversion attempt ID. Local protocol v1 defaults to model-reference-reader/v1.
      property-expansion-limits:
        type: object
        required: false
        description: Optional lower ceilings for expanded property rows and canonical property bytes under reader v2.
      expected-signer-sha256:
        type: string
        required: false
        description: Out-of-band signing-key pin; required by legacy reads and optional for v3.
      provider-format:
        type: string
        required: false
        description: Opaque format ID selecting the enrolled protocol-v3 path instead of the legacy RVT path.
      provider-capability:
        type: string
        required: false
        description: Exact read-only capability ID declared by the selected package.
      provider-package-sha256:
        type: string
        required: false
        description: Exact selected package-manifest SHA-256.
      provider-authorization:
        type: string
