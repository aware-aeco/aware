agent: model-reference-reader
version: 0.6.0
display-name: Authenticated Model Reference Reader
description: |
  Convert a local Revit project into deterministic, authenticated reference-model artifacts without
  importing ownership into AWARE. The reader returns canonical Z-up millimetre GLB geometry plus
  separate entity, property and relationship JSON. Revit meaning comes only from explicit provider
  metadata and appearance joins; names and geometry are never used to infer it.

  Protocol v1 remains local-only. Protocol v2 permits an operator-installed managed-cloud adapter only
  when the caller pins both its complete fingerprint and exact HTTPS destination. AWARE contains no
  provider, license, cloud credential or vendor HTTP client. First probe may perform the full conversion;
  later reads use a signed content-addressed cache after revalidating every receipt and byte.

  Protocol v3 can describe one signed, operator-enrolled provider package and fingerprint an immutable
  captured source set. AWARE verifies the package, staged bytes and operator-admitted dependency policy
  around discovery, then returns a portable effective-source identity. Conversion remains outside this
  version's v3 surface.
stateful: false
vendor: aware-aeco
license: Apache-2.0
homepage: https://github.com/aware-aeco/aware/tree/main/20-agents/aeco/engineering/model-reference-reader
keywords: [aware, revit, rvt, reference, model, glb, deterministic, local]
provenance:
  generated-by: hand-curated
  generator-version: 0.126.0
  refined-by: [pawellisowski]
requires:
  filesystem:
    - read: '*'
skills:
  - provider-and-artifact-contract.md
transport:
  cli:
    binary: aware-connection-reader
commands:
  preflight:
    lifecycle: single
    category: curated
    description: |
      Check that the exact provider, managed AWARE host and model-reader signing key are ready.
      This describes the provider but never opens or converts an RVT file.
    inputs:
      expected-provider-sha256:
        type: string
        required: false
        description: Optional pinned SHA-256 of the complete versioned provider fingerprint.
      expected-provider-protocol:
        type: string
        required: false
        description: Provider protocol to request; defaults to local-only v1. Managed cloud requires v2.
      expected-provider-destination:
        type: string
        required: false
        description: Exact canonical HTTPS origin required for a managed-cloud v2 provider.
      authority-store-path:
        type: string
        required: false
        description: Installer-enrolled absolute authority-store path passed only to a managed-cloud v2 provider.
      provider-format:
        type: string
        required: false
        description: Opaque format ID selecting an enrolled protocol-v3 provider package.
      provider-capability:
        type: string
        required: false
        description: Opaque capability ID declared by the selected provider package.
      provider-package-sha256:
        type: string
        required: false
        description: Exact enrolled package-manifest SHA-256 required for protocol-v3 preflight.
    outputs:
      type: single
      schema:
        ready: boolean
        execution: string
        providerFingerprintSha256: string
        signerFingerprintSha256: string
        signerPublicKeyBase64: string
        providerPackageManifestSha256: string
        package: object
        capability: object
  fingerprint-source:
    lifecycle: single
    category: curated
    description: |
      Capture selected source namespaces and ask the exact enrolled protocol-v3 provider which files
      it consumes. Return AWARE's portable effective-source object only after the package, capture and
      operator-admitted dependency policy all verify.
    inputs:
      provider-format:
        type: string
        required: true
        description: Opaque format ID selecting an enrolled protocol-v3 provider package.
      provider-capability:
        type: string
        required: true
        description: Exact capability ID declared by the selected provider package.
      provider-package-sha256:
        type: string
        required: true
        description: Exact enrolled and selected package-manifest SHA-256.
      provider-authorization:
        type: string
        required: true
        description: Short-lived opaque authorization transported to the private provider.
      source-namespaces:
        type: array
        required: true
        description: Ordered logical namespace IDs and absolute local roots selected by the caller.
      source-capture-limits:
        type: object
        required: false
        description: Optional lower source-capture ceilings; omitted fields use bounded v3 defaults.
      degraded-mode:
        type: string
        required: false
        description: Refuse degraded discovery by default; use allow only after explicit user choice.
      expected-signer-sha256:
        type: string
        required: false
        description: Optional out-of-band pin for the AWARE artifact signing key.
    outputs:
      type: single
      schema:
        effectiveSource: object
        effectiveSourceSha256: string
        dependencyPolicySha256: string
        providerIdentity: object
        signerFingerprintSha256: string
  probe:
    lifecycle: single
    category: curated
    description: |
      Return bounded counts, exact reconciled coverage and canonical geometry bounds for an RVT.
      A cold probe performs the full deterministic conversion; a warm probe validates the signed cache.
    inputs:
      rvt-path:
        type: string
        required: true
        description: Absolute path to the local .rvt source.
      source-sha256:
        type: string
        required: true
        description: Expected SHA-256 of the source bytes, measured before the run.
      expected-provider-sha256:
        type: string
        required: true
        description: Pinned SHA-256 of the complete versioned provider fingerprint.
      expected-provider-protocol:
        type: string
        required: false
        description: Provider protocol to request; defaults to local-only v1. Managed cloud requires v2.
      expected-provider-destination:
        type: string
        required: false
        description: Exact canonical HTTPS origin required for a managed-cloud v2 provider.
      authority-store-path:
        type: string
        required: false
        description: Installer-enrolled absolute authority-store path passed only to a managed-cloud v2 provider.
      expected-signer-sha256:
        type: string
        required: true
        description: Out-of-band pinned SHA-256 of the trusted AWARE-format public key.
    outputs:
      type: single
      schema:
        cache: string
        sourceSha256: string
        canonicalRequestSha256: string
        providerFingerprintSha256: string
        frame: object
        coverage: object
        bounds: object
  read-model:
    lifecycle: single
    category: curated
    description: |
      Publish five deterministic run-owned artifacts: binary GLB geometry, entities, properties,
      relationships and the manifest that records their provenance and exact coverage.
    inputs:
      rvt-path:
        type: string
        required: true
        description: Absolute path to the local .rvt source.
      source-sha256:
        type: string
        required: true
        description: Expected SHA-256 of the source bytes, measured before the run.
      expected-provider-sha256:
        type: string
        required: true
        description: Pinned SHA-256 of the complete versioned provider fingerprint.
      expected-provider-protocol:
        type: string
        required: false
        description: Provider protocol to request; defaults to local-only v1. Managed cloud requires v2.
      expected-provider-destination:
        type: string
        required: false
        description: Exact canonical HTTPS origin required for a managed-cloud v2 provider.
      authority-store-path:
        type: string
        required: false
        description: Installer-enrolled absolute authority-store path passed only to a managed-cloud v2 provider.
      expected-signer-sha256:
        type: string
        required: true
        description: Out-of-band pinned SHA-256 of the trusted AWARE-format public key.
    outputs:
      type: single
      schema:
        sourceSha256: string
        canonicalRequestSha256: string
        providerFingerprint: object
        providerFingerprintSha256: string
        signerFingerprintSha256: string
        frame: object
        coverage: object
        artifacts: object
  read-snapshot:
    lifecycle: single
    category: curated
    description: |
      Publish the unchanged five model artifacts plus a bounded display package, with separate signed
      source and package envelopes derived only after the private cache receipt verifies.
    inputs:
      rvt-path:
        type: string
        required: true
        description: Absolute path to the local .rvt source.
      source-sha256:
        type: string
        required: true
        description: Expected SHA-256 of the source bytes, measured before the run.
      expected-provider-sha256:
        type: string
        required: true
        description: Pinned SHA-256 of the complete versioned provider fingerprint.
      expected-provider-protocol:
        type: string
        required: false
        description: Provider protocol to request; defaults to local-only v1. Managed cloud requires v2.
      expected-provider-destination:
        type: string
        required: false
        description: Exact canonical HTTPS origin required for a managed-cloud v2 provider.
      authority-store-path:
        type: string
        required: false
        description: Installer-enrolled absolute authority-store path passed only to a managed-cloud v2 provider.
      expected-signer-sha256:
        type: string
        required: true
        description: Out-of-band pinned SHA-256 of the trusted AWARE-format public key.
    outputs:
      type: single
      schema:
        sourceSha256: string
        canonicalRequestSha256: string
        providerFingerprint: object
        providerFingerprintSha256: string
        signerFingerprintSha256: string
        frame: object
        coverage: object
        artifacts: object
        sourceArtifactPreimage: object
        sourceArtifactEnvelope: object
        packageArtifacts: object
        packageConfiguration: object
        packagePreimage: object
        packageArtifactEnvelope: object
