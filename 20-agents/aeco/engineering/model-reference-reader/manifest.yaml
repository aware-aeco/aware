agent: model-reference-reader
version: 0.8.0
display-name: Authenticated Model Reference Reader
description: |
  Convert user-owned model data into deterministic, authenticated reference-model artifacts without
  importing ownership into AWARE. The reader returns canonical geometry plus separate entity,
  property and relationship metadata. Format meaning remains inside an enrolled read-only provider;
  AWARE validates only the closed, generic interoperability contract.

  Protocol v1 remains local-only. Protocol v2 permits an operator-installed managed-cloud adapter only
  when the caller pins both its complete fingerprint and exact HTTPS destination. AWARE contains no
  provider, license, cloud credential or vendor HTTP client. First probe may perform the full conversion;
  later reads use a signed content-addressed cache after revalidating every receipt and byte.

  Protocol v3 describes and executes a signed, operator-enrolled provider package against an immutable
  captured source set. Every invocation requires an opaque host-issued authorization envelope that
  AWARE transports but cannot mint or interpret. The result is a signed model-reference-manifest/v2
  root over bounded multi-tile geometry and semantically validated metadata shards.
stateful: false
vendor: aware-aeco
license: Apache-2.0
homepage: https://github.com/aware-aeco/aware/tree/main/20-agents/aeco/engineering/model-reference-reader
keywords: [aware, reference, model, glb, deterministic, local, interoperability]
provenance:
  generated-by: hand-curated
  generator-version: 0.126.0
  refined-by: [pawellisowski]
requires:
  filesystem:
    - read: '*'
skills:
  - provider-and-artifact-contract.md
transport:
  cli:
    binary: aware-connection-reader
commands:
  preflight:
    lifecycle: single
    category: curated
    description: |
      Check that the exact provider, managed AWARE host and model-reader signing key are ready.
      This describes the provider but never opens or converts an RVT file.
    inputs:
      expected-provider-sha256:
        type: string
        required: false
        description: Optional pinned SHA-256 of the complete versioned provider fingerprint.
      expected-provider-protocol:
        type: string
        required: false
        description: Provider protocol to request; defaults to local-only v1. Managed cloud requires v2.
      expected-provider-destination:
        type: string
        required: false
        description: Exact canonical HTTPS origin required for a managed-cloud v2 provider.
      authority-store-path:
        type: string
        required: false
        description: Absolute authority-store path for a managed-cloud v2 provider. The provider must independently require its exact installer-enrolled store before reading credentials.
      reader-schema-version:
        type: string
        required: false
        description: Exact AWARE reader contract. Managed-cloud protocol v2 requires model-reference-reader/v2; v2 raises the signed default source, metadata, canonical GLB JSON, index, component JSON and canonical-work ceilings while remaining caller-lowerable.
      property-expansion-limits:
        type: object
        required: false
        description: Optional lower ceilings for expanded property rows and canonical property bytes under reader v2.
      provider-format:
        type: string
        required: false
        description: Opaque format ID selecting an enrolled protocol-v3 provider package.
      provider-capability:
        type: string
        required: false
        description: Opaque capability ID declared by the selected provider package.
      provider-package-sha256:
        type: string
        required: false
        description: Exact enrolled package-manifest SHA-256 required for protocol-v3 preflight.
      provider-authorization:
        type: string
        required: false
        description: Host-issued opaque authorization required whenever an enrolled provider package is selected; AWARE cannot mint or interpret it.
    outputs:
      type: single
      schema:
        ready: boolean
        execution: string
        providerFingerprintSha256: string
        signerFingerprintSha256: string
        signerPublicKeyBase64: string
        providerPackageManifestSha256: string
        package: object
        capability: object
  fingerprint-source:
    lifecycle: single
    category: curated
    description: |
      Capture selected source namespaces and ask the exact enrolled protocol-v3 provider which files
      it consumes. Return AWARE's portable effective-source object only after the package, capture and
      operator-admitted dependency policy all verify.
    inputs:
      provider-format:
        type: string
        required: true
        description: Opaque format ID selecting an enrolled protocol-v3 provider package.
      provider-capability:
        type: string
        required: true
        description: Exact capability ID declared by the selected provider package.
      provider-package-sha256:
        type: string
        required: true
        description: Exact enrolled and selected package-manifest SHA-256.
      provider-authorization:
        type: string
        required: true
        description: Short-lived opaque authorization transported to the private provider.
      expected-provider-protocol:
        type: string
        required: true
        description: Exact enrolled-provider protocol; protocol-v3 source fingerprinting requires 3.
      reader-schema-version:
        type: string
        required: true
        description: Exact reader contract; protocol-v3 source fingerprinting requires model-reference-reader/v3.
      source-namespaces:
        type: array
        required: true
        description: Ordered logical namespace IDs and absolute local roots selected by the caller.
      source-capture-limits:
        type: object
        required: false
        description: Optional lower source-capture ceilings; omitted fields use bounded v3 defaults.
      degraded-mode:
        type: string
        required: false
        description: Refuse degraded discovery by default; use allow only after explicit user choice.
      expected-signer-sha256:
        type: string
        required: false
        description: Optional out-of-band pin for the AWARE artifact signing key.
    outputs:
      type: single
      schema:
        effectiveSource: object
        effectiveSourceSha256: string
        dependencyPolicySha256: string
        providerIdentity: object
        signerFingerprintSha256: string
  probe:
    lifecycle: single
    category: curated
    description: |
      Return bounded counts and authenticated coverage for a legacy RVT read or an explicitly selected
      protocol-v3 package. Package mode never runs without opaque host authorization.
    inputs:
      rvt-path:
        type: string
        required: false
        description: Absolute path to the local .rvt source; required only for legacy protocols v1/v2.
      source-sha256:
        type: string
        required: false
        description: Expected SHA-256 of the source bytes; required only for legacy protocols v1/v2.
      expected-provider-sha256:
        type: string
        required: false
        description: Pinned provider fingerprint; required only for legacy protocols v1/v2 and forbidden for v3.
      expected-provider-protocol:
        type: string
        required: false
        description: Provider protocol to request; defaults to local-only v1. Managed cloud requires v2.
      expected-provider-destination:
        type: string
        required: false
        description: Exact canonical HTTPS origin required for a managed-cloud v2 provider.
      authority-store-path:
        type: string
        required: false
        description: Absolute authority-store path for a managed-cloud v2 provider. The provider must independently require its exact installer-enrolled store before reading credentials.
      conversion-attempt-id:
        type: string
        required: false
        description: Installer-owned durable UUID attempt identity required for a managed-cloud v2 conversion; callers written for reader 0.6.0 must supply it before upgrading to protocol v2.
      reader-schema-version:
        type: string
        required: false
        description: Exact AWARE reader contract. Managed-cloud protocol v2 requires model-reference-reader/v2; callers written for reader 0.6.0 must supply this value and a durable conversion attempt ID. Local protocol v1 defaults to model-reference-reader/v1.
      property-expansion-limits:
        type: object
        required: false
        description: Optional lower ceilings for expanded property rows and canonical property bytes under reader v2.
      expected-signer-sha256:
        type: string
        required: false
        description: Out-of-band signing-key pin; required by legacy reads and optional for v3.
      provider-format:
        type: string
        required: false
        description: Opaque format ID selecting the enrolled protocol-v3 path instead of the legacy RVT path.
      provider-capability:
        type: string
        required: false
        description: Exact read-only capability ID declared by the selected package.
      provider-package-sha256:
        type: string
        required: false
        description: Exact selected package-manifest SHA-256.
      provider-authorization:
        type: string
        required: false
        description: Host-issued opaque authorization; conditionally required for v3 and never minted by AWARE.
      source-namespaces:
        type: array
        required: false
        description: Ordered user-authorized logical namespace roots for immutable capture.
      source-capture-limits:
        type: object
        required: false
        description: Optional lower source-capture ceilings for v3.
    outputs:
      type: single
      schema:
        cache: string
        sourceSha256: string
        canonicalRequestSha256: string
        providerFingerprintSha256: string
        frame: object
        coverage: object
        bounds: object
  read-model:
    lifecycle: single
    category: curated
    description: |
      Publish the frozen five-artifact legacy response for protocols v1/v2, or an authenticated
      model-reference-manifest/v2 CAS root with multi-tile indexes for explicit protocol v3.
    inputs:
      rvt-path:
