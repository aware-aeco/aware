agent:        google-workspace
version:      1.0.0
sdk-target:   1.0.0
display-name: Google Workspace
description: |
  Submit plain-text or HTML email through Gmail as the authenticated Google
  mailbox. The remaining Drive, Sheets, Calendar, Chat, Forms, Slides, Meet,
  Tasks, and Gmail search commands are declared as planned, not runnable.

stateful: false
status: requires-runtime
minimum-cli-version: 0.136.0

vendor:   google
license:  Apache-2.0
homepage: https://github.com/aware-aeco/aware/tree/main/20-agents/aeco/cross-cutting/google-workspace
keywords: [aware, google, gworkspace, drive, sheets, calendar, gmail, cross-cutting]

provenance:
  generated-by:     aware-agent-builder
  generator-version: 0.1.0
  source:
    type: openapi
    url:  https://www.googleapis.com/discovery/v1/apis/drive/v3/rest
  refined-by:       [pawellisowski]
  generated-at:     2026-04-01T00:00:00Z
  ported-from:      D:/Repos/floless-app/src/FloLess/Core/Skills/Resources/Google/

requires:
  filesystem:
    - write: ~/.aware/outbox/google-workspace
  network:
    - https://gmail.googleapis.com
    - https://openidconnect.googleapis.com
    - https://oauth2.googleapis.com
  secrets:
    - google-workspace      # cross-references ~/.aware/credentials/google-workspace.json

transport:
  rest:
    base: https://gmail.googleapis.com/gmail/v1/

auth:
  scheme: oauth2
  secret: google-workspace

commands:
  # ---- Drive (the original 5) -------------------------------------------

  list-files:
    status: planned
    lifecycle: single
    category: curated
    description: List files in Drive matching an optional query.
    inputs:
      query:
        type: string
        description: Google Drive search query (e.g., `"mimeType='application/pdf'"`).
      page-size:
        type: int
        default: 100
    outputs:
      type: single
      schema:
        files:
          type: array
          items:
            id:        string
            name:      string
            mime-type: string
            size:      number

  download-file:
    status: planned
    lifecycle: single
    category: curated
    description: Download a Drive file's bytes by id.
    inputs:
      file-id: string
    outputs:
      type: single
      schema:
        bytes:    bytes
        filename: string

  upload-file:
    status: planned
    lifecycle: single
    category: curated
    mode: write
    description: Upload bytes to Drive. Uses simple (≤ 5MB) or resumable (large) upload.
    inputs:
      filename:  string
      bytes:     bytes
      parent-folder-id:
        type: string
        description: Optional. If omitted, file lands at My Drive root.
    outputs:
      type: single
      schema:
        file-id: string
        web-url: string

  read-sheet:
    status: planned
    lifecycle: single
    category: curated
    description: Read a range of cells from a Google Sheet.
    inputs:
      spreadsheet-id: string
      range:
        type: string
        description: A1 notation (e.g., `"Sheet1!A1:D100"`).
    outputs:
      type: single
      schema:
        values:
          type: array
          items: array

  write-sheet:
    status: planned
    lifecycle: single
    category: curated
    mode: write
    description: Write values to a range in a Google Sheet.
    inputs:
      spreadsheet-id: string
      range:          string
      values:
        type: array
        items: array
    outputs:
      type: single
      schema:
        updated-cells: int

  # ---- Gmail ------------------------------------------------------------

  gmail.send:
    lifecycle: single
    category: curated
    mode: write
    rollback: unsupported
    method: POST
    path: users/me/messages/send
    description: |
      Irreversibly submit one plain-text or HTML email through Gmail as the
      authenticated mailbox. Requires a caller-stable attempt-id and never
      automatically retries an outcome that could already have been accepted.
    inputs:
      to:
        type: array
        items: string
        required: true
      cc:
        type: array
        items: string
        required: false
      bcc:
        type: array
        items: string
        required: false
      subject:
        type: string
        required: true
      body:
        type: string
        required: true
      content-type:
        type: enum
        values: [text, html]
        default: text
        required: false
      attempt-id:
        type: string
        required: true
        description: |
          Stable identifier for this logical send. Reuse with different inputs
          is rejected; an identical accepted replay returns the cached result.
    outputs:
      type: single
      schema:
        status:
          type: enum
          values: [accepted]
        message-id:
          type: string
          description: Gmail Message resource id; identical to gmail-message-id.
        gmail-message-id:
          type: string
          description: Gmail Message resource id returned by users.messages.send.
        thread-id:
          type: string
          description: Gmail thread resource id returned by users.messages.send.
        rfc-message-id:
          type: string
          description: RFC 5322 Message-ID header generated before dispatch.
        attempt-id:
          type: string
          description: The caller-stable attempt-id supplied in the request.

  gmail.search:
    status: planned
    lifecycle: single
    category: curated
    description: |
      Search the user's mailbox using Gmail's `q` search syntax.
      Examples: `from:client@acme.com newer_than:7d`, `subject:RFI`.
      Read-only.
    inputs:
      query:
        type: string
      max-results:
        type: number
        default: 25
    outputs:
      type: single
      schema:
        messages:
          type: array
          items:
            id:          string
            thread-id:   string
            subject:     string
            from:        string
            received-at: string

  # ---- Calendar ---------------------------------------------------------

  calendar.create-event:
    status: planned
    lifecycle: single
    category: curated
    mode: write
    description: |
      Create a Google Calendar event with attendees + optional Meet link.
      Time zone is explicit (IANA name) to avoid client-locale ambiguity.
    inputs:
      calendar-id:
        type: string
        default: primary
      summary:     string
      description: string
      start:
        type: string
        description: ISO 8601 with offset, e.g. `2026-05-20T14:00:00+01:00`.
      end:
        type: string
      time-zone:
        type: string
        description: IANA name (e.g. `Europe/London`).
      attendees:
        type: array
        items: string
      location:
        type: string
      add-meet-link:
        type: boolean
        default: false
    outputs:
      type: single
      schema:
        event-id: string
        web-url:  string

  calendar.find-availability:
    status: planned
    lifecycle: single
    category: curated
    description: |
      Find free time across attendees within a window using freebusy.
      Read-only. The "schedule next coordination meeting" primitive.
    inputs:
      attendees:
        type: array
        items: string
      window-start:
        type: string
      window-end:
        type: string
      duration-minutes:
        type: number
        default: 30
    outputs:
      type: single
      schema:
        suggestions:
          type: array
          items:
            start: string
            end:   string

  # ---- Google Chat ------------------------------------------------------

  chat.post-message:
    status: planned
    lifecycle: single
    category: curated
    mode: write
    description: |
      Post a message to a Google Chat space (room / DM). Plain text
      or Card v2 format.
    inputs:
      space-id:
        type: string
      text:
        type: string
      card:
        type: object
        description: |
          Optional Card v2 JSON. If provided, `text` becomes a fallback.
    outputs:
      type: single
      schema:
        message-name: string
        web-url:      string

  chat.post-with-screenshot:
    status: planned
    lifecycle: single
    category: curated
    mode: write
    description: |
      Post a message with an attached image. Image is uploaded first then
      referenced by URL.
    inputs:
      space-id:        string
      text:            string
      screenshot-path: string
    outputs:
      type: single
      schema:
        message-name: string
        web-url:      string

  chat.post-with-card:
    status: planned
    lifecycle: single
    category: curated
    mode: write
    description: |
      Post a Card v2 message to a Google Chat space — the rich-data
      equivalent of `microsoft-365.teams.channel.post-with-card`. Cards
      render rows as a key-value list with optional action buttons.
    inputs:
      space-id:
        type: string
      title:
        type: string
      rows:
        type: array
        description: |
          Each row is `{ label, value }`. Renders as a Card v2 KeyValue
          widget. For richer layouts, pass raw `card` JSON instead.
      card:
        type: object
        description: |
          Optional Card v2 JSON. If provided, `rows` is ignored.
    outputs:
      type: single
      schema:
        message-name: string
        web-url:      string

  # ---- Google Forms -----------------------------------------------------

  forms.list:
    status: planned
    lifecycle: single
    category: curated
    description: |
      List Google Forms the user has access to. Read-only. Used as the
      "what intake forms are live" verb — RFI intake, site-survey
      forms, snagging-checklist forms.
    inputs:
      query:
        type: string
        description: Optional Drive search filter (e.g. `name contains 'RFI'`).
    outputs:
      type: single
      schema:
        forms:
          type: array
          items:
            form-id:    string
            title:      string
            web-url:    string

  forms.responses.list:
    status: planned
    lifecycle: single
    category: curated
    description: |
      Pull responses from a Google Form. The "what did people submit
      since last Friday" verb — pairs with the BIM-manager Monday
      audit flow. Read-only.
    inputs:
      form-id:
        type: string
      since:
        type: string
        description: Optional ISO 8601 cutoff.
    outputs:
      type: single
      schema:
        responses:
          type: array
          items:
            response-id: string
            submitted-at: string
            respondent:  string
            answers:     object

  # ---- Google Slides ----------------------------------------------------

  slides.export-pdf:
    status: planned
    lifecycle: single
    category: curated
    description: |
      Export a Google Slides deck as PDF. The designer / architect
      "client-deck issue" verb — pair with `drive.share` to ship the
      PDF straight to the client folder. Read-only against the deck;
      writes a new PDF.
    inputs:
      presentation-id:
        type: string
      output-path:
        type: string
    outputs:
      type: single
      schema:
        path:        string
        page-count:  number
        size-bytes:  number

  slides.replace-text:
    status: planned
    lifecycle: single
    category: curated
    mode: write
    description: |
      Bulk-replace `{{ token }}` placeholders in a Slides deck with
      values from a context object. The "project-prefix template
      filler" verb — sub `{{ project-name }}`, `{{ run-date }}` etc
      before export.
    inputs:
      presentation-id:
        type: string
      replacements:
        type: object
        description: Map of `{{ token }}` → replacement string.
    outputs:
      type: single
      schema:
        replaced-count: number

  # ---- Google Meet ------------------------------------------------------

  meet.create:
    status: planned
    lifecycle: single
    category: curated
    mode: write
    description: |
      Create a standalone Google Meet link (not tied to a calendar
      event). Used by ad-hoc coordination flows — "we need a quick
      walk-through call; here's the link."
    inputs:
      title:
        type: string
        description: Optional meeting title (defaults to "AWARE meeting").
    outputs:
      type: single
      schema:
        meet-id:   string
        meet-url:  string

  # ---- Tasks ------------------------------------------------------------

  tasks.create:
    status: planned
    lifecycle: single
    category: curated
    mode: write
    description: Create a Google Task. Optional notes + due-date.
    inputs:
      tasklist-id:
        type: string
        default: '@default'
      title:
        type: string
      notes:
        type: string
      due-date:
        type: string
        description: ISO 8601 (date-only, time ignored by Tasks API).
    outputs:
      type: single
      schema:
        task-id: string

  tasks.list:
    status: planned
    lifecycle: single
    category: curated
    description: List tasks in a Tasklist. Optional show-completed.
    inputs:
      tasklist-id:
        type: string
        default: '@default'
      show-completed:
        type: boolean
        default: false
    outputs:
      type: single
      schema:
        tasks:
          type: array
          items:
            task-id:  string
            title:    string
            status:   string
            due:      string
            notes:    string

  tasks.complete:
    status: planned
    lifecycle: single
    category: curated
    mode: write
    description: Mark a Google Task complete.
    inputs:
      task-id: string
      tasklist-id:
        type: string
        default: '@default'
    outputs:
      type: single
      schema:
        task-id: string

  # ---- Sheets (extended ops) --------------------------------------------

  sheets.worksheet.list:
    status: planned
    lifecycle: single
    category: curated
    description: List worksheet names + IDs in a spreadsheet. Read-only.
    inputs:
      spreadsheet-id: string
    outputs:
      type: single
      schema:
        worksheets:
          type: array
          items:
            name:  string
            id:    number

  sheets.row.append:
    status: planned
    lifecycle: single
    category: curated
    mode: write
    description: |
      Append a single row to the bottom of a sheet (vs. write-sheet which
      replaces existing cells). The "log every QA run / RFI" primitive.
    inputs:
      spreadsheet-id: string
      worksheet:      string
      values:
        type: array
        description: Single row of values matching column order.
    outputs:
      type: single
      schema:
        row-index: number

  # ---- Drive — folder ops + sharing -------------------------------------

  drive.folder.create:
    status: planned
    lifecycle: single
    category: curated
    mode: write
    description: |
      Create a Drive folder. Optional parent (defaults to root).
      Useful for "create a new project folder structure" workflows.
    inputs:
      name: string
      parent-folder-id:
        type: string
        description: Optional.
    outputs:
      type: single
      schema:
        folder-id: string
        web-url:   string

  drive.share:
    status: planned
    lifecycle: single
    category: curated
    mode: write
    description: |
      Share a Drive file / folder with one or more users. Sets the
      permission role (reader / writer / commenter). Default `send-email`
      is `false` to avoid spamming consultants.
    inputs:
      file-id:    string
      emails:
        type: array
        items: string
      role:
        type: enum
        values: [reader, writer, commenter]
        default: reader
      send-email:
        type: boolean
        default: false
    outputs:
      type: single
      schema:
        permissions:
          type: array
          items:
            email: string
            role:  string

skills:
  - auth.md
  - api-snippets.md
  - drive.md
  - sheets.md
