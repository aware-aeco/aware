agent:        microsoft-365
version:      0.7.0
sdk-target:   1.0.0
display-name: Microsoft 365 (Graph API)
description: |
  Read and write across the Microsoft 365 surface — OneDrive, SharePoint,
  Outlook, Teams, Calendar — via the Microsoft Graph REST API. Auto-generated
  from the public Graph OpenAPI spec + refined to capture auth, throttling,
  and sharing-URL conventions the spec alone doesn't encode.

  Runnable today, each a read-only, code-owned Graph read (#667, #709):
  `list-folder` and `get-drive-item` (OneDrive / SharePoint file metadata),
  `outlook.mail.search`, `planner.plan.list` and `planner.task.list`,
  `sharepoint.list.list` and `sharepoint.list.read`, and the Teams reads
  `teams.team.list`, `teams.channel.list`, `teams.channel.list-messages`,
  `teams.chat.list` and `teams.chat.list-messages`, the Excel reads
  `excel.worksheet.list` and `excel.range.read`, and `get-shared-item`
  (open a file by its sharing link). Every other command is
  declared as planned, not runnable. Each command lists the delegated
  Microsoft permissions to request under `permissions:`.

  Cross-cutting in AECO (used by architecture, engineering, construction,
  and operations alike — file sharing, RFI emails, drawing index sheets in
  SharePoint, Teams channels for project comms).

stateful: false
# The code-owned Graph reads ship in AWARE 0.166.0 (list-folder), 0.167.0
# (mail, Planner, SharePoint), 0.168.0 (Teams), 0.169.0 (Excel reads,
# sharing links) and 0.175.0 (Outlook folders, a folder's changes, one
# message); an older CLI would render them through the generic REST path
# (no $select, scope check, input grammar, bounds or projection), so it is
# refused there.
status: requires-runtime
minimum-cli-version: 0.175.0

vendor:   microsoft
license:  Apache-2.0
homepage: https://github.com/aware-aeco/aware/tree/main/20-agents/aeco/cross-cutting/microsoft-365
keywords: [aware, m365, microsoft-365, graph, sharepoint, onedrive, teams, outlook, cross-cutting]

provenance:
  generated-by:     aware-agent-builder
  generator-version: 0.1.0
  source:
    type: openapi
    url:  https://github.com/microsoftgraph/msgraph-metadata/blob/master/openapi/v1.0/openapi.yaml
  refined-by:       [pawellisowski]
  generated-at:     2026-04-01T00:00:00Z
  ported-from:      D:/Repos/floless-app/src/FloLess/Core/Skills/Resources/M365/

requires:
  network:
    - https://graph.microsoft.com
    - https://login.microsoftonline.com
  secrets:
    - microsoft-365       # cross-references ~/.aware/credentials/microsoft-365.json

auth:
  scheme: oauth2
  secret: microsoft-365

transport:
  # REST only: the `aware-m365` executable the 0.2.0 manifest named was never
  # shipped. Reviewed reads run in-process (`runtime/agent_call.rs`).
  rest:
    base: https://graph.microsoft.com/v1.0/

commands:
  # ---- Drive / SharePoint Files (the original 4) ------------------------

  get-drive-item:
    lifecycle: single
    category: curated
    permissions:
      scopes: [User.Read, Files.Read.All]
      admin-consent: false
    mode: read
    method: GET
    # Absolute: the request itself — route, input grammar, query, scopes,
    # bounds and projection — is code-owned in AWARE (`runtime/agent_call.rs`,
    # #709); this declaration only makes the command available.
    path: https://graph.microsoft.com/v1.0/drives/{drive-id}/items/{item-id}
    description: |
      Read one OneDrive / SharePoint file or folder's metadata by id — name,
      size, folder or file, MIME type, modified time and its web link. Never a
      download URL and never the content. `drive-id: me` is the signed-in
      person's own OneDrive. Needs `User.Read` and `Files.Read.All`.
    inputs:
      drive-id:
        type: string
        in: path
        required: true
        description: Graph drive id, or `me` for the signed-in person's own OneDrive.
      item-id:
        type: string
        in: path
        required: true
        description: Graph item id, or `root`.
    outputs:
      type: single
      schema:
        id:            string
        drive-id:      string
        name:          string
        size:          number
        is-folder:     bool
        mime-type:     string
        modified-time: string
        web-url:       string
        truncated:     array

  get-shared-item:
    lifecycle: single
    category: curated
    permissions:
      scopes: [User.Read, Files.ReadWrite]
      admin-consent: false
    mode: read
    method: GET
    # Absolute: the request itself — route, input grammar, query, scopes,
    # bounds and projection — is code-owned in AWARE (`runtime/agent_call.rs`,
    # #709); this declaration only makes the command available.
    path: https://graph.microsoft.com/v1.0/shares/{sharing-url}/driveItem
    description: |
      Open a OneDrive / SharePoint file or folder by the sharing link someone
      sent you — returns the same metadata as `get-drive-item`, including the
      `id` and `drive-id` that `excel.range.read` takes. Only resolves a link
      you can already open: AWARE never asks Microsoft to add you to the item.
      Work or school links only (`*.sharepoint.com`). Microsoft documents only
      a write-class permission here, so it needs `User.Read` and
      `Files.ReadWrite`; AWARE sends nothing but a `GET`.
    inputs:
      sharing-url:
        type: string
        in: path
        required: true
        description: The https sharing link, as copied from OneDrive or SharePoint.
    outputs:
      type: single
      schema:
        id:            string
        drive-id:      string
        name:          string
        size:          number
        is-folder:     bool
        mime-type:     string
        modified-time: string
        web-url:       string
        truncated:     array

  download-file:
    lifecycle: single
    category: curated
    permissions:
      scopes: [User.Read, Files.Read.All]
      admin-consent: false
    status: planned
    description: Download a OneDrive / SharePoint file's bytes.
    inputs:
      drive-id: string
      item-id:  string
    outputs:
      type: single
      schema:
        bytes:    bytes
        filename: string
        size-kb:  number

  upload-file:
    lifecycle: single
    category: curated
    permissions:
      scopes: [User.Read, Files.ReadWrite.All]
      admin-consent: false
    status: planned
    mode: write
    description: Upload bytes as a new file. Uses simple (≤ 4MB) or resumable (large file) upload depending on size.
    inputs:
      drive-id:  string
      folder-id: string
      filename:  string
      bytes:     bytes
    outputs:
      type: single
      schema:
        item-id: string
        web-url: string

  list-folder:
    lifecycle: single
    category: curated
    permissions:
      scopes: [User.Read, Files.Read.All]
      admin-consent: false
    mode: read
    method: GET
    # Absolute: the request itself — route, path-id grammar, $select, scopes,
    # bounds and projection — is code-owned in AWARE (`runtime/agent_call.rs`,
    # #667); this declaration only makes the command available.
    path: https://graph.microsoft.com/v1.0/drives/{drive-id}/items/{folder-id}/children
    description: |
      List one page of a OneDrive / SharePoint folder's children — id, drive id,
      name, size, folder or file, MIME type and modified time. Read-only: never
      a content download. `drive-id: me` lists the signed-in person's own
      OneDrive; `folder-id: root` is a drive's root folder. Needs the Microsoft
      account connected with `User.Read` and `Files.Read.All`
      (`aware connect microsoft-365 --oauth --scopes User.Read,Files.Read.All`).
    inputs:
      drive-id:
        type: string
        in: path
        required: true
        description: Graph drive id, or `me` for the signed-in person's own OneDrive.
      folder-id:
        type: string
        in: path
        required: true
        description: Graph item id of the folder, or `root`.
      page-size:
        type: int
        default: 100
        description: Children to return, 1 to 200.
    outputs:
      type: single
      schema:
        items:
          type: array
          items:
            id:            string
            drive-id:      string
            name:          string
            size:          number
            is-folder:     bool
            mime-type:     string
            modified-time: string
        more-available: bool
        omitted:        number

  # ---- Teams ------------------------------------------------------------

  teams.chat.post-message:
    lifecycle: single
    category: curated
    permissions:
      scopes: [User.Read, ChatMessage.Send]
      admin-consent: false
    status: planned
    mode: write
    description: |
      Post a message to a 1:1 or group chat. Returns the messageId for
      reply threading. Throttling: Microsoft Graph caps a chat-message
      POST at ~1 request/sec per user for a given chat; the transport
      honors Retry-After on 429.
    inputs:
      chat-id:
        type: string
        description: Chat id or `me` to use the user's default 1:1.
      text:
        type: string
        description: Plain text or HTML (set content-type accordingly).
      content-type:
        type: enum
        values: [text, html]
        default: text
    outputs:
      type: single
      schema:
        message-id: string
        web-url:    string

  teams.channel.post-message:
    lifecycle: single
    category: curated
    permissions:
      scopes: [User.Read, ChannelMessage.Send]
      admin-consent: false
    status: planned
    mode: write
    description: |
      Post a plain message to a Teams channel. The bread-and-butter
      "Monday standup digest" command. Honors team + channel display
      names (auto-resolves to IDs).
    inputs:
      team-id:
        type: string
        description: Team id OR team display name.
      channel-id:
        type: string
        description: Channel id OR channel display name.
      text:
        type: string
      content-type:
        type: enum
        values: [text, html]
        default: text
    outputs:
      type: single
      schema:
        message-id: string
        web-url:    string

  teams.channel.post-with-card:
    lifecycle: single
    category: curated
    permissions:
      scopes: [User.Read, ChannelMessage.Send]
      admin-consent: false
    status: planned
    mode: write
    description: |
      Post an Adaptive Card to a Teams channel. Cards render rich data
      tables, action buttons, status indicators. The right primitive for
      the BIM-manager Monday-model-audit rollup, RFI digests, sheet-
      status reports.
    inputs:
      team-id:    string
      channel-id: string
      title:      string
      rows:
        type: array
        description: |
          Rows are objects with arbitrary fields; the transport renders
          them as a TextBlock + FactSet card. For richer layouts, pass
          a literal AdaptiveCard JSON in `card` instead.
      card:
        type: object
        description: |
          Optional raw AdaptiveCard JSON. If provided, `rows` is ignored.
    outputs:
      type: single
      schema:
        message-id: string
        web-url:    string

  teams.channel.post-with-screenshot:
    lifecycle: single
    category: curated
    permissions:
      scopes: [User.Read, ChannelMessage.Send]
      admin-consent: false
    status: planned
    mode: write
    description: |
      Post a message to a Teams channel with an attached image. The
      designer-Monday-shot + architect-RFI-with-screenshot primitive.
      Image must be ≤ 4 MB (Graph limit).
    inputs:
      team-id:         string
      channel-id:      string
      text:            string
      screenshot-path: string
    outputs:
      type: single
      schema:
        message-id: string
        web-url:    string

  # ---- Teams reads -----------------------------------------------------

  teams.team.list:
    lifecycle: single
    category: curated
    permissions:
      scopes: [User.Read, Team.ReadBasic.All]
      admin-consent: false
    mode: read
    method: GET
    # Absolute: the request itself — route, input grammar, query, scopes,
    # bounds and projection — is code-owned in AWARE (`runtime/agent_call.rs`,
    # #709); this declaration only makes the command available.
    path: https://graph.microsoft.com/v1.0/me/joinedTeams
    description: |
      List the Teams teams the signed-in person belongs to — id, name,
      description. Work or school accounts only. Needs `User.Read` and
      `Team.ReadBasic.All`.
    inputs:
      page-size:
        type: int
        default: 100
        description: Teams to return, 1 to 200.
    outputs:
      type: single
      schema:
        teams:
          type: array
          items:
            id:          string
            name:        string
            description: string
            web-url:     string
            truncated:   array
        more-available: bool
        omitted:        number

  teams.channel.list:
    lifecycle: single
    category: curated
    permissions:
      scopes: [User.Read, Channel.ReadBasic.All]
      admin-consent: false
    mode: read
    method: GET
    # Absolute: the request itself — route, input grammar, query, scopes,
    # bounds and projection — is code-owned in AWARE (`runtime/agent_call.rs`,
    # #709); this declaration only makes the command available.
    path: https://graph.microsoft.com/v1.0/teams/{team-id}/channels
    description: |
      List the channels of one team — id, name, description, whether it is
      standard, private or shared. Work or school accounts only. Needs
      `User.Read` and `Channel.ReadBasic.All`.
    inputs:
      team-id:
        type: string
        in: path
        required: true
        description: The team's id (a GUID), from `teams.team.list`.
      page-size:
        type: int
        default: 100
        description: Channels to return, 1 to 200.
    outputs:
      type: single
      schema:
        channels:
          type: array
          items:
            id:              string
            name:            string
            description:     string
            membership-type: string
            web-url:         string
            created-at:      string
            truncated:       array
        more-available: bool
        omitted:        number

  teams.channel.list-messages:
    lifecycle: single
    category: curated
    permissions:
      scopes: [User.Read, ChannelMessage.Read.All]
      admin-consent: true
    mode: read
    method: GET
    # Absolute: the request itself — route, input grammar, query, scopes,
    # bounds and projection — is code-owned in AWARE (`runtime/agent_call.rs`,
    # #709); this declaration only makes the command available.
    path: https://graph.microsoft.com/v1.0/teams/{team-id}/channels/{channel-id}/messages
    description: |
      Read the recent threads of one Teams channel — each message as plain
      text with its sender, times, attachment references (never their
      content) and up to 50 replies — keeping threads with activity after
      `since`. One page: `more-available` says when there is more. Work or
      school accounts only. Needs `User.Read` and `ChannelMessage.Read.All`,
      which needs a tenant administrator's consent.
    inputs:
      team-id:
        type: string
        in: path
        required: true
        description: The team's id (a GUID), from `teams.team.list`.
      channel-id:
        type: string
        in: path
        required: true
        description: The channel's id (`19:…@thread.tacv2`), from `teams.channel.list`.
      since:
        type: string
        required: true
        description: Keep threads with activity strictly after this UTC time, `YYYY-MM-DDTHH:MM:SSZ`.
      page-size:
        type: int
        default: 20
        description: Threads to ask for, 1 to 50.
    outputs:
      type: single
      schema:
        messages:
          type: array
          items:
            id:                  string
            created-at:          string
            last-modified-at:    string
            message-type:        string
            sender:              object
            sender-withheld:     bool
            text:                string
            deleted:             bool
            attachments:         array
            attachments-omitted: number
            truncated:           array
            replies:                array
            replies-omitted:        number
            replies-more-available: bool
            activity-unknown:       bool
        more-available:        bool
        omitted:               number
        filtered-before-since: number

  teams.chat.list:
    lifecycle: single
    category: curated
    permissions:
      scopes: [User.Read, Chat.ReadBasic]
      admin-consent: false
    mode: read
    method: GET
    # Absolute: the request itself — route, input grammar, query, scopes,
    # bounds and projection — is code-owned in AWARE (`runtime/agent_call.rs`,
    # #709); this declaration only makes the command available.
    path: https://graph.microsoft.com/v1.0/me/chats
    description: |
      List the signed-in person's Teams chats, most recent message first —
      id, topic, kind (one-on-one, group, meeting) and times. Members are not
      listed. Work or school accounts only. Needs `User.Read` and
      `Chat.ReadBasic`.
    inputs:
      page-size:
        type: int
        default: 25
        description: Chats to return, 1 to 50.
    outputs:
      type: single
      schema:
        chats:
          type: array
          items:
            id:              string
            topic:           string
            chat-type:       string
            created-at:      string
            last-updated-at: string
            web-url:         string
            truncated:       array
        more-available: bool
        omitted:        number

  teams.chat.list-messages:
    lifecycle: single
    category: curated
    permissions:
      scopes: [User.Read, Chat.Read]
      admin-consent: false
    mode: read
    method: GET
    # Absolute: the request itself — route, input grammar, query, scopes,
    # bounds and projection — is code-owned in AWARE (`runtime/agent_call.rs`,
    # #709); this declaration only makes the command available.
    path: https://graph.microsoft.com/v1.0/chats/{chat-id}/messages
    description: |
      Read the messages of one Teams chat changed after `since`, newest
      first — each as plain text with its sender, times and attachment
      references (never their content). One page: `more-available` says when
      there is more. Work or school accounts only. Needs `User.Read` and
      `Chat.Read`.
    inputs:
      chat-id:
        type: string
        in: path
        required: true
        description: The chat's id (`19:…`), from `teams.chat.list`.
      since:
        type: string
        required: true
        description: Keep messages changed strictly after this UTC time, `YYYY-MM-DDTHH:MM:SSZ`.
      page-size:
        type: int
        default: 20
        description: Messages to return, 1 to 50.
    outputs:
      type: single
      schema:
        messages:
          type: array
          items:
            id:                  string
            created-at:          string
            last-modified-at:    string
            message-type:        string
            sender:              object
            sender-withheld:     bool
            text:                string
            deleted:             bool
            attachments:         array
            attachments-omitted: number
            truncated:           array
        more-available: bool
        omitted:        number

  # ---- Outlook ----------------------------------------------------------

  outlook.mail.send:
    lifecycle: single
    category: curated
    permissions:
      scopes: [User.Read, Mail.Send]
      admin-consent: false
    # No microsoft-365 transport is shipped yet. Keep this command unavailable
    # until an implementation can return a truthful receipt for Graph's empty
    # 202 Accepted response without risking a duplicate send on retry.
    status: planned
    mode: write
    description: |
      Planned: send an email in plain text or HTML, with optional CC / BCC.
      Graph's sendMail endpoint returns 202 Accepted with no response body; that
      proves provider acceptance only and does not provide a message id.
    inputs:
      to:
        type: array
        items: string
      cc:
        type: array
        items: string
      bcc:
        type: array
        items: string
      subject:
        type: string
      body:
        type: string
      content-type:
        type: enum
        values: [text, html]
        default: text
      from:
        type: string
        description: |
          Optional `from` address — defaults to the authenticated user.
          Requires `Mail.Send.Shared` scope for shared mailboxes.
  outlook.mail.send-with-attachment:
    lifecycle: single
    category: curated
    permissions:
      scopes: [User.Read, Mail.Send]
      admin-consent: false
    # Sending the final draft has the same empty 202 response and ambiguous
    # post-dispatch failure boundary as sendMail. Do not advertise it as runnable
    # until a real transport implements an honest, at-most-once-safe receipt.
    status: planned
    mode: write
    description: |
      Planned: send an email with file attachments. Each attachment under 3 MB
      may use a simple request; 3–150 MB requires an upload session. Graph's final
      send returns 202 Accepted with
      no response body; that proves provider acceptance only, not delivery or a
      durable message id.
    inputs:
      to:
        type: array
        items: string
      subject: string
      body:    string
      content-type:
        type: enum
        values: [text, html]
        default: text
      attachments:
        type: array
        items:
          path:     string
          filename: string
  outlook.mail.search:
    lifecycle: single
    category: curated
    permissions:
      scopes: [User.Read, Mail.Read]
      admin-consent: false
    mode: read
    method: GET
    # Absolute: the request itself — route, input grammar, query, scopes,
    # bounds and projection — is code-owned in AWARE (`runtime/agent_call.rs`,
    # #709); this declaration only makes the command available.
    path: https://graph.microsoft.com/v1.0/me/messages
    description: |
      Search the signed-in person's mailbox: plain words (`text`) and/or a
      sender address (`from`), combined (all must match). Returns one page of
      matches sorted by sent date, not relevance — subject, sender, received
      time, a short preview and the Outlook link; never the body or attachment
      bytes. Typed inputs only, no free query language. Needs `User.Read` and
      `Mail.Read`.
    inputs:
      text:
        type: string
        description: |
          1 to 16 words of letters, digits, `.`, `_`, `-`, `@`, separated by
          spaces. Not AND/OR/NOT/NEAR, no word starting with `-`.
      from:
        type: string
        description: One sender address, e.g. `client@acme.com`.
      page-size:
        type: int
        default: 25
        description: Messages to return, 1 to 50.
    outputs:
      type: single
      schema:
        messages:
          type: array
          items:
            id:              string
            subject:         string
            from:            object
            received-at:     string
            preview:         string
            has-attachments: bool
            web-url:         string
            truncated:       array
        more-available: bool
        omitted:        number

  outlook.mail.folder.list:
    lifecycle: single
    category: curated
    permissions:
      scopes: [User.Read, Mail.Read]
      admin-consent: false
    mode: read
    method: GET
    # Absolute: the request itself — route, input grammar, query, scopes,
    # bounds and projection — is code-owned in AWARE (`runtime/agent_call.rs`,
    # #763); this declaration only makes the command available.
    path: https://graph.microsoft.com/v1.0/me/mailFolders/{parent-id}/childFolders
    description: |
      List the mail folders inside one folder — id, name, parent and how many
      subfolders, messages and unread messages each holds. `parent-id:
      msgfolderroot` lists the top level; a folder's `id` lists its
      subfolders. Hidden folders are not listed. Page with `skip`, taking
      `next-skip` from the previous answer. Needs `User.Read` and one of
      `Mail.ReadBasic`, `Mail.Read` (requested) or `Mail.ReadWrite`.
    inputs:
      parent-id:
        type: string
        in: path
        required: true
        description: A folder's id, or a well-known folder name such as `msgfolderroot` or `inbox`.
      page-size:
        type: int
        default: 50
        description: Folders to return, 1 to 100.
      skip:
        type: int
        default: 0
        description: Folders to skip — the `next-skip` of the previous page, 0 to 100,000.
    outputs:
      type: single
      schema:
        folders:
          type: array
          items:
            id:                 string
            name:               string
            parent-id:          string
            parent-id-withheld: bool
            child-count:        number
            total-count:        number
            unread-count:       number
            truncated:          array
        more-available: bool
        next-skip:      number
        limit-reached:  bool
        omitted:        number

  outlook.mail.folder.list-messages:
    lifecycle: single
    category: curated
    permissions:
      scopes: [User.Read, Mail.Read]
      admin-consent: false
    mode: read
    method: GET
    # Absolute: the request itself — route, input grammar, query, headers,
    # scopes, bounds, cursor and projection — is code-owned in AWARE
    # (`runtime/agent_call.rs`, #763); this declaration only makes the
    # command available.
    path: https://graph.microsoft.com/v1.0/me/mailFolders/{folder-id}/messages/delta
    description: |
      Read what changed in one mail folder, in Graph's order: each change is
      an `upsert` (a message added or changed, with its headers), a
      `removed` (a message deleted, moved out or recalled) or an
      `unidentifiable` entry at its `position`, counted in `unidentifiable`.
      The first call (no `cursor`) reads the whole folder page by page; pass
      each answer's `cursor` to the next call. `more-available: true` means
      the round is not finished; `false` means it is, and that answer's
      `cursor` asks later for what changed since. Every page comes back
      whole — `page-size` is a preference Graph may exceed. A cursor works
      only for the folder and account it came from; `cursor-expired` means
      start a new round without one. Ids stay the same when a message moves.
      Bodies are read with `outlook.mail.get-message`. Needs `User.Read` and
      one of `Mail.ReadBasic`, `Mail.Read` (requested) or `Mail.ReadWrite`.
    inputs:
      folder-id:
        type: string
        in: path
        required: true
        description: The folder's id, from `outlook.mail.folder.list`. Not a well-known name.
      page-size:
        type: int
        default: 25
        description: Changes Graph should send per page, 1 to 50 — a preference, not a cap.
      cursor:
        type: string
        description: The `cursor` of the previous answer; omit it to start a round.
    outputs:
      type: single
      schema:
        changes:
          type: array
          items:
            change:   string
            id:       string
            fields:   object
            reason:   string
            position: number
        unidentifiable: number
        cursor:         string
        more-available: bool

  outlook.mail.get-message:
    lifecycle: single
    category: curated
    permissions:
      scopes: [User.Read, Mail.Read]
      admin-consent: false
    mode: read
    method: GET
    # Absolute: the request itself — route, input grammar, query, scopes,
    # bounds and projection — is code-owned in AWARE (`runtime/agent_call.rs`,
    # #763); this declaration only makes the command available.
    path: https://graph.microsoft.com/v1.0/me/messages/{id}
    description: |
      Read one message — its headers, the folder it is in, its version, its
      body as plain text and the part it added to its thread
      (`unique-text`), and its attachments by name, type and size. Never
      attachment bytes. HTML is reduced to text in AWARE; each text is cut at
      65,536 characters and named in `truncated`. Ids stay the same when a
      message moves between folders. Needs `User.Read` and `Mail.Read`.
    inputs:
      id:
        type: string
        in: path
        required: true
        description: The message's id, from `outlook.mail.folder.list-messages`.
    outputs:
      type: single
      schema:
        id:                          string
        kind:                        string
        internet-message-id:         string
        internet-message-id-withheld: bool
        conversation-id:             string
        conversation-id-withheld:    bool
        subject:                     string
        from:                        object
        to:                          array
        cc:                          array
        recipients-omitted:          number
        received-at:                 string
        sent-at:                     string
        last-modified-at:            string
        draft:                       bool
        has-attachments:             bool
        preview:                     string
        web-url:                     string
        parent-folder-id:            string
        parent-folder-id-withheld:   bool
        change-key:                  string
        change-key-withheld:         bool
        text:                        string
        unique-text:                 string
        attachments:                 array
        attachments-omitted:         number
        attachments-state:           string
        truncated:                   array

  outlook.calendar.create-event:
    lifecycle: single
    category: curated
    permissions:
      scopes: [User.Read, Calendars.ReadWrite]
      admin-consent: false
    status: planned
    mode: write
    description: |
      Create a calendar event. Supports attendees, location, online-meeting
      (Teams) auto-create, time zone explicit (avoids ambiguity).
    inputs:
      subject: string
      start:
        type: string
        description: ISO 8601 with offset, e.g. `2026-05-20T14:00:00+01:00`.
      end:
        type: string
      time-zone:
        type: string
        description: IANA name, e.g. `Europe/London`.
      attendees:
        type: array
        items: string
      location:
        type: string
      online-meeting:
        type: boolean
        default: false
    outputs:
      type: single
      schema:
        event-id: string
        web-url:  string

  outlook.calendar.find-availability:
    lifecycle: single
    category: curated
    permissions:
      scopes: [User.Read, Calendars.Read.Shared]
      admin-consent: false
    status: planned
    description: |
      Find free time across a set of attendees within a window. Read-only.
      The "schedule a coordination meeting for the next week" primitive.
    inputs:
      attendees:
        type: array
        items: string
      window-start:
        type: string
        description: ISO 8601.
      window-end:
        type: string
      duration-minutes:
        type: number
        default: 30
    outputs:
      type: single
      schema:
        suggestions:
          type: array
          items:
            start: string
            end:   string

  # ---- Planner ----------------------------------------------------------

  planner.task.create:
    lifecycle: single
    category: curated
    permissions:
      scopes: [User.Read, Tasks.ReadWrite]
      admin-consent: false
    status: planned
    mode: write
    description: |
      Create a Planner task. Optional bucket, assigned-to, due-date.
      The "make a follow-up out of this RFI" / "create training task"
      primitive.
    inputs:
      plan-id:
        type: string
      bucket-id:
        type: string
      title:
        type: string
      assigned-to:
        type: array
        items: string
        description: User principal names or AAD object ids.
      due-date:
        type: string
        description: ISO 8601.
      notes:
        type: string
    outputs:
      type: single
      schema:
        task-id: string
        web-url: string

  planner.plan.list:
    lifecycle: single
    category: curated
    permissions:
      scopes: [User.Read, Tasks.Read]
      admin-consent: false
    mode: read
    method: GET
    # Absolute: the request itself — route, input grammar, query, scopes,
    # bounds and projection — is code-owned in AWARE (`runtime/agent_call.rs`,
    # #709); this declaration only makes the command available.
    path: https://graph.microsoft.com/v1.0/me/planner/plans
    description: |
      List the basic Planner plans Microsoft reports as shared with the
      signed-in person — id, title, its container (group or roster) and when
      it was made. Microsoft may leave out plans made in the new Planner, even
      in a group the person belongs to; an empty list is not proof of no plans.
      Premium (Project) plans are not included. Work or school accounts only.
      Needs `User.Read` and `Tasks.Read`.
    inputs:
      page-size:
        type: int
        default: 100
        description: Plans to return, 1 to 200.
    outputs:
      type: single
      schema:
        plans:
          type: array
          items:
            id:         string
            title:      string
            container:  object
            created-at: string
            truncated:  array
        more-available: bool
        omitted:        number

  planner.task.list:
    lifecycle: single
    category: curated
    permissions:
      scopes: [User.Read, Tasks.Read]
      admin-consent: false
    mode: read
    method: GET
    # Absolute: the request itself — route, input grammar, query, scopes,
    # bounds and projection — is code-owned in AWARE (`runtime/agent_call.rs`,
    # #709); this declaration only makes the command available.
    path: https://graph.microsoft.com/v1.0/planner/plans/{plan-id}/tasks
    description: |
      List the tasks of one Planner plan — title, bucket, progress, due and
      completed dates and the assignees' user ids. Work or school accounts
      only. Needs `User.Read` and `Tasks.Read`.
    inputs:
      plan-id:
        type: string
        in: path
        required: true
        description: The plan's id, from `planner.plan.list` or the plan's web address (planner.cloud.microsoft/.../plan/<id>/...).
      page-size:
        type: int
        default: 100
        description: Tasks to return, 1 to 200.
    outputs:
      type: single
      schema:
        tasks:
          type: array
          items:
            id:                  string
            title:               string
            bucket-id:           string
            percent-complete:    number
            due-date:            string
            completed-at:        string
            assigned-to:         array
            assigned-to-omitted: number
            truncated:           array
        more-available: bool
        omitted:        number

  planner.task.assign:
    lifecycle: single
    category: curated
    permissions:
      scopes: [User.Read, Tasks.ReadWrite]
      admin-consent: false
    status: planned
    mode: write
    description: |
      Add (or replace) assignees on a Planner task. The "ball-in-court"
      primitive — set who owns the next move.
    inputs:
      task-id: string
      assigned-to:
        type: array
        items: string
      replace:
        type: boolean
        default: false
        description: If false, appends; if true, replaces all assignees.
    outputs:
      type: single
      schema:
        task-id:      string
        assigned-to:  array

  planner.task.complete:
    lifecycle: single
    category: curated
    permissions:
      scopes: [User.Read, Tasks.ReadWrite]
      admin-consent: false
    status: planned
    mode: write
    description: Mark a Planner task complete (percentComplete = 100).
    inputs:
      task-id: string
    outputs:
      type: single
      schema:
        task-id: string

  # ---- SharePoint Lists -------------------------------------------------

  sharepoint.list.list:
    lifecycle: single
    category: curated
    permissions:
      scopes: [User.Read, Sites.Read.All]
      admin-consent: false
    mode: read
    method: GET
    # Absolute: the request itself — route, input grammar, query, scopes,
    # bounds and projection — is code-owned in AWARE (`runtime/agent_call.rs`,
    # #709); this declaration only makes the command available.
    path: https://graph.microsoft.com/v1.0/sites/{site-id}/lists
    description: |
      List a SharePoint site's lists (not its hidden system lists) — id, name,
      web link, template and modified time. Work or school accounts only.
      Needs `User.Read` and `Sites.Read.All`.
    inputs:
      site-id:
        type: string
        in: path
        required: true
        description: "`root` (the organisation's root site) or `host,site-guid,web-guid`."
      page-size:
        type: int
        default: 100
        description: Lists to return, 1 to 200.
    outputs:
      type: single
      schema:
        lists:
          type: array
          items:
            id:            string
            name:          string
            web-url:       string
            template:      string
            modified-time: string
            truncated:     array
        more-available: bool
        omitted:        number

  sharepoint.list.read:
    lifecycle: single
    category: curated
    permissions:
      scopes: [User.Read, Sites.Read.All]
      admin-consent: false
    mode: read
    method: GET
    # Absolute: the request itself — route, input grammar, query, scopes,
    # bounds and projection — is code-owned in AWARE (`runtime/agent_call.rs`,
    # #709); this declaration only makes the command available.
    path: https://graph.microsoft.com/v1.0/sites/{site-id}/lists/{list-id}/items
    description: |
      Read one page of a SharePoint list's rows — the "pull the project
      roster" / "read the door-spec list" primitive. Each row's columns are
      keyed by SharePoint's internal column names; person and lookup columns
      come back as their `…LookupId` values, as Graph returns them. Values
      AWARE does not pass on are counted (`skipped-fields`), cut text is named
      (`truncated-fields`). Work or school accounts only. Needs `User.Read`
      and `Sites.Read.All`.
    inputs:
      site-id:
        type: string
        in: path
        required: true
        description: "`root` or `host,site-guid,web-guid`."
      list-id:
        type: string
        in: path
        required: true
        description: The list's GUID, from `sharepoint.list.list`.
      page-size:
        type: int
        default: 100
        description: Rows to return, 1 to 200.
    outputs:
      type: single
      schema:
        items:
          type: array
          items:
            id:               string
            fields:           object
            skipped-fields:   number
            truncated-fields: array
            fields-missing:   bool
        more-available: bool
        omitted:        number

  sharepoint.list.append-row:
    lifecycle: single
    category: curated
    permissions:
      scopes: [User.Read, Sites.ReadWrite.All]
      admin-consent: false
    status: planned
    mode: write
    description: |
      Append a row to a SharePoint List. Used by ops teams to log app
      runs / RFIs / submittals into a central tracking list.
    inputs:
      site-id: string
      list-id: string
      fields:
        type: object
        description: Map of column display-name → value.
    outputs:
      type: single
      schema:
        item-id: string
        web-url: string

  # ---- Excel range ops --------------------------------------------------

  excel.range.read:
    lifecycle: single
    category: curated
    permissions:
      scopes: [User.Read, Files.ReadWrite]
      admin-consent: false
    mode: read
    method: GET
    # Absolute: the request itself — route, input grammar, query, scopes,
    # bounds and projection — is code-owned in AWARE (`runtime/agent_call.rs`,
    # #709); this declaration only makes the command available.
    path: https://graph.microsoft.com/v1.0/drives/{drive-id}/items/{item-id}/workbook/worksheets/{worksheet}/range(address='{range}')
    description: |
      Read one rectangle of cells from a workbook (e.g. `A1:D200` on
      `Load Table`) — the load-take-down / bulk-parameter-source primitive.
      Returns each cell's value, its displayed text and its type, exactly as
      Excel holds them (a date is its serial number in `values`, its formatted
      form in `text`). At most 5,000 cells. AWARE sends only a `GET` — no
      session, no body — and never changes the workbook. Microsoft documents
      only a write-class permission here, so it needs `User.Read` and
      `Files.ReadWrite`.
    inputs:
      drive-id:
        type: string
        in: path
        required: true
        description: Graph drive id, or `me` for the signed-in person's own OneDrive.
      item-id:
        type: string
        in: path
        required: true
        description: The workbook's item id.
      worksheet:
        type: string
        in: path
        required: true
        description: The worksheet's name, or its `{…}` id from `excel.worksheet.list`.
      range:
        type: string
        in: path
        required: true
        description: "A1 notation without `$` or a sheet name, e.g. `A1:D200`; at most 5,000 cells."
    outputs:
      type: single
      schema:
        address:                 string
        row-count:               number
        column-count:            number
        values:
          type: array
          items: array
        text:
          type: array
          items: array
        value-types:
          type: array
          items: array
        truncated-cells:         array
        truncated-cells-omitted: number

  excel.range.write:
    lifecycle: single
    category: curated
    permissions:
      scopes: [User.Read, Files.ReadWrite.All]
      admin-consent: false
    status: planned
    mode: write
    description: |
      Write a 2D array of values into a range. Replaces existing cell
      contents. For appending one row, prefer `excel.table.append-row`.
    inputs:
      drive-id:
        type: string
      item-id:
        type: string
      worksheet:
        type: string
      range:
        type: string
      values:
        type: array
        items: array
    outputs:
      type: single
      schema:
        cells-written: number

  excel.worksheet.list:
    lifecycle: single
    category: curated
    permissions:
      scopes: [User.Read, Files.ReadWrite]
      admin-consent: false
    mode: read
    method: GET
    # Absolute: the request itself — route, input grammar, query, scopes,
    # bounds and projection — is code-owned in AWARE (`runtime/agent_call.rs`,
    # #709); this declaration only makes the command available.
    path: https://graph.microsoft.com/v1.0/drives/{drive-id}/items/{item-id}/workbook/worksheets
    description: |
      List a workbook's worksheets — name, id, position and whether it is
      hidden. Pair with `excel.range.read` when the sheet is not known ahead of
      time; its `id` can be passed as `worksheet` unchanged. AWARE sends only a
      `GET` and never changes the workbook. Microsoft documents only a
      write-class permission here, so it needs `User.Read` and
      `Files.ReadWrite`.
    inputs:
      drive-id:
        type: string
        in: path
        required: true
        description: Graph drive id, or `me` for the signed-in person's own OneDrive.
      item-id:
        type: string
        in: path
        required: true
        description: The workbook's item id.
      page-size:
        type: int
        default: 100
        description: Worksheets to return, 1 to 200.
    outputs:
      type: single
      schema:
        worksheets:
          type: array
          items:
            id:         string
            name:       string
            position:   number
            visibility: string
        more-available: bool
        omitted:        number

  excel.worksheet.create:
    lifecycle: single
    category: curated
    permissions:
      scopes: [User.Read, Files.ReadWrite.All]
      admin-consent: false
    status: planned
    mode: write
    description: |
      Add a new worksheet to a workbook, optionally named. The "fresh
      `Phase N` sheet per run" primitive — create the tab, then
      `excel.range.write` into it. If a sheet with the name already exists
      Graph returns 409; catch it with `excel.worksheet.list` first.
    inputs:
      drive-id:
        type: string
      item-id:
        type: string
        description: Workbook file id.
      name:
        type: string
        description: |
          New worksheet name. Optional — Excel auto-names (`Sheet1`, …)
          when omitted. Max 31 chars; the characters \ / ? * : [ ] are
          rejected, as is a leading/trailing apostrophe.
    outputs:
      type: single
      schema:
        id:       string
        name:     string
        position: number

  excel.table.append-row:
    lifecycle: single
    category: curated
    permissions:
      scopes: [User.Read, Files.ReadWrite.All]
      admin-consent: false
    status: planned
    mode: write
    description: |
      Append a row to a named Excel Table (not raw range). Tables auto-
      grow + preserve formulas. The "log every QA run / RFI" primitive.
    inputs:
      drive-id:
        type: string
      item-id:
        type: string
      worksheet:
        type: string
      table-name:
        type: string
      values:
        type: array
        description: |
          Single row of values matching the table column order.
    outputs:
      type: single
      schema:
        row-index: number

