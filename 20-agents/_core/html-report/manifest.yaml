agent:        html-report
version:      0.2.0
display-name: HTML Report
description: |
  Utility agent for generating self-contained HTML reports — single-file
  documents with inlined CSS, runnable in any browser. The generic sink of
  AECO compositions that need a portable, sharable artifact: hand it any
  workflow's output and it renders a styled report (no per-scenario code).

  Lives under `_core/` because it's not tied to any AECO vertical — it's
  general output formatting that any agent's command may compose with.

stateful: false

vendor:   aware
license:  Apache-2.0
homepage: https://github.com/aware-aeco/aware/tree/main/20-agents/_core/html-report
keywords: [aware, html, report, output, viewer, dashboard]

requires:
  filesystem:
    - write: any                 # only when `render` is given an output-path

# Runtime built-in (#201): the renderer runs in-process in the `aware` runtime —
# there is no `aware-html-report` host binary to ship or install, so the agent is
# `available` (resolves the #161 unshipped-binary gap for this agent). Dispatch is
# routed by agent id to the generic HTML renderer (`cli/src/render/html_report.rs`).
transport:
  builtin: {}

commands:
  render:
    lifecycle: single
    # Read-mode: rendering mutates no system of record, so a report node needs no
    # `safety:` block — reporting stays frictionless for every app. When `output-path`
    # is given the runtime writes that artifact on a real run only (skipped under
    # --dry-run / --simulate), so a preview never touches disk.
    description: |
      Render an HTML report from an arbitrary data payload. Generic auto-render: an
      array of objects becomes a table (keys as columns), an object becomes a
      field/value table, a scalar renders as a single value, and nested structures are
      shown as compact JSON. No template needed.
    inputs:
      data:
        description: |
          Any JSON value to render. Array of objects -> table; object -> field/value
          table; scalar -> single value. Nested values render as compact JSON.
      title:
        type: string
        description: Optional page title; defaults to "Report".
      output-path:
        type: string
        description: Optional file path; when given, the HTML is also written there.
      template:
        type: string
        description: |
          Optional curated-layout name (reserved). Generic auto-render runs regardless;
          named vertical templates are a planned follow-on (#201).
    outputs:
      type: single
      schema:
        html:        string    # canonical self-contained HTML (the Viewer reads this)
        htmlReport:  string    # alias of `html` for descriptive consumers (Text Panel / logs)
        item-count:  int
        output-path: string    # present only when an output-path was given (file written)
        path:        string    # alias of `output-path` (the written artifact location)
        bytes:       int       # present only when written

skills:
  - styling.md
