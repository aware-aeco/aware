agent:        ifc
version:      0.1.2
display-name: IFC Writer
description: |
  Utility agent that writes a generic 3D scene to a universal IFC4 file (STEP / .ifc).
  Members, exact plates and grouped mechanical fasteners, per-product opening effects, structural grids,
  and elevation datums are rooted under an IfcProject -> IfcSite -> IfcBuilding ->
  IfcBuildingStorey spine. Host-free: pure serialization, no Tekla/Revit needed to export.

  The portable IFC sink of AWARE compositions, and the file-writing companion to `viewer-3d`:
  hand both the SAME domain-agnostic scene (elements as `from`->`to` boxes with a cross-section +
  groups) and one renders it in 3D while this one writes a model you can open in Tekla, SDS2,
  Revit or Navisworks — one scene, two outputs. The producer owns all domain meaning (a steel app
  maps members -> elements; the writer knows nothing about steel) and the output path.

  Lives under `_core/` because it's not tied to any AECO vertical. NOTE this is distinct from
  `tekla/ifc-export`, which exports a LIVE Tekla model to IFC (needs Tekla open); this `ifc` agent
  writes IFC from a generic scene with NO host.

stateful: false

vendor:   aware
license:  Apache-2.0
homepage: https://github.com/aware-aeco/aware/tree/main/20-agents/_core/ifc
keywords: [aware, ifc, ifc4, export, scene, bim, steel, output]

requires:
  filesystem:
    - write: any                 # only when `write` is given an output-path

# Runtime built-in: the writer runs in-process in the `aware` runtime — there is no `aware-ifc`
# host binary to ship or install, so the agent is `available`. Dispatch is routed by agent id to
# the scene-to-IFC writer (`cli/src/render/ifc.rs`).
transport:
  builtin: {}

commands:
  write:
    lifecycle: single
    # Read-mode for systems of record: writing an export file mutates no model, so a writer node
    # needs no `safety:` block. When `output-path` is given the runtime writes that artifact on a
    # real run only (skipped under --dry-run / --simulate), so a preview never touches disk.
    description: |
      Write a generic 3D scene to a universal IFC4 file (DesignTransferView). Legacy members may carry
      an `xsection` descriptor (i / channel / angle / rhs / chs / rect) -> the matching parametric
      IfcProfileDef (falling back to a rectangle for a missing/invalid descriptor); a neutral `role`
      (column/beam/brace -> IfcColumn/IfcBeam/IfcMember, else the legacy `group`); a `material` grade
      -> an IfcMaterial association; and the element's `group` colour -> an IfcStyledItem. A
      `kind:"mesh"` element (`positions`+`indices`) is written as an IfcTriangulatedFaceSet on an
      IfcBuildingElementProxy. Exact plates become IfcPlate. Standalone rods and fasteners become
      individual IfcMechanicalFastener products; every canonical bolt array becomes one selectable
      IfcMechanicalFastener whose body contains all authored shank, head, washer, and nut solids,
      matching IFC's native multi-fastener occurrence semantics. Bolt hole effects become distinct
      IfcOpeningElement/IfcRelVoidsElement pairs. Structural grids become IfcGrid/IfcGridAxis and
      Z datums become IfcAnnotation crosshairs. Weld and Boolean relationships are explicitly
      unsupported until an exact IFC mapping is reviewed. The writer is GENERIC — it applies whatever descriptor the scene
      carries (the domain owns the meaning). Output is deterministic (identical scene -> identical bytes).
    inputs:
      scene:
        type: object
        description: |
          The 3D scene to export (object) — the SAME schema `viewer-3d` renders. Shape:
          `{ meta:{name,units:"mm",up}, groups:[...], elements:[...], operations:[...],
             referenceSystems:[...], grids, panels }`.
          `xsection` (all mm) is one of: {shape:i,d,bf,tw,tf} | {shape:channel,d,bf,tw,tf} |
          {shape:angle,d,b,t} | {shape:rhs,d,b,t} | {shape:chs,od,t} | {shape:rect,w,d}.
          `role`/`material`/`xsection` are export hints this writer consumes for exact geometry and
          typing. Physical `member`/`line`/`box` records may carry finite numeric `rot`, interpreted
          by the shared directed right-handed section frame. IFC currently accepts only absent/`z`
          `meta.up`; Y-up fails until an explicit export transform is reviewed. `viewer-3d` renders
          the same `xsection`/`rot` contract. The producer owns all domain meaning; the writer is
          generic. See `viewer-3d`'s `scene-schema.md` for the canonical base scene contract.
      output-path:
        type: string
        description: Optional file path; when given, the IFC is written there (caller owns the path).
    outputs:
      type: single
      schema:
        output-path: string # present only when an output-path was given (the file written)
        path:        string # alias of output-path (the written artifact location)
        bytes:       int     # length of the IFC document in bytes
        members: int        # number of elements written
        columns:  int       # IfcColumn count (group=column)
        beams:    int       # IfcBeam count (everything not column/brace)
        meshes:   int       # IfcTriangulatedFaceSet proxy count (kind:"mesh" elements)
        profiles: object    # profile-string -> count breakdown (for the caller's report)
        emitted: array      # exhaustive successful identity rows with stable IFC GUIDs; a member
                            # seeded inside the vertical band also carries
                            # `zeroFrame:"vertical-seed"`, meaning its facing is convention
                            # rather than geometry (absent = derived from projected scene up)
        failed: array       # empty on success; malformed supported input fails before file output
        unsupported: array  # every intentionally unsupported identity
        warnings: array     # geometry-preserving legacy profile qualifications
